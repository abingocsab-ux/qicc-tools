      `<b>1. The overconsumption is real — and thickness explains part of it, but not all, and not everywhere.</b>
       Where the line is centred above nominal it costs compound directly: 3x300mm² 33 kV runs +5.2% over its nominal wall
       and 3x120 +4.4%, which is most of those products' variance. On 3x240 the mean sits <i>on</i> nominal, so thickness
       costs nothing there — and that run still shows overconsumption, so a second mechanism (purge, drum leftovers, die
       over-delivery beyond the measured points) has to account for it. Do not assume one cause covers every product.`}),
    (()=>{
      const adj=S.ledger.filter(l=>/adjmt/i.test(l.entry_type||''));
      if(adj.length){
        const tot=adj.reduce((a,l)=>a+ +l.quantity,0);
        const last=adj.map(l=>l.posting_date).sort().pop();
        const lastLed=S.ledger.map(l=>l.posting_date).filter(Boolean).sort().pop();
        const days=Math.round((new Date(lastLed)-new Date(last))/864e5);
        const n=el('div',{class:'note crit',html:
          `<b>2. The gap was being written off by hand — and then that stopped.</b>
           The ledger holds <b>${adj.length} manual stock adjustments totalling ${num(Math.abs(tot),2)} kg</b>, mostly in exact
           1,000 kg blocks, made outside any production order. The last one was ${dt(last)}, ${days} days before the end of the
           ledger. Those write-offs were what kept the book balance near reality. The overconsumption did not begin when they
           stopped — it simply stopped being papered over. Nothing in Navision is broken: all ${num(S.ledger.length)} entries
           reconcile with no gaps.`});
        n.append(el('div',{style:'margin-top:6px'},
          el('a',{href:'#',onclick:e=>{e.preventDefault();S.tab='sys';render();}},'See the full transaction audit →')));
        return n;
      }
      return el('div',{class:'note crit',html:
        `<b>2. The Navision gap is unposted consumption, not missing stock.</b>
         ${ledgerRuns.length
           ? `The imported ledger settles it: scrap physically leaves WIP but is never posted out of the WIP location, so it
              accumulates as phantom stock.`
           : `Import the Item Ledger export on the Navision tab and this becomes exact rather than inferred.`}`});
    })(),
    el('div',{class:'note warn',html:
      `<b>3. The percentages are inflated by missing data, not by the process.</b>
       Blank scrap fields, sheets whose line rate is physically impossible, runs of a few hundred kilos judged in percent,
       and multi-product sheets whose variance cannot be attributed to anything. Fix those and most of the alarm goes away.`}),
    el('div',{class:'note good',html:
      `<b>4. Underneath the noise there is a stable, predictable loss.</b>
       Consumption is described by <b>${num(m.fixed_loss_kg)} kg per run + ${m.variable_uplift_pct}% of BOM</b>
       (R² = 0.996 on PVC ST2 Natural, across a 50× run-size range). A fixed loss per run is line fill, head purge and
       screen change. The percentage on top is now traced to the start-of-length thickness bias.`}),
    el('div',{class:'note',html:
      `<b>5. The spread is the real process problem, and it is one repeatable effect.</b>
       Cpk on sheath thickness runs between 0.26 and 0.69 against the 1.33 normally required, and the
       ${seAvg?seAvg.toFixed(1):'~10'}% start-of-length bias is about half of that variation. With this much spread the line
       cannot hold the wall on nominal: to keep 99.9% of readings above the minimum on 3x240 it would have to run about
       6% thick — 6% more compound than the BOM. It currently runs below that, which is why on 28.06 <b>13% of readings
       fell under the minimum wall</b>. Halve the spread and nominal becomes safe to run. That is the one change that
       fixes the cost and the conformity risk together.`})));

  if(okE) out.append(card('Where the excess kilos go',
    `Across the ${ok.length} measurable runs, ${num(okA-okE)} kg was consumed above BOM. Roughly ${Math.round(fixedTotal/Math.max(okA-okE,1)*100)}% is a fixed cost per run and ${Math.round(varTotal/Math.max(okA-okE,1)*100)}% scales with output — the two need completely different fixes.`,
    chartWaterfall([
      {label:'Fixed loss\n@'+num(m.fixed_loss_kg)+' kg/run', v:fixedTotal, note:`<br>Start-up purge, line fill,<br>screen &amp; die changes &times; ${ok.length} runs`},
      {label:'Variable loss\n@'+m.variable_uplift_pct+'% of BOM', v:varTotal, note:'<br>Start-of-length over-thickness,<br>die over-delivery, drum leftovers'},
      {label:'Total excess\nover BOM', v:okA-okE, total:true, note:'<br>What you actually pay for'}])));

  out.append(card('The loss model vs flat BOM',
    'Each dot is a run. Grey is what your sheet measures against; green is what this line actually does. A solid red dot exceeded even the normal loss curve; a hollow one has a record that cannot be trusted.',
    chartModel(S.runs.filter(isRun))));

  out.append(card('What to do, in order',null, el('ol',{class:'tight'},
    el('li',{},el('b',{},'Attack the start-of-length thickness bias first. '),
      `It is about half of all the sheath variation, on every product and both compounds — and it is repeatable, so it has a mechanical cause. Removing it takes Cpk from ~0.5 to over 1.0, which lets the line run on nominal instead of choosing between thick walls and under-minimum cable. Look at line-speed ramp at drum change, die and tip centering, and start-up melt temperature.`),
    el('li',{},el('b',{},'Re-centre 3x300mm² 33 kV and 3x120 onto nominal. '),
      'Those two run 4–5% above their nominal wall, which is direct, measurable compound cost. 3x240 does not — so this is a product-specific setting, not a line-wide one.'),
    el('li',{},el('b',{},'Make Total Scrap a mandatory field, and post it out of WIP in Navision. '),
      'Scrap that leaves the floor but stays in the NAV WIP location is what builds the phantom balance.'),
    el('li',{},el('b',{},'Import the Item Ledger export every month. '),
      'The Navision tab reads the .xlsx straight from NAV and matches entries to runs by MR number — no retyping, and the reconciliation becomes exact instead of inferred.'),
    el('li',{},el('b',{},'Split multi-product sheets. '),
      'A sheet covering nine products across two extruders cannot tell you which product or which machine is losing material.'),
    el('li',{},el('b',{},'Fix the records that are impossible. '),
      'Any run flagged "not measurable" has a line rate or quantity that cannot be right.'),
    el('li',{},el('b',{},'Take one physical count and book a WIP adjustment '),
      'to clear the accumulated phantom, then keep it clean with the two changes above.'),
    el('li',{},el('b',{},'Re-target the sheet. '),
      `Compare to ${num(m.fixed_loss_kg)} kg + ${m.variable_uplift_pct}% and flag only what exceeds it, instead of flagging every run against flat BOM.`),
    el('li',{},el('b',{},'Check the BOMs against the drawing '),
      'using the kg/km calculator on the Settings tab — it is your own formula, π × (D + t) × t × density.'))));

  out.append(card('Run-by-run findings',null, runFindings(S.runs)));
  return out;
}
function runFindings(rs){
  const box=el('div');
  rs.slice().reverse().forEach(r=>{
    const d=r._d;
    box.append(el('div',{style:'display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0 8px'},
      el('h3',{},`${r.sheet_ref} · ${r.sizes||'—'}`), sevPill(d.verdict.sev,d.verdict.label),
      el('span',{class:'small muted mono'}, +r.expected_kg>0 ? `${pct(r.variance_pct)} vs BOM · ${sgn(d.resid)} kg vs model` : '')));
    box.append(el('div',{class:'note '+(d.verdict.sev==='crit'?'crit':d.verdict.sev==='good'?'good':d.verdict.sev==='info'?'':'warn'),html:d.verdict.text}));
    d.findings.forEach(f=> box.append(el('div',{style:'margin:8px 0 0;padding:9px 12px;border-left:2px solid var(--grid)'},
      el('div',{style:'margin-bottom:3px'}, sevPill(f.sev,f.title)),
      el('div',{class:'small sec',html:f.detail}))));
    if(!d.findings.length) box.append(el('div',{class:'small muted',style:'padding:0 12px'},'No data-quality or process flags.'));
  });
  return box;
}

/* ---------- runs ---------- */
/* A run can cover a dozen products; dumped into a narrow column the size list wraps one-per-line
   and makes the row enormous. Collapse anything past three products to a compact "N products"
   with a click-to-expand list, so every row stays the same height. */
function sizeCell(r){
  const machines = r.machines? ` · ${r.machines}` : '';
  const parts = String(r.sizes||'').split('+').map(s=>s.trim()).filter(Boolean);
  if(parts.length<=3) return el('td',{style:'min-width:120px'},(r.sizes||'—')+machines);
  const td=el('td',{style:'min-width:140px'});
  const list=el('div',{class:'small',style:'display:none;margin-top:4px;color:var(--ink-2);line-height:1.6'},
    parts.join(',  ')+machines);
  const cap=()=>`${parts.length} products${machines}`;
  const toggle=el('a',{href:'#',style:'color:var(--s1);cursor:pointer;text-decoration:none;white-space:nowrap',
    onclick:e=>{ e.preventDefault(); const open=list.style.display!=='none';
      list.style.display=open?'none':'block';
      toggle.textContent=(open?'▸ ':'▾ ')+cap(); }},
    '▸ '+cap());
  td.append(el('div',{},toggle), list);
  return td;
}
function viewRuns(){
  const t=el('table',{class:'rtable'});
  t.append(el('thead',{},el('tr',{},
    ...['Run','Size','Started','Withdrawn','Scrap','Core scrap','Floor open→close','BOM exp.','Actual','vs BOM','vs model','NAV gap','Phantom','Verdict','','']
      .map((h,i)=>el('th',{class:(i>=3&&i<=12)?'n':''},h)))));
  const tb=el('tbody');
  S.runs.slice().reverse().forEach(r=>{
    const d=r._d, gapSrc=r.ledger_posting_gap_kg!==null;

    tb.append(el('tr',{},
      el('td',{class:'rhead'},el('b',{},r.sheet_ref), r.record_type!=='run'? el('div',{class:'small muted'},r.record_type.replace('_',' ')):null),
      sz,
      el('td',{class:'mono','data-label':'Started'},dt(r.started_at)),
      el('td',{class:'n','data-label':'Withdrawn'},num(r.rm_withdrawn)),
      el('td',{class:'n','data-label':'Scrap'}, r.scrap_kg===null? el('span',{class:'pill crit'},'blank') : num(r.scrap_kg)),
      el('td',{class:'n '+((+r.core_scrap_pct||0)>5?'neg':''),'data-label':'Core scrap'},
        r.core_scrap_pct===null? '—' : `${num(r.core_scrap_m)} m (${(+r.core_scrap_pct).toFixed(1)}%)`),
      el('td',{class:'n','data-label':'Floor open→close'},`${num(r.phys_wip_open)} → ${num(r.phys_wip_close)}`),
      el('td',{class:'n','data-label':'BOM exp.'},+r.expected_kg>0?num(r.expected_kg):'—'),
      el('td',{class:'n','data-label':'Actual'},num(r.actual_kg)),
      el('td',{class:'n '+((+r.variance_kg)<0?'neg':'pos'),'data-label':'vs BOM'},+r.expected_kg>0?pct(r.variance_pct):'—'),
      el('td',{class:'n '+((d.resid)>0?'neg':'pos'),'data-label':'vs model'},+r.expected_kg>0?sgn(d.resid):'—'),
      el('td',{class:'n '+((+gap||0)<0?'neg':''),'data-label':'NAV gap'}, gap===null?'—':el('span',{title:gapSrc?'from the imported ledger':'inferred from the WIP balance'},sgn(gap)+(gapSrc?' ✓':''))),
      el('td',{class:'n neg','data-label':'Phantom'}, r.sys_var_close===null?'—':num(r.sys_var_close)),
      el('td',{'data-label':'Verdict'},sevPill(d.verdict.sev,d.verdict.label)),
      el('td',{class:'act','data-label':''}, el('button',{class:'btn sm',onclick:()=>openRunSummary(r.id)},'Summary')),
      el('td',{class:'act','data-label':''}, S.canEdit? el('button',{class:'btn sm',onclick:()=>openRun(r.id)},'Edit'):null)));
  });
  t.append(tb);
  return el('div',{},el('div',{class:'card'},
    el('div',{class:'chead',style:'margin-bottom:12px'},el('h2',{},'All records'),el('span',{style:'flex:1'}),
      S.canEdit? el('button',{class:'btn pri',onclick:()=>openRun(null)},'+ New run'):null),
    el('div',{class:'scroll'},t),
    el('div',{class:'note'},el('b',{},'vs model'),' is the number that matters — what the run used above the normal expected loss for a run of that size, so a small run is not punished for its start-up purge. A ',el('b',{},'✓'),' on the NAV gap means it came from the imported ledger rather than being inferred from the WIP balance.')));
}

/* ============================ self-contained HTML run report ============================
   One file, no external anything: inline styles and inline SVG charts, so it opens in any
   browser, prints cleanly, and survives being forwarded as an email attachment. */
const RHTML = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RCOL = {isc:'#2a78d6', ins:'#c8721e', osc:'#1a8f5f', exp:'#9a9892', act:'#2a78d6',
              bad:'#c62828', good:'#00701a', grid:'#e3e1da', ink:'#0b0b0b', mut:'#6b6a66'};

/* round an axis top up to 1/2/2.5/5 x 10^n so the gridline labels read cleanly */
function niceMax(v){
  if(!(v>0)) return 1;
  const e=Math.pow(10,Math.floor(Math.log10(v))), f=v/e;
  return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e;
}
/* grouped vertical bars — groups:[{label, bars:[{name,value,color}]}] */
function svgBars(groups, opts={}){
  const W=opts.w||720, H=opts.h||250, ML=58, MR=14, MT=18, MB=46;
  const pw=W-ML-MR, ph=H-MT-MB;
  const all=groups.flatMap(g=>g.bars.map(b=>+b.value||0));
  const max=niceMax(Math.max(1,...all)*1.08);
  const gw=pw/groups.length, names=groups[0]?groups[0].bars.map(b=>b.name):[];
  let o=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px" role="img">`;
  for(let i=0;i<=4;i++){ const v=max*i/4, y=MT+ph-ph*i/4;
    o+=`<line x1="${ML}" y1="${y.toFixed(1)}" x2="${W-MR}" y2="${y.toFixed(1)}" stroke="${RCOL.grid}" stroke-width="1"/>`
      +`<text x="${ML-6}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="${RCOL.mut}">${num(v)}</text>`; }
  groups.forEach((g,gi)=>{
    const n=g.bars.length, bw=Math.min(opts.bw||46,(gw*0.72)/n), x0=ML+gw*gi+(gw-bw*n)/2;
    g.bars.forEach((b,bi)=>{
      const v=+b.value||0, h=Math.max(1,ph*v/max), x=x0+bw*bi, y=MT+ph-h;
      o+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw-3).toFixed(1)}" height="${h.toFixed(1)}" fill="${b.color}" rx="2"/>`
        +`<text x="${(x+(bw-3)/2).toFixed(1)}" y="${(y-4).toFixed(1)}" text-anchor="middle" font-size="9.5" fill="${RCOL.ink}">${num(v)}</text>`;
    });
    o+=`<text x="${(ML+gw*gi+gw/2).toFixed(1)}" y="${(MT+ph+15).toFixed(1)}" text-anchor="middle" font-size="10.5" fill="${RCOL.ink}">${RHTML(g.label)}</text>`;
  });
  o+=`<line x1="${ML}" y1="${MT+ph}" x2="${W-MR}" y2="${MT+ph}" stroke="${RCOL.ink}" stroke-width="1"/>`;
  names.forEach((nm,i)=>{ const c=groups[0].bars[i].color, x=ML+i*130;
    o+=`<rect x="${x}" y="${H-14}" width="9" height="9" fill="${c}" rx="2"/>`
      +`<text x="${x+13}" y="${H-6}" font-size="10" fill="${RCOL.mut}">${RHTML(nm)}</text>`; });
  return o+'</svg>';
}
/* horizontal bars around a zero line, with an optional tolerance band */
function svgDiverge(items, opts={}){
  const W=opts.w||720, rowH=30, H=items.length*rowH+40, ML=118, MR=52;
  const pw=W-ML-MR;
  const max=Math.max(5,...items.map(i=>Math.abs(+i.value||0)))*1.2;
  const zx=ML+pw/2, sc=(pw/2)/max;
  let o=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px" role="img">`;
  if(opts.tol){ const t=Math.min(opts.tol,max)*sc;
    o+=`<rect x="${zx-t}" y="14" width="${2*t}" height="${items.length*rowH}" fill="#00701a" opacity="0.07"/>`; }
  o+=`<line x1="${zx}" y1="10" x2="${zx}" y2="${14+items.length*rowH}" stroke="${RCOL.ink}" stroke-width="1"/>`;
  items.forEach((it,i)=>{
    const v=+it.value||0, w=Math.abs(v)*sc, y=20+i*rowH;
    const x=v>=0? zx : zx-w, col=it.color||(v>0?RCOL.bad:RCOL.good);
    o+=`<text x="${ML-8}" y="${y+14}" text-anchor="end" font-size="11" fill="${RCOL.ink}">${RHTML(it.label)}</text>`
      +`<rect x="${x.toFixed(1)}" y="${y}" width="${Math.max(1,w).toFixed(1)}" height="18" fill="${col}" rx="2"/>`
      +`<text x="${(v>=0? x+w+6 : x-6).toFixed(1)}" y="${y+13}" text-anchor="${v>=0?'start':'end'}" font-size="10.5" font-weight="600" fill="${col}">${pct(v,2)}</text>`;
  });
  o+=`<text x="${zx}" y="${H-6}" text-anchor="middle" font-size="9.5" fill="${RCOL.mut}">0% = exactly on recipe${opts.tol?`  ·  shaded band = ±${opts.tol}% tolerance`:''}</text>`;
  return o+'</svg>';
}
/* one stacked bar per category, showing what the expected consumption is made of */
function svgStack(cats, opts={}){
  const W=opts.w||720, H=cats.length*46+34, ML=118, MR=110;
  const pw=W-ML-MR;
  const tot=Math.max(1,...cats.map(c=>c.parts.reduce((a,p)=>a+Math.max(0,+p.value||0),0)));
  let o=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px" role="img">`;
  cats.forEach((c,i)=>{
    const y=8+i*46; let x=ML;
    const sum=c.parts.reduce((a,p)=>a+Math.max(0,+p.value||0),0);
    o+=`<text x="${ML-8}" y="${y+19}" text-anchor="end" font-size="11" fill="${RCOL.ink}">${RHTML(c.label)}</text>`;
    c.parts.forEach(p=>{
      const v=Math.max(0,+p.value||0); if(!v) return;
      const w=pw*v/tot;
      o+=`<rect x="${x.toFixed(1)}" y="${y}" width="${w.toFixed(1)}" height="26" fill="${p.color}" rx="1"/>`;
      if(w>44) o+=`<text x="${(x+w/2).toFixed(1)}" y="${y+17}" text-anchor="middle" font-size="9.5" fill="#fff">${num(v)}</text>`;
      x+=w;
    });
    o+=`<text x="${(x+8).toFixed(1)}" y="${y+18}" font-size="10.5" fill="${RCOL.mut}">${num(sum)} kg${opts.suffix||''}</text>`;
  });
  const legend=(cats[0]||{parts:[]}).parts;
  legend.forEach((p,i)=>{ const x=ML+i*168;
    o+=`<rect x="${x}" y="${H-13}" width="9" height="9" fill="${p.color}" rx="2"/>`
      +`<text x="${x+13}" y="${H-5}" font-size="10" fill="${RCOL.mut}">${RHTML(p.name)}</text>`; });
  return o+'</svg>';
}
/* readings in sequence, with spec lines */
function svgReadings(pts, opts={}){
  const W=opts.w||720, H=opts.h||230, ML=52, MR=(opts.lines&&opts.lines.length)?96:14, MT=14, MB=38;
  const pw=W-ML-MR, ph=H-MT-MB;
  const ys=pts.map(p=>p.y).concat(opts.lines?opts.lines.map(l=>l.v):[]).filter(v=>v!=null);
  if(!ys.length) return '';
  let lo=Math.min(...ys), hi=Math.max(...ys); const pad=(hi-lo)*0.18||0.1; lo-=pad; hi+=pad;
  const X=i=> ML + (pts.length<2? pw/2 : pw*i/(pts.length-1));
  const Y=v=> MT + ph - ph*(v-lo)/(hi-lo);
  let o=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px" role="img">`;
  for(let i=0;i<=4;i++){ const v=lo+(hi-lo)*i/4, y=Y(v);
    o+=`<line x1="${ML}" y1="${y.toFixed(1)}" x2="${W-MR}" y2="${y.toFixed(1)}" stroke="${RCOL.grid}"/>`
      +`<text x="${ML-6}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="9.5" fill="${RCOL.mut}">${v.toFixed(2)}</text>`; }
  (opts.lines||[]).forEach(l=>{ if(l.v==null) return; const y=Y(l.v);
    o+=`<line x1="${ML}" y1="${y.toFixed(1)}" x2="${W-MR}" y2="${y.toFixed(1)}" stroke="${l.color}" stroke-width="1.4" stroke-dasharray="5 3"/>`
      +`<text x="${(W-MR+5).toFixed(1)}" y="${(y+3.5).toFixed(1)}" font-size="9.5" fill="${l.color}">${RHTML(l.name)} ${l.v.toFixed(2)}</text>`; });
  const path=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(p.y).toFixed(1)}`).join(' ');
  o+=`<path d="${path}" fill="none" stroke="${RCOL.act}" stroke-width="1.4" opacity="0.55"/>`;
  pts.forEach((p,i)=> o+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3.1" fill="${p.color||RCOL.act}"/>`);
  o+=`<line x1="${ML}" y1="${MT+ph}" x2="${W-MR}" y2="${MT+ph}" stroke="${RCOL.ink}"/>`
    +`<text x="${ML}" y="${H-6}" font-size="9.5" fill="${RCOL.mut}">${RHTML(opts.xlab||'reading order')}</text>`;
  return o+'</svg>';
}

.kpi .s{font-size:8.5pt;color:#4a4945}
.f{border-left:3px solid #e3e1da;padding:2px 0 2px 11px;margin:0 0 9px}
.f .t{font-weight:650;font-size:10pt}
.f .d{font-size:9.5pt;color:#3d3c39}
.f.crit{border-left-color:#c62828}.f.warn{border-left-color:#e08a1e}.f.info{border-left-color:#2a78d6}
.tag{display:inline-block;font-size:8pt;font-weight:700;padding:1px 6px;border-radius:4px;
  border:1px solid currentColor;margin-right:6px;vertical-align:1px}
figure{margin:4px 0 6px}
figcaption{font-size:9pt;color:#6b6a66;margin-top:2px}
footer{margin-top:26px;padding-top:8px;border-top:1px solid #e8e6df;color:#6b6a66;font-size:8.5pt}
@media print{@page{size:A4;margin:14mm} body{padding:0;max-width:none} h2{page-break-after:avoid}
  figure,table,.f{page-break-inside:avoid}}
`;
function reportShell(title, inner){
  return `<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>${RHTML(title)}</title><style>${REPORT_CSS}</style></head><body>${inner}
<footer>Generated by the Material Consumption Monitor on ${RHTML(new Date().toLocaleString('en-GB'))}.
Figures come straight from the run record — opening stock + withdrawn − closing − scrap for actual,
and BOM × metres for expected.</footer></body></html>`;
}
const fBlock = f => `<div class="f ${f.sev}"><div class="t">${RHTML(f.title)}</div>`
  +`<div class="d">${String(f.detail??'').replace(/<(?!\/?b\b)[^>]*>/g,'')}</div></div>`;

function ccvRunReport(g){
  const ref=g.base.replace(/^CCV /,'');
  const L=CCV_LAYERS.map(([k,name])=>({k,name,r:g.L[k],col:{ISC:RCOL.isc,INS:RCOL.ins,OSC:RCOL.osc}[k]})).filter(x=>x.r);
  const vsBom=r=>-(+r.variance_pct);
  let h=`<div class="rule"></div><h1>CCV run summary — ${RHTML(ref)}</h1>
<div class="meta">${RHTML(g.sizes||'')}${g.mr?' &middot; MR '+RHTML(g.mr):''}<br>
${RHTML(dt(g.started_at))} → ${RHTML(dt(g.stopped_at))} &middot; ${num(g.metres)} cable m &middot; ${g.cores??'?'} cores
&middot; core scrap ${g.core_scrap_pct===null?'—':`${num(g.core_scrap_m)} m (${(+g.core_scrap_pct).toFixed(1)}%)`}</div>
<div class="kpis">`;
  L.forEach(x=>{ const v=vsBom(x.r);
    h+=`<div class="kpi"><div class="l">${RHTML(x.name)}</div>
<div class="v ${v>0?'neg':'pos'}">${+x.r.expected_kg>0?pct(v,2):'—'}</div>
<div class="s">${num(x.r.actual_kg)} kg used against ${num(x.r.expected_kg)} expected &middot; ${RHTML(x.r._d.verdict.label)}</div></div>`; });
  h+=`</div><p class="mut" style="font-size:9.5pt">A positive percentage means more material was used than the recipe allows.</p>`;

  h+=`<h2>Material balance</h2><table><thead><tr><th></th>${L.map(x=>`<th class="n">${RHTML(x.name)}</th>`).join('')}</tr></thead><tbody>`;
  const row=(lab,fn,em)=>{ h+=`<tr${em?' class="em"':''}><td>${lab}</td>`
    +L.map(x=>`<td class="n">${fn(x.r)}</td>`).join('')+'</tr>'; };
  row('Floor WIP — opening', r=>num(r.phys_wip_open));
  row('RM withdrawn from store', r=>num(r.rm_withdrawn));
  row('Bleed scrap (weighed)', r=> r.scrap_kg===null?'<span class="neg">blank</span>':num(r.scrap_kg));
  row('Floor WIP — closing', r=>num(r.phys_wip_close));
  row('Actual consumed', r=>num(r.actual_kg), true);
  row('BOM expected', r=> +r.expected_kg>0?num(r.expected_kg):'—');
  row('— of which on scrapped cable', r=>{ const kg=scrapMaterialKg(r);
    return kg===null?'—':`${num(kg)} <span class="mut">(${(kg/(+r.expected_kg)*100).toFixed(1)}%)</span>`; });
  h+=`<tr class="em"><td>vs BOM</td>`+L.map(x=>{ const v=vsBom(x.r);
    return `<td class="n ${v>0?'neg':'pos'}">${+x.r.expected_kg>0?pct(v,2):'—'}</td>`; }).join('')+'</tr>';
  h+=`<tr><td>Verdict</td>`+L.map(x=>`<td class="n">${RHTML(x.r._d.verdict.label)}</td>`).join('')+'</tr></tbody></table>';

  h+=`<h2>Expected against actual</h2><figure>${svgBars(L.map(x=>({label:x.name,bars:[
      {name:'BOM expected',value:+x.r.expected_kg,color:RCOL.exp},
      {name:'Actually consumed',value:+x.r.actual_kg,color:x.col}]})))}
<figcaption>Kilograms. The gap between the pair is the variance for that material.</figcaption></figure>`;

  h+=`<h2>How far each material sits from its recipe</h2><figure>${
    svgDiverge(L.map(x=>({label:x.name,value:vsBom(x.r)})),{tol:5})}
<figcaption>Right of the line is over the recipe, left is under.</figcaption></figure>`;

  const scLines=L.map(x=>{ const sc=scrapMaterialKg(x.r); return sc===null?null
      :`${x.name} ${num(sc)} kg (${(sc/(+x.r.expected_kg)*100).toFixed(1)}%)`; }).filter(Boolean).join(' &middot; ');
  h+=`<h2>What the recipe expected, split by where it went</h2><figure>${svgStack(L.map(x=>{
      const sc=scrapMaterialKg(x.r)||0, exp=+x.r.expected_kg||0;
      return {label:x.name, parts:[
        {name:'On cable that shipped', value:exp-sc, color:x.col},
        {name:'On cable that was scrapped', value:sc, color:'#c9a227'}]};}),{suffix:' expected'})}
<figcaption>Start-up, joint and stop scrap is real cable that was extruded and thrown away, costed here at the run's own recipe${scLines?' — '+scLines:''}. On a short run this is the single biggest cost on the sheet.</figcaption></figure>`;

  const sizes=[...new Set(CCV_LAYERS.flatMap(([k])=>(g.L[k]?._items||[]).map(i=>i.size)))];
  if(sizes.length>1){
    h+=`<h2>Products on this sheet (${sizes.length})</h2>
<p class="mut" style="font-size:9.5pt">This run covers more than one product, so each is costed against its own recipe. These add up to the BOM expected line above.</p>
<table><thead><tr><th>Product</th><th>MR</th><th class="n">Metres</th>${L.map(x=>`<th class="n">${RHTML(x.name)}</th>`).join('')}</tr></thead><tbody>`;
    sizes.forEach(size=>{ let m=null,mr='';
      CCV_LAYERS.forEach(([k])=>{ const it=(g.L[k]?._items||[]).find(i=>i.size===size);
        if(it){ if(m==null)m=+it.metres; mr=mr||it.mr_numbers||''; } });
      h+=`<tr><td>${RHTML(size)}</td><td class="mut">${RHTML(mr||'—')}</td><td class="n">${num(m)}</td>`
       +L.map(x=>{ const it=(x.r._items||[]).find(i=>i.size===size);
          return `<td class="n">${it?num(+it.bom_kg_per_km*+it.metres/1000):'—'}</td>`; }).join('')+'</tr>'; });
    h+='</tbody></table>';
  }

  L.forEach(x=>{
    const rd=S.thk.filter(t=>t.run_id===x.r.id&&t.thk_ave!=null).sort((a,b)=>a.seq-b.seq);
    if(rd.length<2) return;
    const p=S.products.find(pp=>pp.item_id===x.r.item_id&&pp.size===(x.r._items||[])[0]?.size);
    h+=`<h2>${RHTML(x.name)} — wall thickness by drum</h2><figure>${
      svgReadings(rd.map(t=>({y:+t.thk_ave,color:x.col})),{xlab:'drum, in order',lines:[
        p&&p.std_thk_nom!=null?{v:+p.std_thk_nom,name:'nominal',color:RCOL.mut}:null,
        p&&p.std_thk_min!=null?{v:+p.std_thk_min,name:'minimum',color:RCOL.bad}:null].filter(Boolean)})}
<figcaption>Average wall per drum, millimetres. Running above nominal puts material on the cable that the recipe does not pay for.</figcaption></figure>`;
  });

  const seen=new Set(); let fh='';
  CCV_LAYERS.forEach(([k])=>{ const r=g.L[k]; if(!r) return;
    r._d.findings.forEach(f=>{ if(!CCV_RUNLEVEL.has(f.code)||f.code==='DATES_ONLY'||seen.has(f.code)) return;
      seen.add(f.code); fh+=fBlock(f); }); });
  L.forEach(x=> x.r._d.findings.filter(f=>!CCV_RUNLEVEL.has(f.code))
    .forEach(f=> fh+=fBlock({...f,title:x.name+' — '+f.title})));
  if(fh) h+=`<h2>Findings</h2>${fh}`;
  return {html:reportShell(`CCV run summary — ${ref}`,h), ref};
}

function st2RunReport(r){
  const d=r._d, mats=S.mats.filter(m=>m.run_id===r.id);
  const bm=d.bm, sc=scrapMaterialKg(r);
  let h=`<div class="rule"></div><h1>Run summary — ${RHTML(r.sheet_ref)}</h1>
<div class="meta">${RHTML(S.item.description||S.item.item_no)}${r.sizes?' &middot; '+RHTML(r.sizes):''}${r.machines?' &middot; '+RHTML(r.machines):''}<br>
${RHTML(dt(r.started_at))} → ${RHTML(dt(r.stopped_at))} &middot; core scrap ${r.core_scrap_pct===null?'—':`${num(r.core_scrap_m)} m (${(+r.core_scrap_pct).toFixed(1)}%)`}</div>
<div class="kpis">
<div class="kpi"><div class="l">vs BOM</div><div class="v ${(+r.variance_kg)<0?'neg':'pos'}">${+r.expected_kg>0?pct(r.variance_pct):'—'}</div>
<div class="s">${num(r.actual_kg)} kg used against ${num(r.expected_kg)} expected</div></div>
<div class="kpi"><div class="l">vs normal loss model</div><div class="v ${d.resid>0?'neg':'pos'}">${+r.expected_kg>0?sgn(d.resid):'—'} kg</div>
<div class="s">the figure that matters — a small run is not punished for its start-up purge</div></div>
<div class="kpi"><div class="l">Verdict</div><div class="v">${RHTML(d.verdict.label)}</div>
<div class="s">${RHTML(String(d.verdict.text||'').replace(/<[^>]*>/g,'').slice(0,120))}</div></div>
</div>`;

  h+=`<h2>Material balance</h2><table><tbody>
<tr><td>Floor WIP — opening</td><td class="n">${num(r.phys_wip_open)}</td></tr>
<tr><td>RM withdrawn from store</td><td class="n">${num(r.rm_withdrawn)}</td></tr>
<tr><td>Total scrap</td><td class="n">${r.scrap_kg===null?'<span class="neg">blank — charged to consumption</span>':num(r.scrap_kg)}</td></tr>
${(()=>{const ds=runDeclaredScrap(r); return ds?`<tr><td>Scrap declared in Navision</td><td class="n">${num(ds.kg)}</td></tr>`:'';})()}
<tr><td>Floor WIP — closing</td><td class="n">${num(r.phys_wip_close)}</td></tr>
<tr class="em"><td>Actual consumed</td><td class="n">${num(r.actual_kg)}</td></tr>
<tr><td>BOM expected</td><td class="n">${+r.expected_kg>0?num(r.expected_kg):'—'}</td></tr>
<tr><td>— of which on scrapped cable</td><td class="n">${sc===null?'—':`${num(sc)} <span class="mut">(${(sc/(+r.expected_kg)*100).toFixed(1)}%)</span>`}</td></tr>
<tr class="em"><td>vs BOM</td><td class="n ${(+r.variance_kg)<0?'neg':'pos'}">${+r.expected_kg>0?pct(r.variance_pct):'—'}</td></tr>
</tbody></table>`;

  const items=(r._items||[]);
  if(items.length){
    let tm=0,te=0;
    const rows=items.map(i=>{ const m=+i.metres||0,bom=+i.bom_kg_per_km||0,exp=bom*m/1000; tm+=m; te+=exp;
      return `<tr><td>${RHTML(i.size||'—')}</td><td class="mut">${RHTML(i.mr_numbers||'—')}</td><td>${RHTML(i.machine||'—')}</td>`
        +`<td class="n">${num(bom,1)}</td><td class="n">${num(m)}</td><td class="n">${num(exp)}</td></tr>`; }).join('');
    h+=`<h2>Products on this run (${items.length})</h2>`
      +(items.length>1?`<p class="mut" style="font-size:9.5pt">Each size is costed against its own BOM; the rows add up to the totals above.</p>`:'')
      +`<table><thead><tr><th>Size / product</th><th>MR number(s)</th><th>Line</th>`
      +`<th class="n">BOM kg/km</th><th class="n">Length (m)</th><th class="n">Expected kg</th></tr></thead><tbody>${rows}`
      +`<tr class="em"><td>Total</td><td></td><td></td><td class="n"></td><td class="n">${num(tm)}</td><td class="n">${+r.expected_kg>0?num(r.expected_kg):num(te)}</td></tr>`
      +`</tbody></table>`;
  }

  h+=`<h2>Against BOM and against the loss model</h2><figure>${svgBars([{label:r.sheet_ref,bars:[
      {name:'BOM expected',value:+r.expected_kg,color:RCOL.exp},
      {name:'Normal loss model',value:bm,color:'#c9a227'},
      {name:'Actually consumed',value:+r.actual_kg,color:RCOL.act}]}],{w:440,bw:66})}
<figcaption>Flat BOM is not achievable on any run — the model adds the fixed per-run loss plus the normal uplift. Judge the run against the middle bar.</figcaption></figure>`;

  const ng=runNavGap(r);
  if(ng){
    h+=`<h2>Navision gap either side of the run</h2>
<table><thead><tr><th></th><th class="n">Before the run</th><th class="n">After the run</th></tr></thead><tbody>
<tr><td>Floor count (WIP)</td><td class="n">${ng.floorO==null?'—':num(ng.floorO)}</td><td class="n">${ng.floorC==null?'—':num(ng.floorC)}</td></tr>
<tr><td>${ng.fromLedger?'Navision WIP (from ledger)':'Navision WIP (typed on sheet)'}</td><td class="n">${ng.navO==null?'—':num(ng.navO)}</td><td class="n">${ng.navC==null?'—':num(ng.navC)}</td></tr>
<tr><td>Floor − Navision</td><td class="n ${ng.gapO<0?'neg':''}">${ng.gapO==null?'—':sgn(ng.gapO)}</td><td class="n ${ng.gapC<0?'neg':''}">${ng.gapC==null?'—':sgn(ng.gapC)}</td></tr>
<tr class="em"><td>Moved over this run</td><td class="n"></td><td class="n ${ng.move!=null&&ng.move<0?'neg':'pos'}">${ng.move==null?'—':sgn(ng.move)}</td></tr>
</tbody></table>
<p class="mut" style="font-size:9.5pt">Navision figures are ${RHTML(ng.basis)}. Negative <b>Floor − Navision</b> means the book is carrying more than the floor holds; the movement is what this run contributed to the phantom balance.${ng.mismatch?` The sheet had recorded Navision as ${ng.sheetO==null?'—':num(ng.sheetO)} → ${ng.sheetC==null?'—':num(ng.sheetC)}, read off the screen before postings landed.`:''}</p>`;
  }

  const rd=S.thk.filter(t=>t.run_id===r.id&&t.thk_ave!=null).sort((a,b)=>a.seq-b.seq);
  if(rd.length>1){
    const p=S.products.find(pp=>pp.size===(r._items||[])[0]?.size);
    h+=`<h2>Sheath thickness through the run</h2><figure>${
      svgReadings(rd.map(t=>({y:+t.thk_ave,color:t.position==='START'?RCOL.bad:RCOL.act})),
        {xlab:'reading order — red = start of a length, blue = end',lines:[
          p&&p.std_thk_nom!=null?{v:+p.std_thk_nom,name:'nominal',color:RCOL.mut}:null,
          p&&p.std_thk_min!=null?{v:+p.std_thk_min,name:'min at point',color:RCOL.bad}:null].filter(Boolean)})}
<figcaption>Average wall per reading, millimetres.${r.start_end_dev_pct!=null?` Starts run ${pct(r.start_end_dev_pct,1)} against ends.`:''}</figcaption></figure>`;
  }

  if(mats.length){
    h+=`<h2>Other materials</h2><table><thead><tr><th>Material</th><th class="n">Opening</th><th class="n">Withdrawn</th><th class="n">Closing</th><th class="n">Actual</th><th class="n">Expected</th></tr></thead><tbody>`;
    mats.forEach(m=>{ const a=(m.opening_kg==null||m.closing_kg==null)?null:(+m.opening_kg+(+m.withdrawn_kg||0)-+m.closing_kg);
      h+=`<tr><td>${RHTML(m.label)}</td><td class="n">${num(m.opening_kg)}</td><td class="n">${num(m.withdrawn_kg)}</td>`
       +`<td class="n">${num(m.closing_kg)}</td><td class="n">${a===null?'—':num(a)}</td><td class="n">${num(m.expected_kg)}</td></tr>`; });
    h+='</tbody></table>';
  }
  if(d.findings.length) h+=`<h2>Findings</h2>${d.findings.map(fBlock).join('')}`;
  return {html:reportShell(`Run summary — ${r.sheet_ref}`,h), ref:r.sheet_ref};
}

/* Sending is deliberately manual. navigator.share() only settles when the OS share sheet
   is dismissed, and on a locked-down corporate desktop that sheet may never appear — awaiting
   it hangs the button with no way out. So every route is its own button, nothing is awaited
   in a way that can block, and the dialog stays open so there is always an escape. */
function buildMailto(subject, body, filename){
  const note = filename
    ? `\n\n---\n${filename} has been saved to your Downloads — attach it to this email. It opens in any browser.` : '';
  return 'mailto:?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body+note);
}
const safeName = s => String(s).replace(/[\/\\:*?"<>|]/g,'-');
function clickA(attrs){ const a=el('a',attrs); document.body.append(a); a.click(); a.remove(); }
function previewReport(html){
  const url=URL.createObjectURL(new Blob([html],{type:'text/html'}));
  const w=window.open(url,'_blank');
  if(!w) alert('Your browser blocked the pop-up. Allow pop-ups for this site, or use Email report → Download.');
  setTimeout(()=>URL.revokeObjectURL(url),60000);
}
function sendReportDialog(pack){
  const {html, filename, subject, body} = pack;
  const blob=new Blob([html],{type:'text/html'});
  const kb=Math.max(1,Math.round(blob.size/1024));
  const m=el('div',{class:'modal',onclick:e=>{if(e.target===m)m.remove();}});
  const c=el('div',{class:'card',style:'max-width:560px'});
  const msg=el('div',{id:'sendMsg',class:'small muted',style:'margin-top:12px;min-height:20px'});
  const say=(t,cls)=>{ msg.textContent=t; msg.className='small '+(cls||'muted'); };
  const opt=(label,help,fn,pri)=> el('div',{style:'margin-bottom:12px'},
    el('button',{class:'btn'+(pri?' pri':''),onclick:fn},label),
    el('div',{class:'small muted',style:'margin-top:4px'},help));

  c.append(el('div',{class:'chead'},el('h2',{},'Send this report')));
  c.append(el('div',{class:'csub'},
    `${filename} · ${kb} KB · self-contained, opens in any browser. Nothing is sent until you pick one of these.`));

  c.append(opt('Download the report',
    'Saves the file, then attach it to an email yourself. This always works, whatever the browser or mail system.',
    ()=>{ const url=URL.createObjectURL(blob);
      clickA({href:url,download:filename});
      setTimeout(()=>URL.revokeObjectURL(url),20000);
      say('Saved to your Downloads as '+filename,'pos'); }, true));

  c.append(opt('Open an email draft',
    'Opens your mail program with the subject and headline figures already filled in — attach the downloaded file to it.',
    ()=>{ clickA({href:buildMailto(subject,body,filename)});
      say('If nothing opened, this machine has no default mail program — use Download instead, or copy the figures below.'); }));

  c.append(opt('Open in a new tab',
    'Then use the browser’s Print → Save as PDF and attach that PDF. Use this route if your mail system strips .html attachments.',
    ()=>{ const url=URL.createObjectURL(blob); const w=window.open(url,'_blank');
      if(!w) say('The browser blocked the pop-up — allow pop-ups for this site, or use Download.','err');
      else say('Opened in a new tab.','pos');
      setTimeout(()=>URL.revokeObjectURL(url),60000); }));

  let shareOk=false;
  try{ shareOk = !!(navigator.canShare && navigator.canShare({files:[new File([blob],filename,{type:'text/html'})]})); }
  catch(e){ shareOk=false; }
  if(shareOk) c.append(opt('Share…',
    'Hands the file to your device’s share sheet. Handy on a phone or tablet; on a locked-down desktop it may not respond, in which case use Download.',
    ()=>{ say('Opening the share sheet — if nothing happens, use Download.');
      /* deliberately not awaited: a share sheet that never resolves must not block this dialog */
      navigator.share({files:[new File([blob],filename,{type:'text/html'})], title:subject, text:body})
        .then(()=>say('Handed to the app you chose.','pos'))
        .catch(e=>say(e && e.name==='AbortError' ? 'Share cancelled.'
          : 'This device would not share the file — use Download instead.','err')); }));

  c.append(opt('Copy the figures as text',
    'Paste straight into an email body if attachments are awkward.',
    ()=>{ const t=subject+'\n\n'+body;
      (navigator.clipboard? navigator.clipboard.writeText(t) : Promise.reject())
        .then(()=>say('Copied to the clipboard.','pos'))
        .catch(()=>{ const ta=el('textarea',{style:'position:fixed;left:-9999px'}); ta.value=t;
          document.body.append(ta); ta.select();
          try{ document.execCommand('copy'); say('Copied to the clipboard.','pos'); }
          catch(e2){ say('Could not copy — use the email draft option.','err'); }
          ta.remove(); }); }));

  c.append(el('div',{class:'note'},el('b',{},'If the attachment does not arrive. '),
    'Some mail systems quietly strip .html attachments. If a recipient says the file is missing, use ',
    el('b',{},'Open in a new tab'),' and send it as a PDF instead.'));
  c.append(msg);
  c.append(el('div',{style:'margin-top:10px'},
    el('button',{class:'btn',onclick:()=>m.remove()},'Close')));
  m.append(c); document.body.append(m);
}
function ccvReportPack(g){
  const {html,ref}=ccvRunReport(g);
  const body=CCV_LAYERS.map(([k,name])=>{ const r=g.L[k]; if(!r) return null;
    return `${name}: expected ${num(r.expected_kg)} kg, actual ${num(r.actual_kg)} kg, `
      +`vs BOM ${pct(-(+r.variance_pct),2)} (${r._d.verdict.label})`; }).filter(Boolean).join('\n');
  return {html, filename:safeName(`CCV ${ref} run report.html`), subject:`CCV run summary — ${ref}`,
    body:`Run summary for the CCV line, ${ref} (${dt(g.started_at)}).\n\n${body}\n\nCharts and the full breakdown are in the attached report.`};
}
function st2ReportPack(r){
  const {html,ref}=st2RunReport(r);
  const body=`Expected ${num(r.expected_kg)} kg, actual ${num(r.actual_kg)} kg, vs BOM ${pct(r.variance_pct)}.\n`
    +`Against the normal loss model this run is ${sgn(r._d.resid)} kg (${r._d.verdict.label}).`;
  return {html, filename:safeName(`${ref} run report.html`), subject:`Run summary — ${ref}`,
    body:`Run summary for ${S.item.description||S.item.item_no}, ${ref} (${dt(r.started_at)}).\n\n${body}\n\nCharts and the full breakdown are in the attached report.`};
}

        el('div',{}, num(dScrapSum.kg)+' kg')):null),
    (dScrapSum && r.scrap_kg===null)? el('div',{class:'note',html:
      `<b>Scrap is blank on this sheet, but Navision declares ${num(dScrapSum.kg)} kg of scrap for this run.</b> `+
      `A blank scrap box is charged straight to consumption, which is why the variance above looks worse than it is. `+
      `Open the run and press &ldquo;Fill scrap from ledger&rdquo; to use the declared figure.`}) : null));

  /* How far the book balance sat from the floor count on either side of this run. Movement
     between the two is what this run added to (or took out of) the phantom. Navision figures
     come from the imported ledger where one is present, not the number typed on the sheet. */
  const ng=runNavGap(r);
  if(ng){
    const box=el('table',{style:'max-width:560px;margin:2px 0 8px'});
    box.append(el('thead',{},el('tr',{},el('th',{},''),el('th',{class:'n'},'Before the run'),el('th',{class:'n'},'After the run'))));

    box.append(el('tbody',{},
      trow('Floor count (WIP)', ng.floorO, ng.floorC),
      trow(ng.fromLedger?'Navision WIP (from ledger)':'Navision WIP (typed on sheet)', ng.navO, ng.navC),
      trow('Floor − Navision', ng.gapO, ng.gapC, v=>v<0?'neg':'', false),
      trow('Moved over this run', ng.gapO, ng.gapC==null?null:ng.move, null, true)));
    // last row's "before" cell should be blank, only the movement matters — patch it
    const rows=box.querySelectorAll('tbody tr'); const last=rows[rows.length-1];
    last.children[1].textContent='';
    last.children[2].className='n '+(ng.move!=null&&ng.move<0?'neg':'pos');
    last.children[2].textContent = ng.move==null?'—':sgn(ng.move);
    const notes=[];
    notes.push(el('div',{class:'small sec',html:
      `Navision figures are ${RHTML(ng.basis)}. A negative <b>Floor − Navision</b> means the book is carrying more than the floor actually holds.`}));
    if(ng.mismatch) notes.push(el('div',{class:'small muted',html:
      `The sheet recorded Navision as ${ng.sheetO==null?'—':num(ng.sheetO)} → ${ng.sheetC==null?'—':num(ng.sheetC)}; the ledger figure is used above because a balance read off the screen before postings land does not match the posting-date truth.`}));
    if(ng.move!=null) notes.push(el('div',{class:'small sec',html:
      Math.abs(ng.move)<50
        ? 'The gap barely moved over this run, so this run is not where the phantom is being created.'
        : (ng.move<0
          ? `The gap widened by <b>${num(Math.abs(ng.move))} kg</b> across this run — material left the floor without a matching posting.`
          : `The gap closed by <b>${num(Math.abs(ng.move))} kg</b> across this run — postings caught up with the floor.`)}));
    out.append(card('Navision gap either side of the run', null, box, ...notes));
  }
  if((r._items||[]).length){
    out.append(card(`Products on this run (${r._items.length})`,
      (r._items.length>1?'Each size is costed against its own BOM; the rows add up to the totals above.':null),
      el('div',{class:'scroll'},runProductTable(r))));
  }
  if(r.thk_n>0){
    out.append(card('Thickness', `${r.thk_n} reading${r.thk_n===1?'':'s'} recorded`,
      el('div',{class:'inline',style:'gap:22px'},
        el('div',{},el('div',{class:'small muted'},'Mean'),el('div',{},num(r.thk_actual_ave,3)+' mm')),
        r.thk_std_nom!=null? el('div',{},el('div',{class:'small muted'},'Nominal'),el('div',{},num(r.thk_std_nom,2)+' mm')):null,
        r.thickness_dev_pct!=null? el('div',{},el('div',{class:'small muted'},'vs nominal'),
          el('div',{class:(+r.thickness_dev_pct>3?'neg':'')}, pct(r.thickness_dev_pct))):null,
        r.start_end_dev_pct!=null? el('div',{},el('div',{class:'small muted'},'Start vs end'),
          el('div',{}, pct(r.start_end_dev_pct))):null)));
  }
  if(mats.length){
    out.append(card('Other materials on this run', null, el('div',{},
      ...mats.map(m=>{
        const actual=(m.opening_kg==null||m.closing_kg==null)?null:(+m.opening_kg+(+m.withdrawn_kg||0)-+m.closing_kg);
        return el('div',{class:'small',style:'margin:4px 0'},el('b',{},m.label),': ',
          actual==null?'—':num(actual,1)+' kg used', m.note?el('span',{class:'muted'},' — '+m.note):null);
      }))));
  }
  if(d.findings.length){
    out.append(card('Findings', null, el('div',{},
      ...d.findings.map(f=> el('div',{style:'margin:8px 0;padding:7px 11px;border-left:2px solid var(--grid)'},
        el('div',{style:'margin-bottom:3px'},sevPill(f.sev,f.title)),
        el('div',{class:'small sec',html:f.detail}))))));
  }
  return out;
}

/* The three materials share one run, so the balance reads best as one table: the stock-chain
   lines down the side, one column per material. Fits a single page for a single-product run. */
function ccvBalanceMatrix(g){
  const t=el('table',{style:'max-width:760px'});
  const head=el('tr',{},el('th',{},''));
  CCV_LAYERS.forEach(([k,name])=> head.append(el('th',{class:'n',style:`color:${CCV_COL[k]}`},name)));
  t.append(el('thead',{},head));
  const tb=el('tbody');
  const row=(lab,fn,opts={})=>{
    const tr=el('tr',opts.bold?{style:'font-weight:650'}:{});
    tr.append(el('td',{},lab));
    CCV_LAYERS.forEach(([k])=>{
      const r=g.L[k];
      tr.append(el('td',{class:'n '+((opts.cls&&r)? opts.cls(r):'')}, r? fn(r) : '—'));
    });
    tb.append(tr);
  };
  row('Floor WIP — opening', r=>num(r.phys_wip_open));
  row('RM withdrawn from store', r=>num(r.rm_withdrawn));
  row(scrapWord()+' (weighed)', r=> r.scrap_kg===null? el('span',{class:'pill crit'},'blank') : num(r.scrap_kg));
  row('Floor WIP — closing', r=>num(r.phys_wip_close));
  row('Actual consumed', r=>num(r.actual_kg), {bold:true});
  row('BOM expected', r=> +r.expected_kg>0? num(r.expected_kg) : '—');
  row('— of which on scrapped cable', r=> scrapKgCell(r));
  row('vs BOM', r=> +r.expected_kg>0? pct(-(+r.variance_pct),2) : '—',
      {bold:true, cls:r=> +r.expected_kg>0 ? ((-(+r.variance_pct))>0?'neg':'pos') : ''});
  row('Verdict', r=> sevPill(r._d.verdict.sev, r._d.verdict.label));
  t.append(tb);
  return t;
}
/* Only shown when the sheet covers more than one product — then each needs its own recipe. */

  CCV_LAYERS.forEach(([k,name])=> h1.append(el('th',{colspan:2,class:'n',style:`color:${CCV_COL[k]}`},name)));
  CCV_LAYERS.forEach(()=> h2.append(el('th',{class:'n'},'BOM kg/km'),el('th',{class:'n'},'Expected kg')));
  t.append(el('thead',{},h1,h2));
  const tb=el('tbody');
  sizes.forEach(size=>{
    const tr=el('tr',{});
    let mr='', m=null;
    CCV_LAYERS.forEach(([k])=>{ const it=(g.L[k]?._items||[]).find(i=>i.size===size);
      if(it){ mr=mr||it.mr_numbers||''; if(m==null) m=+it.metres; } });

    tot.append(el('td',{class:'n'},''), el('td',{class:'n'}, r&&+r.expected_kg>0? num(r.expected_kg):'—')); });
  tb.append(tot);
  t.append(tb);
  return t;
}

        el('div',{class:'scroll'},ccvProductTable(g,sizes)))));

/* ---------- other materials ---------- */
function viewMats(){
  const out=el('div');
  const rows=S.mats.map(m=>{
    const run=S.runs.find(r=>r.id===m.run_id);
    const actual = (m.opening_kg==null||m.closing_kg==null) ? null
      : (+m.opening_kg + (+m.withdrawn_kg||0) - +m.closing_kg);
    const exp = m.expected_kg!=null? +m.expected_kg : null;
    return {m, run, actual, exp, varKg: (actual!=null&&exp!=null)? exp-actual : null,
            varPct: (actual!=null&&exp) ? (exp-actual)/exp*100 : null};
  }).filter(r=>r.run);
  if(!rows.length) return card('Other materials','Nothing recorded yet for this compound.',
    el('div',{class:'muted small'},'Masterbatch and other secondary materials are entered on each run.'));
  const t=el('table');
  t.append(el('thead',{},el('tr',{},...['Run','Material','Opening','Withdrawn','Closing','BOM g/m','Expected','Actual','Variance','']
    .map((h,i)=>el('th',{class:(i>=2&&i<=8)?'n':''},h)))));
  const tb=el('tbody');
  rows.forEach(r=>{
    tb.append(el('tr',{},
      el('td',{},el('b',{},r.run.sheet_ref)),
      el('td',{},r.m.label),
      el('td',{class:'n'},num(r.m.opening_kg)),
      el('td',{class:'n'},num(r.m.withdrawn_kg)),
      el('td',{class:'n'}, r.m.closing_kg==null? el('span',{class:'pill crit'},'blank') : num(r.m.closing_kg)),
      el('td',{class:'n'},num(r.m.bom_g_per_m,1)),
      el('td',{class:'n'},num(r.exp,1)),
      el('td',{class:'n'},num(r.actual,1)),
      el('td',{class:'n '+((r.varKg??0)<0?'neg':'pos')}, r.varPct===null?'—':`${sgn(r.varKg,1)} kg (${pct(r.varPct,1)})`),
      el('td',{class:'small muted'}, r.m.note||'')));
  });
  t.append(tb);
  const usable=rows.filter(r=>r.varPct!==null && !isMbFlagged(r.m));
  const tE=usable.reduce((a,r)=>a+r.exp,0), tA=usable.reduce((a,r)=>a+r.actual,0);
  const wPct = tE? (tE-tA)/tE*100 : null;
  // the compound's own figure, for a like-for-like comparison
  const cr=S.runs.filter(r=>isRun(r) && +r.expected_kg>0 && r._d.verdict.sev!=='crit');
  const cE=cr.reduce((a,r)=>a+ +r.expected_kg,0), cA=cr.reduce((a,r)=>a+ +r.actual_kg,0);
  const cPct = cE? (cE-cA)/cE*100 : null;
  let verdictNote=null;
  if(wPct!==null){
    const worse = cPct!==null && wPct < cPct - 2;
    verdictNote = el('div',{class:'note '+(Math.abs(wPct)<5?'good':worse?'crit':'warn')},
      el('b',{},`Across ${usable.length} usable record${usable.length>1?'s':''}, ${rows[0].m.label} runs ${pct(wPct,1)} against BOM `),
      `(${num(tA,1)} kg used against ${num(tE,1)} expected)`,
      cPct!==null? `, while the compound on the same runs is ${pct(cPct,1)}.` : '.',
      worse
        ? el('div',{style:'margin-top:6px'},el('b',{},'That is far worse than the compound, on much smaller and much more expensive quantities. '),
            'Masterbatch is weighed out deliberately rather than fed continuously, so this is not the same mechanism as the sheath loss — it points at dosing settings, part-bags going unrecorded, or stock takes being estimated rather than weighed. Worth its own look.')
        : Math.abs(wPct)<5
        ? el('div',{style:'margin-top:6px'},'That is tight — and informative: the same operators and the same paperwork can hold a material to BOM when it is weighed out deliberately. It argues that the compound loss is a process problem rather than a discipline problem.')
        : null);
  }
  out.append(card('Secondary materials — masterbatch and additives',
    'Same logic as the compound: opening + withdrawn − closing is what was really used, against BOM × metres. Small quantities, high unit cost, and the easiest place for an unrecorded issue to hide.',
    el('div',{class:'scroll'},t),
    verdictNote,
    rows.some(r=>r.m.closing_kg==null)? el('div',{class:'note crit'},el('b',{},'Some records have no closing stock, '),
      'so their consumption can never be closed out. Masterbatch stock takes need the same discipline as the compound.'):null,
    rows.some(r=>isMbFlagged(r.m))? el('div',{class:'note warn'},el('b',{},'One record is flagged. '),
      'Its stock figures are a copy of another sheet, so its variance is an artefact and it is excluded from the totals above.'):null));
  return out;
}

/* ---------- navision ---------- */
function viewNav(){
  const out=el('div'), rs=S.runs;
  out.append(card('Import the Navision Item Ledger export',
    'Upload the .xlsx exactly as Navision generates it — no retyping, no CSV conversion. The columns are detected automatically, and entries are matched to runs by MR number.',
    (()=>{
      const drop=el('div',{class:'drop'},
        el('div',{style:'font-weight:600;color:var(--ink-1)'},'Drop the NAV export here, or click to choose'),
        el('div',{class:'small muted',style:'margin-top:5px'},'.xlsx or .csv · Item Ledger Entries for '+ (S.item?S.item.item_no:'')));
      const inp=el('input',{type:'file',accept:'.xlsx,.xls,.csv',style:'display:none',
        onchange:e=>e.target.files[0]&&handleLedgerFile(e.target.files[0])});
      drop.addEventListener('click',()=>inp.click());
      drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over');});
      drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
      drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over');
        if(e.dataTransfer.files[0]) handleLedgerFile(e.dataTransfer.files[0]);});
      return el('div',{},drop,inp,el('div',{id:'ledMsg',class:'small',style:'margin-top:10px'}),el('div',{id:'ledPrev'}),
        el('div',{class:'note',style:'margin-top:12px',html:
          '<b>Upload as often as you like — weekly, monthly, or the whole year. Nothing is ever duplicated.</b> '+
          'Every entry is matched on its Navision <b>Entry No.</b>, so re-importing the same rows overwrites them in place; only genuinely new entries are added, and everything already stored is left untouched — each upload tops up the history. '+
          'Because of that, <b>overlap the previous period rather than cutting at a clean boundary</b> — Navision back-dates and posts some entries late (a run near the boundary reads low until its remaining postings arrive), so a rolling window that reaches back past your last import catches those stragglers at no cost. '+
          'For a weekly upload, reaching back two to three weeks is plenty. '+
          'The export must keep the <b>Entry No.</b> column; rows without it are skipped.'}));
    })(),
    !S.canEdit? el('div',{class:'note warn'},'Read-only — an editor role is needed to import.'):null));

  if(S.ledger.length){
    const cons=S.ledger.filter(l=>/consumption/i.test(l.entry_type||''));
    const tr  =S.ledger.filter(l=>/transfer/i.test(l.entry_type||''));
    const byMR={}; cons.forEach(l=>{ const k=l.document_no||'—';
      byMR[k]=byMR[k]||{q:0,n:0,scrap:null,fg:new Set(),op:new Set(),d0:null,d1:null,run:null,lag:0};
      const b=byMR[k]; b.q+=-(+l.quantity); b.n++; b.scrap=l.scrap_qty; if(l.source_no)b.fg.add(l.source_no);
      if(l.operation_no)b.op.add(l.operation_no); if(l.run_id) b.run=S.runs.find(r=>r.id===l.run_id);
      // posting date drives every balance; posted date is only a data-entry lag signal
      const p=l.posting_date, e=l.posted_date||l.finished_date;
      if(!b.d0||p<b.d0)b.d0=p; if(!b.d1||p>b.d1)b.d1=p;
      if(p&&e) b.lag=Math.max(b.lag,Math.round((new Date(e)-new Date(p))/864e5));
    });
    const mrRows=Object.entries(byMR).sort((a,b)=>(a[1].d0||'').localeCompare(b[1].d0||''));
    const t=el('table');

  }

  const withNav=rs.filter(r=>r.nav_wip_open!==null);

        el('td',{class:'n'},num(r.nav_wip_close)), el('td',{class:'n'},num(r.nav_implied_posted)),

    t.append(tb);
    out.append(card('WIP reconciliation','What NAV’s balance implies it posted, against what physically left the floor.',
      el('div',{class:'scroll'},t)));
  }

  if(S.snaps.length){
    const t=el('table');
    t.append(el('thead',{},el('tr',{},el('th',{},'Captured'),el('th',{class:'n'},'RM location'),el('th',{class:'n'},'WIP location'),el('th',{},'Note'))));

    t.append(tb);
    out.append(card('NAV "Items by Location" captures',null,el('div',{class:'scroll'},t)));
  }
  return out;
}

async function handleLedgerFile(file){
  const msg=$('#ledMsg'), prev=$('#ledPrev');
  msg.textContent='Reading '+file.name+'…'; msg.className='small muted'; prev.innerHTML='';
  if(typeof XLSX==='undefined'){
    msg.className='small err';
    msg.textContent='The spreadsheet reader could not load — this usually means the network blocked cdnjs.cloudflare.com. Ask IT to allow it, or save the export as .csv and try again.';
    return;
  }
  try{
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{cellDates:true});
    let best=null;
    for(const name of wb.SheetNames){
      const aoa=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null});
      for(let h=0;h<Math.min(8,aoa.length);h++){
        const row=(aoa[h]||[]).map(c=>String(c??'').toLowerCase().trim());
        if(row.some(c=>c.includes('entry type')) && row.some(c=>c==='quantity')){
          if(!best||aoa.length>best.aoa.length) best={aoa,h,name}; break;
        }
      }
    }
    if(!best){ msg.textContent='Could not find a header row with "Entry Type" and "Quantity". Is this the Item Ledger Entries export?'; msg.className='small err'; return; }
    const head=best.aoa[best.h].map(c=>String(c??'').toLowerCase().trim());
    const find=(...cands)=>{ for(const c of cands){ const i=head.findIndex(h=>h===c); if(i>=0) return i; }
      for(const c of cands){ const i=head.findIndex(h=>h.startsWith(c)); if(i>=0) return i; } return -1; };
    const C={ entry:find('entry no.','entry no'), post:find('posting date'), fin:find('finished date'),
      posted:find('posted date'), doc:find('document no.','document no'), doctype:find('document type'),
      typ:find('entry type'), loc:find('location code'), src:find('source no.','source no'),
      lot:find('lot no.','lot no'), op:find('operation no.','operation no'), qty:find('quantity'),
      scrap:find('scrap qty.','scrap qty'), cost:find('cost amount (actual)'), item:find('item no.','item no') };
    /* Excel dates arrive as local-midnight Date objects. toISOString() would convert to UTC and
       roll the date back a day for anyone east of Greenwich — read the local parts instead. */
    const toDate=v=>{ if(!v) return null;
      const d = v instanceof Date ? v : new Date(v);
      if(isNaN(d)) return null;
      const p=n=>String(n).padStart(2,'0');
      return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; };
    const rows=[]; const seen=new Set();
    for(let i=best.h+1;i<best.aoa.length;i++){
      const r=best.aoa[i]||[]; const q=Number(r[C.qty]);
      const en=Number(r[C.entry]);
      if(!Number.isFinite(q)||!Number.isFinite(en)||!r[C.typ]) continue;
      if(seen.has(en)) continue; seen.add(en);
      rows.push({ item_id:S.item.id, entry_no:en, posting_date:toDate(r[C.post]), finished_date:toDate(r[C.fin]),
        posted_date:toDate(r[C.posted]), document_no:r[C.doc]?String(r[C.doc]).trim():null,
        document_type:r[C.doctype]?String(r[C.doctype]).trim()||null:null, entry_type:String(r[C.typ]).trim(),
        location_code:r[C.loc]?String(r[C.loc]).trim():null, source_no:r[C.src]?String(r[C.src]).trim()||null:null,
        lot_no:r[C.lot]?String(r[C.lot]).trim()||null:null,
        operation_no:r[C.op]!=null&&r[C.op]!==''?String(r[C.op]).trim():null,
        quantity:q, scrap_qty:Number.isFinite(Number(r[C.scrap]))?Number(r[C.scrap]):null,
        cost_amount:Number.isFinite(Number(r[C.cost]))?Number(r[C.cost]):null, batch_id:file.name });
    }
    if(!rows.length){ msg.textContent='Header found but no usable data rows.'; msg.className='small err'; return; }
    const itemsInFile=[...new Set(best.aoa.slice(best.h+1).map(r=>r&&C.item>=0?r[C.item]:null).filter(Boolean).map(String))];
    const wrongItem = itemsInFile.length && !itemsInFile.includes(S.item.item_no);
    const cons=rows.filter(r=>/consumption/i.test(r.entry_type)), trf=rows.filter(r=>/transfer/i.test(r.entry_type));
    prev.append(el('div',{class:'note '+(wrongItem?'crit':'good')},
      el('b',{},`${rows.length} entries read from sheet "${best.name}". `),
      `${cons.length} consumption (${num(cons.reduce((a,r)=>a-r.quantity,0),2)} kg), `+
      `${trf.length} transfer (${num(trf.reduce((a,r)=>a+r.quantity,0),2)} kg).`,
      itemsInFile.length? el('div',{class:'small',style:'margin-top:6px'},'Item numbers in the file: '+itemsInFile.join(', ')
        + (wrongItem? ` — but you are viewing ${S.item.item_no}. Switch material at the top right before importing, or the entries will be filed under the wrong item.` : ' ✓ matches the selected material')) : null));
    prev.append(el('div',{style:'margin-top:10px'},
      el('button',{class:'btn pri',disabled:!S.canEdit,onclick:()=>importLedger(rows)},`Import ${rows.length} entries`),
      el('button',{class:'btn',style:'margin-left:8px',onclick:()=>{prev.innerHTML='';msg.textContent='';}},'Cancel')));
    msg.textContent='';
  }catch(err){ msg.textContent='Could not read the file: '+err.message; msg.className='small err'; }
}
async function importLedger(rows){
  const msg=$('#ledMsg'); msg.textContent='Importing…'; msg.className='small muted';
  for(let i=0;i<rows.length;i+=400){
    const {error}=await sb.from('mc_nav_ledger').upsert(rows.slice(i,i+400),{onConflict:'item_id,entry_no'});
    if(error){ msg.textContent=error.message; msg.className='small err'; return; }
  }
  // link entries to runs by MR number
  const items=S.runs.flatMap(r=>(r._items||[]).map(i=>({run_id:r.id, mr:i.mr_numbers})))
    .filter(x=>x.mr).flatMap(x=>String(x.mr).split(/[\/,]/).map(m=>({run_id:x.run_id, doc:'MR'+m.trim()})));
  for(const {run_id,doc} of items)
    await sb.from('mc_nav_ledger').update({run_id}).eq('item_id',S.item.id).eq('document_no',doc);
  msg.textContent=`${rows.length} entries imported and matched.`; msg.className='small ok';
  $('#ledPrev').innerHTML=''; await loadItem(); render();
}

/* ============================================================
   CCV line: three materials are extruded together in one pass, so the
   monitoring sheet covers all three. The database keeps them as separate
   materials (each has its own stock balance); this layer puts them back
   together for display, the way the sheet does.
   ============================================================ */
const CCV_LAYERS=[['ISC','Inner semicon','BONDED'],['INS','Insulation','MV XLPE'],['OSC','Outer semicon','STRIPPABLE']];
const CCV_COL={ISC:'var(--s1)',INS:'var(--s2)',OSC:'var(--s3)'};
const isCombined = () => !!(S.item && S.item.combined);
const wallWord = () => isCombined() ? 'Wall' : 'Sheath';
/* the CCV monitoring sheets call this bleed scrap; the ST2 sheets call it total scrap */
const scrapWord = () => isCombined() ? 'Bleed scrap' : 'Total scrap';
function ccvGroups(){
  const m=new Map();
  S.runs.forEach(r=>{
    const i=r.sheet_ref.lastIndexOf(' \u00b7 ');
    const base=i>0? r.sheet_ref.slice(0,i) : r.sheet_ref;
    const lay =i>0? r.sheet_ref.slice(i+3).trim() : '?';
    if(!m.has(base)) m.set(base,{base,started_at:r.started_at,stopped_at:r.stopped_at,sizes:r.sizes,
      core_scrap_m:r.core_scrap_m,core_scrap_pct:r.core_scrap_pct,good_metres:r.good_metres,cores:r.cores,
      scrap_start_m:r.scrap_start_m,scrap_joint_m:r.scrap_joint_m,scrap_stop_m:r.scrap_stop_m,
      dq:r.data_quality_note,
      mr:[...new Set((r._items||[]).map(i=>i.mr_numbers).filter(Boolean))].join(' / '),
      metres:r.total_metres, L:{}});
    m.get(base).L[lay]=r;
  });
  const g=[...m.values()].sort((a,b)=>String(a.started_at).localeCompare(String(b.started_at)));
  g.forEach(x=>{
    x.bad = CCV_LAYERS.some(([k])=> x.L[k] && x.L[k]._d.verdict.sev==='crit');
    // measurable, but so far outside every other run that it would flatten the chart's
    // axis for everyone else — kept in every total, shown on its own in the diagnosis
    x.severe = !x.bad && CCV_LAYERS.some(([k])=> x.L[k] && Math.abs(+x.L[k].variance_pct)>80);
  });
  return g;
}

/* grouped bars: one cluster per production run, one bar per material */
function chartCcvVariance(groups){
  const gs=groups.filter(g=>!g.bad && !g.severe && CCV_LAYERS.some(([k])=>g.L[k]));
  const droppedBad=groups.filter(g=>g.bad).length, droppedSevere=groups.filter(g=>g.severe).length;
  if(!gs.length) return el('div',{class:'muted small'},'No measurable runs yet.');
  const W=880,H=320,P={t:22,r:24,b:60,l:56}, iw=W-P.l-P.r, ih=H-P.t-P.b;
  const vals=gs.flatMap(g=>CCV_LAYERS.map(([k])=> g.L[k]? -(+g.L[k].variance_pct) : null)).filter(v=>v!==null);
  const {ticks,lo,hi}=niceTicks(Math.min(-20,...vals),Math.max(20,...vals),6);
  const y=v=>P.t+ih-(v-lo)/(hi-lo)*ih;
  const step=iw/gs.length, bw=Math.min(20,(step*0.72)/3);
  const s=SV(W,H);
  ticks.forEach(t=>{ s.append(SE('line',{x1:P.l,x2:P.l+iw,y1:y(t),y2:y(t),stroke:t===0?'var(--axis)':'var(--grid)'}));
    s.append(TX(P.l-9,y(t)+3.5,t+'%',{'text-anchor':'end'})); });
  gs.forEach((g,i)=>{
    const cx=P.l+step*i+step/2;
    CCV_LAYERS.forEach(([k,name,grade],j)=>{
      const r=g.L[k]; if(!r||r.variance_pct===null) return;
      const v=-(+r.variance_pct);                      // positive = used more than BOM
      const x0=cx+(j-1)*(bw+3)-bw/2, y0=y(0), y1=y(v);
      const n=SE('g');
      n.append(SE('rect',{x:x0,y:Math.min(y0,y1),width:bw,height:Math.max(2,Math.abs(y1-y0)),rx:3,
        fill:CCV_COL[k],class:'bar'}));
      tipify(n,`<b>${esc(g.base)} &middot; ${name}</b><span class="k">Grade</span> ${grade}<br>
        <span class="k">Expected</span> ${num(r.expected_kg,1)} kg<br>
        <span class="k">Actual</span> ${num(r.actual_kg,1)} kg<br>
        <span class="k">vs BOM</span> ${pct(v,1)}`);
      s.append(n);
    });
    const lab=g.base.replace(/^CCV /,'');
    s.append(TX(cx,P.t+ih+16, lab.length>19? lab.slice(0,18)+'\u2026':lab,{'text-anchor':'middle'}));
    if(g.core_scrap_pct!==null) s.append(TX(cx,P.t+ih+29,`scrap ${(+g.core_scrap_pct).toFixed(1)}%`,
      {'text-anchor':'middle',style:(+g.core_scrap_pct>5?'fill:var(--crit);font-weight:650':'')}));
  });
  if(droppedBad) s.append(TX(P.l,10,`${droppedBad} record${droppedBad>1?'s':''} left out — the data cannot be trusted`,
    {style:'fill:var(--crit);font-weight:650'}));
  if(droppedSevere) s.append(TX(P.l,droppedBad?24:10,
    `${droppedSevere} run${droppedSevere>1?'s':''} left off this chart — the variance is real but too large for this axis to stay readable; see the callout below`,
    {style:'fill:var(--warn);font-weight:650'}));
  return s;
}

function viewCcvDash(){
  const out=el('div'), groups=ccvGroups();
  const usable=groups.filter(g=>!g.bad);
  const ok=usable.filter(g=>!g.severe);
  const severe=usable.filter(g=>g.severe);
  const tiles=el('div',{class:'grid tiles'});
  tiles.append(tile('Production runs', `${usable.length} of ${groups.length}`,
    groups.length-usable.length? `${groups.length-usable.length} excluded — the record itself is wrong`
      : severe.length? `${severe.length} severe outlier${severe.length>1?'s':''} — see below` : 'all records usable'));
  CCV_LAYERS.forEach(([k,name,grade])=>{
    const rs=ok.map(g=>g.L[k]).filter(Boolean);
    const e=rs.reduce((a,r)=>a+ +r.expected_kg,0), a2=rs.reduce((a,r)=>a+ +r.actual_kg,0);
    tiles.append(tile(name, e? (a2>e?'+':'')+((a2-e)/e*100).toFixed(2)+'%' : '—',
      `${grade} · ${num(Math.abs(a2-e))} kg ${a2>e?'above':'below'} BOM, ${ok.length} normal run${ok.length===1?'':'s'}`, (a2-e)>0?'neg':'pos'));
  });
  out.append(tiles);
  if(severe.length) out.append(card('Severe outlier — real, not a data error',
    'Correctly split into its own recipe per product, this run is a genuine, large overconsumption rather than a measurement artefact. Kept out of the tiles and chart above so it does not swamp six otherwise well-controlled runs — but it is the single biggest number in this review and needs investigating on the floor.',
    ...severe.flatMap(g=>{
      const rows=CCV_LAYERS.map(([k,name])=>{ const r=g.L[k]; if(!r) return null;
        return el('div',{class:'small',style:'margin:3px 0'},
          el('span',{class:'pill',style:`border-color:${CCV_COL[k]};color:${CCV_COL[k]}`},name),' ',
          `expected ${num(r.expected_kg)} kg, actual ${num(r.actual_kg)} kg — `,
          el('b',{class:'neg'},pct(-(+r.variance_pct),1)),
          ` (${num(Math.abs(r.variance_kg))} kg over)`); }).filter(Boolean);
      return [el('div',{style:'margin:14px 0 4px'},el('b',{},g.base.replace(/^CCV /,'')),
        el('span',{class:'small muted'},' '+(g.sizes||''))), ...rows];
    })));
  out.append(card('Variance against BOM, by run and material',
    'One cluster per production run, one bar per material — the same three grades the sheet tracks together. Positive means more material was used than the recipe allows.',
    chartCcvVariance(groups),
    el('div',{class:'legend'},...CCV_LAYERS.map(([k,name,grade])=>
      el('span',{},el('i',{style:`background:${CCV_COL[k]}`}),`${name} (${grade})`)))));
  const cs=groups.filter(g=>g.core_scrap_pct!==null);
  if(cs.length){
    const worst=cs.slice().sort((a,b)=>b.core_scrap_pct-a.core_scrap_pct)[0];
    const best=cs.slice().sort((a,b)=>a.core_scrap_pct-b.core_scrap_pct)[0];
    const fixed=cs.map(g=>(+g.scrap_start_m||0)+(+g.scrap_stop_m||0));
    out.append(el('div',{class:'note crit'},
      el('b',{},`Start-up and stop scrap is a fixed ${num(mean(fixed))} m of core on every run. `),
      `On ${worst.base.replace(/^CCV /,'')} that was ${(+worst.core_scrap_pct).toFixed(1)}% of everything the line extruded; on ${best.base.replace(/^CCV /,'')} it was ${(+best.core_scrap_pct).toFixed(1)}%. `,
      `Unlike the sheathing line, CCV measures this loss directly in metres — so it can be costed and attacked without any modelling.`));
  }
  return out;
}

    tb.append(tr);
  });
  t.append(tb);
  return el('div',{},el('div',{class:'card'},
    el('div',{class:'chead',style:'margin-bottom:12px'},el('h2',{},'CCV runs — all three materials'),

      'Inner semicon, insulation and outer semicon are extruded in a single pass, so they share the metres, the core scrap and the run window — but each keeps its own stock balance and its own variance.')));
}

/* the CCV run-level codes, said once per run rather than once per material */
const CCV_RUNLEVEL=new Set(['CORE_SCRAP','DATES_ONLY','MIXED','RATE_IMPLAUSIBLE','NOT_A_RUN','CORRECTED']);
const ccvFbox=f=> el('div',{style:'margin:3px 0 0 14px;padding:7px 11px;border-left:2px solid var(--grid)'},
  el('div',{style:'margin-bottom:3px'},sevPill(f.sev,f.title)),
  el('div',{class:'small sec',html:f.detail}));
/* one run's block: header, run-level findings once, then each material's verdict + own findings.
   Used both in the full Diagnosis run-by-run list and in the single-run Summary tab. */
function ccvRunBlock(g,opts={}){
  const box=el('div');
  if(!opts.noHead) box.append(el('div',{style:'display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0 6px'},
    el('h3',{},g.base.replace(/^CCV /,'')), el('span',{class:'small muted'},g.sizes||'')));
  const seen=new Set();
  CCV_LAYERS.forEach(([k])=>{ const r=g.L[k]; if(!r) return;
    r._d.findings.forEach(f=>{ if(!CCV_RUNLEVEL.has(f.code)||f.code==='DATES_ONLY'||seen.has(f.code)) return;
      seen.add(f.code); box.append(ccvFbox(f)); }); });
  CCV_LAYERS.forEach(([k,name])=>{
    const r=g.L[k]; if(!r) return;
    box.append(el('div',{style:'display:flex;gap:10px;align-items:center;margin:10px 0 3px'},
      el('span',{class:'pill',style:`border-color:${CCV_COL[k]};color:${CCV_COL[k]}`},name),
      sevPill(r._d.verdict.sev,r._d.verdict.label),
      el('span',{class:'small muted mono'},`${pct(-(+r.variance_pct),1)} vs BOM`)));
    if(opts.balance) box.append(runBalanceTable(r,true));
    const own=r._d.findings.filter(f=>!CCV_RUNLEVEL.has(f.code));
    if(!own.length) box.append(el('div',{class:'small muted',style:'margin:3px 0 0 14px'},
      'Nothing specific to this material — see the run notes above.'));
    own.forEach(f=> box.append(ccvFbox(f)));
  });
  return box;
}

    el('div',{class:'scroll'},t)));

  out.append(card('Where WIP moved, and when it was written down',

    el('div',{class:'legend'},
      el('span',{},el('i',{style:'background:var(--s1)'}),'Transferred into WIP'),

      el('div',{}, el('div',{style:'font-weight:600;margin-bottom:2px'},c.title),
        el('div',{class:'small sec',html:c.detail}))));
  });
  out.append(card('Transaction integrity checks',
    'Ten tests against the raw ledger. These answer the question directly: is anything in Navision itself wrong?',

    out.append(card('The manual write-offs, in detail',

        `across ${byDoc.size} documents — and then they stopped. The last one was ${dt(last)}, ${days} days before the end of the ledger. `,
        `Most are exact 1,000 kg blocks, which is not what a physical count produces; it is what someone enters to bring a book balance down to a number. `,
        `The overconsumption did not begin when the write-offs stopped — it was simply no longer being papered over. That is the single most important thing in this ledger.`)));
  }

  // sheet vs ledger
  if(cmp.length){
    const ct=el('table');

      el('th',{class:'n'},'System WIP typed on the sheet'),el('th',{class:'n'},'Ledger balance that date'),el('th',{class:'n'},'Difference'))));
    const ctb=el('tbody');
    cmp.forEach(c=>{
      const d=c.sheet-c.led;
      ctb.append(el('tr',{},el('td',{},el('b',{},c.run)),el('td',{class:'small muted'},c.when),

        el('td',{class:'n '+(Math.abs(d)>50?'neg':'pos')},Math.abs(d)>0.5?sgn(d,2):'match')));

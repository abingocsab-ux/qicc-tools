<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Material Consumption Monitor &amp; Navision Reconciliation</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  color-scheme: light;
  --surface-1:#fcfcfb; --plane:#f9f9f7;
  --ink-1:#0b0b0b; --ink-2:#52514e; --ink-3:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,0.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b; --good-ink:#006300;
  --pos:#2a78d6; --neg:#d03b3b;
  --r:10px;
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --surface-1:#1a1a19; --plane:#0d0d0d;
  --ink-1:#ffffff; --ink-2:#c3c2b7; --ink-3:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --good-ink:#0ca30c; --pos:#3987e5; --neg:#d03b3b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--plane);color:var(--ink-1);
  font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-0.01em}
h2{font-size:15px} h3{font-size:13px}
a{color:var(--s1)} button{font:inherit}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px 64px}
header{position:sticky;top:0;z-index:50;background:var(--plane);border-bottom:1px solid var(--border);padding:12px 0 0}
.hrow{max-width:1320px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:680;font-size:15px;letter-spacing:-0.01em}
.brand small{display:block;font-weight:450;font-size:11.5px;color:var(--ink-3);letter-spacing:0}
.spacer{flex:1}
.tabs{max-width:1320px;margin:10px auto 0;padding:0 20px;display:flex;gap:2px;overflow-x:auto}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;
  color:var(--ink-2);cursor:pointer;white-space:nowrap;font-size:13.5px;border-radius:6px 6px 0 0}
.tab:hover{background:var(--surface-1);color:var(--ink-1)}
.tab[aria-selected="true"]{color:var(--ink-1);border-bottom-color:var(--s1);font-weight:600}
.card{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--r);padding:16px}
.card+.card{margin-top:14px}
.grid{display:grid;gap:14px}
.tiles{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.two{grid-template-columns:1fr 1fr}
@media(max-width:900px){.two{grid-template-columns:1fr}}
.tile .lab{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.tile .val{font-size:26px;font-weight:660;letter-spacing:-0.02em;margin-top:6px;line-height:1.12}
.tile .sub{font-size:12px;color:var(--ink-2);margin-top:5px}
.muted{color:var(--ink-3)} .sec{color:var(--ink-2)}
.mono{font-variant-numeric:tabular-nums}
.neg{color:var(--crit)} .pos{color:var(--good-ink)}
.btn{appearance:none;border:1px solid var(--border);background:var(--surface-1);color:var(--ink-1);
  padding:7px 13px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--s1);border-color:var(--s1);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 9px;font-size:12px} .btn.danger{color:var(--crit)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--ink-1);background:var(--surface-1);
  border:1px solid var(--border);border-radius:7px;padding:7px 9px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--s1);outline-offset:-1px;border-color:transparent}
/* a field whose value was resolved from a typed sum (e.g. 20+20+20) carries a small dot in the
   top-right corner; hover shows the breakdown. Signals the value is a computed total, not a raw entry. */
input.has-calc{background-image:radial-gradient(circle at calc(100% - 5px) 6px, var(--s1) 0 3px, transparent 3.6px);cursor:help}
/* read-only, app-computed field (masterbatch BOM / expected) — visibly not for typing */
input.derived{background:var(--plane);color:var(--ink-2);border-style:dashed;cursor:default}
input.derived:focus{outline:none}
label{display:block;font-size:11.5px;color:var(--ink-2);margin-bottom:4px;font-weight:550}
.field{margin-bottom:12px}
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.inline label{margin:0}
.sel{width:auto;min-width:130px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-weight:600;color:var(--ink-2);font-size:10.5px;text-transform:uppercase;
  letter-spacing:.04em;padding:7px 8px;border-bottom:1px solid var(--axis);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--grid);vertical-align:top}
tbody tr:hover{background:var(--plane)}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto;margin:0 -16px;padding:0 16px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
  padding:2.5px 8px;border-radius:999px;border:1px solid var(--border);white-space:nowrap}
.pill.good{color:var(--good-ink);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.pill.warn{color:#8a6100;border-color:color-mix(in srgb,var(--warn) 55%,transparent)}
.pill.serious{color:#a34a1c;border-color:color-mix(in srgb,var(--serious) 55%,transparent)}
.pill.crit{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 45%,transparent)}
:root[data-theme="dark"] .pill.warn{color:var(--warn)}
:root[data-theme="dark"] .pill.serious{color:var(--serious)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:10px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}
.chead{display:flex;align-items:baseline;gap:10px;margin-bottom:2px;flex-wrap:wrap}
.csub{font-size:12px;color:var(--ink-3);margin-bottom:12px;max-width:105ch}
.note{background:var(--plane);border:1px solid var(--border);border-left:3px solid var(--s1);
  border-radius:7px;padding:11px 13px;font-size:13px;color:var(--ink-2);margin-top:12px}
.note.crit{border-left-color:var(--crit)} .note.warn{border-left-color:var(--warn)}
.note.good{border-left-color:var(--good)} .note b{color:var(--ink-1)}
ul.tight,ol.tight{margin:8px 0 0;padding-left:20px} .tight li{margin-bottom:6px}
.hide{display:none!important}
.tt{position:fixed;pointer-events:none;z-index:500;background:var(--surface-1);border:1px solid var(--border);
  border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 6px 22px rgba(0,0,0,.14);max-width:280px;opacity:0;transition:opacity .1s}
.tt.on{opacity:1} .tt .k{color:var(--ink-3)} .tt b{display:block;margin-bottom:4px}
.ibtn{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;margin-left:5px;
  border-radius:50%;border:1px solid var(--s1);color:var(--s1);font-size:10px;font-weight:700;font-style:italic;
  line-height:1;cursor:pointer;vertical-align:middle;user-select:none;flex:none}
.ibtn:hover{background:var(--s1);color:#fff}
.ipop{position:fixed;z-index:400;background:var(--surface-1);border:1px solid var(--border);
  border-left:3px solid var(--s1);border-radius:8px;padding:10px 12px;font-size:12px;line-height:1.5;
  box-shadow:0 8px 26px rgba(0,0,0,.22);max-width:320px;color:var(--ink-1)}
.ipop b:first-child{display:block;margin-bottom:3px} .ipop .k{color:var(--ink-3)}
svg{display:block;max-width:100%;overflow:visible}
.axis-t{font-size:10.5px;fill:var(--ink-3)}
.bar{transition:opacity .12s} .bar:hover{opacity:.75;cursor:pointer}
.banner{background:color-mix(in srgb,var(--crit) 8%,var(--surface-1));border:1px solid color-mix(in srgb,var(--crit) 30%,transparent);
  border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
.banner h2{color:var(--crit)}
.banner.good{background:color-mix(in srgb,var(--good) 8%,var(--surface-1));border-color:color-mix(in srgb,var(--good) 30%,transparent)}
.banner.good h2{color:var(--good-ink)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:flex-start;
  justify-content:center;padding:36px 16px;overflow:auto}
.modal .card{max-width:920px;width:100%}
.rowline{display:grid;grid-template-columns:1.2fr 1.1fr .8fr .9fr .7fr auto;gap:8px;align-items:end;margin-bottom:8px}
@media(max-width:820px){.rowline{grid-template-columns:1fr 1fr}}
/* long product / thickness lists: bounded scroll with a frozen column header, and a Save bar
   that stays pinned so you never have to scroll to the end to reach it */
.listscroll{max-height:46vh;overflow:auto;border:1px solid var(--border);border-radius:9px;padding:2px 10px 8px;margin:2px 0 4px}
.rowhead{position:sticky;top:0;z-index:3;background:var(--surface-1);align-items:center;
  padding:7px 0 6px;margin-bottom:4px;border-bottom:1px solid var(--grid)}
.rowhead>div{font-size:11px;color:var(--ink-2);font-weight:650;display:flex;align-items:center}
.mlab{display:none}
.editfoot{position:sticky;bottom:0;z-index:6;background:var(--surface-1);border-top:1px solid var(--border);
  margin-top:14px;padding:12px 0 2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.small{font-size:12px}
#login{max-width:380px;margin:80px auto}
.err{color:var(--crit);font-size:12.5px;margin-top:8px}
.ok{color:var(--good-ink);font-size:12.5px;margin-top:8px}
.drop{border:1.5px dashed var(--axis);border-radius:10px;padding:26px;text-align:center;color:var(--ink-2);
  background:var(--plane);cursor:pointer}
.drop:hover,.drop.over{border-color:var(--s1);color:var(--ink-1)}
.itembar{display:flex;gap:6px;align-items:center}
.itembtn{appearance:none;border:1px solid var(--border);background:var(--surface-1);color:var(--ink-2);
  padding:5px 11px;border-radius:999px;cursor:pointer;font-size:12.5px;font-weight:550}
.itembtn[aria-pressed="true"]{background:var(--s1);border-color:var(--s1);color:#fff}

/* ---------------- mobile ---------------- */
@media(max-width:720px){
  .wrap{padding:0 10px 48px}
  .hrow,.tabs{padding:0 10px}
  .brand{font-size:13.5px} .brand small{display:none}
  #who{display:none}
  .card{padding:12px}
  .card+.card{margin-top:10px}
  /* one field per row on a phone — datetime inputs are intrinsically wide, so 2 columns overflow */
  .fgrid{grid-template-columns:1fr}
  .field{min-width:0}
  input,select,textarea{min-width:0}
  /* product-entry rows (incl. CCV, which set columns inline) stack two-up on a phone */
  .rowline{grid-template-columns:1fr 1fr!important;gap:8px}
  /* on a full-screen sheet, drop the nested scroll boxes and the frozen header; show per-row labels instead */
  .listscroll{max-height:none;overflow:visible;border:0;padding:0;margin:0}
  .rowhead{display:none!important}
  .mlab{display:block;font-size:11px;color:var(--ink-2);margin-bottom:3px;font-weight:550}
  .chead h2{font-size:15px}
  /* the run editor and other dialogs: full-screen sheets */
  .modal{padding:0;align-items:stretch}
  .modal .card{max-width:100%;width:100%;min-height:100%;border-radius:0;padding:14px 12px 40px}
  /* wide data tables (Runs, CCV runs) become one card per row */
  table.rtable thead{display:none}
  table.rtable, table.rtable tbody{display:block;width:100%}
  table.rtable tr{display:block;border:1px solid var(--border);border-radius:11px;
    padding:8px 12px;margin-bottom:10px;background:var(--surface-1)}
  table.rtable td{display:flex;justify-content:space-between;align-items:center;gap:14px;
    border:0;padding:5px 0;text-align:right;font-size:13px;min-height:26px}
  table.rtable td+td{border-top:1px dashed var(--grid)}
  table.rtable td::before{content:attr(data-label);color:var(--ink-3);font-weight:600;
    text-align:left;flex:none;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
  table.rtable td[data-label=""]::before{content:none}
  table.rtable td:empty{display:none}
  /* the run reference is the card title, not a label:value row */
  table.rtable td.rhead{display:block;text-align:left;font-size:15px;font-weight:650;
    padding:0 0 8px;margin-bottom:4px;border-bottom:1px solid var(--grid)}
  table.rtable td.rhead::before{content:none}
  /* Summary / Edit become full-width tap targets at the foot of the card */
  table.rtable td.act{border-top:0;padding:8px 0 0}
  table.rtable td.act .btn{width:100%;padding:9px;font-size:13px}
}

/* ---------------- print ---------------- */
@media print{
  @page{ size:A4 landscape; margin:12mm 10mm; }
  body{background:#fff;font-size:9pt}
  header{position:static;border-bottom:1.5pt solid #000;padding-bottom:6pt;margin-bottom:8pt}
  .tabs,.itembar,#themeBtn,#printBtn,#outBtn,#who,.btn,.tt,#login,#boot{display:none!important}
  .wrap{max-width:none;padding:0}
  .card{border:.6pt solid #cfcdc6;box-shadow:none;break-inside:avoid;page-break-inside:avoid}
  .card+.card{margin-top:8pt}
  .banner{break-inside:avoid}
  table{font-size:7.6pt} th{font-size:6.8pt} td,th{padding:3pt 4pt}
  .scroll{overflow:visible!important;margin:0;padding:0}
  svg{max-width:100%}
  .note{break-inside:avoid}
  a{text-decoration:none;color:inherit}
  .printhead{display:block!important}
  /* the single-run summary is meant to be one page — tighten it so the findings
     sit under the balance table instead of tipping onto a second sheet */
  .runsum .card{padding:9pt 11pt}
  .runsum .card+.card{margin-top:6pt}
  .runsum .csub{margin-bottom:5pt}
  .runsum table{font-size:7.2pt}
  .runsum td,.runsum th{padding:2pt 4pt}
  .runsum .backbar{display:none!important}
  /* findings may run long on a bad run — let them fill the first page rather than
     jumping wholesale onto a second one, and set them tight so they fit beside the balance */
  .runsum .card.flow{break-inside:auto;page-break-inside:auto}
  .runsum .flist .fitem{margin-bottom:2.5pt!important;line-height:1.3!important;padding-left:6pt!important}
  .runsum .flist .fitem,.runsum .flist .small{font-size:6.9pt}
  .runsum .flist .pill{font-size:6.2pt;padding:0 3pt}
  .runsum .inline{gap:16px!important}
}
.printhead{display:none;font-size:9pt;color:#52514e;margin-bottom:6pt}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div class="brand">Material Consumption Monitor
      <small>Run-by-run material balance, Navision reconciliation &amp; sheath capability</small></div>
    <div class="spacer"></div>
    <div class="itembar" id="itembar"></div>
    <span id="who" class="small muted"></span>
    <button class="btn sm" id="printBtn" title="Print this tab, or save it as a PDF">Print</button>
    <button class="btn sm" id="themeBtn">Dark</button>
    <button class="btn sm hide" id="outBtn">Sign out</button>
  </div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
</header>

<div class="wrap">
  <div id="login" class="card hide">
    <h2>Sign in</h2>
    <p class="small muted" style="margin:6px 0 14px">Use your existing factory-system account.</p>
    <div class="field"><label>Email</label><input id="em" type="email" autocomplete="username"></div>
    <div class="field"><label>Password</label><input id="pw" type="password" autocomplete="current-password"></div>
    <button class="btn pri" id="inBtn" style="width:100%">Sign in</button>
    <div id="loginMsg"></div>
  </div>
  <main id="app" class="hide"></main>
  <div id="boot" class="card" style="margin-top:24px"><span class="muted">Loading…</span></div>
</div>
<div class="tt" id="tt"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.45.4';
const SUPABASE_URL = 'https://rwckyucnahinoeoqmrea.supabase.co';
const SUPABASE_KEY = 'sb_publishable_dHhxhKPrm5y34vnJutLJuA_j40E-wmx';
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

const S = { items:[], item:null, products:[], runs:[], model:null, snaps:[], ledger:[], mats:[], thk:[],
            tab:'dash', canEdit:false, user:null, sixRun:'all', sixStat:'thk_ave', sumRunId:null, sumGroupBase:null };

/* ============================ helpers ============================ */
const $ = s => document.querySelector(s);
const el = (t,a={},...c)=>{const n=document.createElement(t);
  for(const [k,v] of Object.entries(a)){ if(v===null||v===undefined||v===false) continue;
    if(k==='class')n.className=v; else if(k==='html')n.innerHTML=v; else if(k.startsWith('on'))n.addEventListener(k.slice(2),v);
    else n.setAttribute(k,v);} for(const x of c.flat()){ if(x==null||x===false)continue; n.append(x.nodeType?x:document.createTextNode(x)); } return n;};
const num = (v,d=0)=> (v===null||v===undefined||v===''||isNaN(v)) ? '—'
  : Number(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const pct = (v,d=2)=> (v===null||v===undefined||isNaN(v)) ? '—' : (Number(v)>0?'+':'')+Number(v).toFixed(d)+'%';
const sgn = (v,d=0)=> (v===null||v===undefined||isNaN(v)) ? '—' : (Number(v)>0?'+':'')+num(v,d);
const dt  = s => s ? new Date(s).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'2-digit'}) : '—';
const dtl = s => s ? new Date(s).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';
const N = v => (v===null||v===undefined||v==='') ? null : Number(v);
/* calc-enabled numeric field: typing "20+20+20" and leaving the field resolves it to 60,
   like an Excel cell. A leading "=" is accepted but optional. Plain numbers pass through untouched. */
function evalCalc(str){
  if(str==null) return null;
  let s=String(str).trim(); if(!s) return null;
  if(s[0]==='=') s=s.slice(1).trim(); if(!s) return null;
  if(/^-?\d+(\.\d+)?$/.test(s)) return null; // already a plain number — nothing to resolve
  if(!/^[-+*/().\d\s]+$/.test(s) || !/\d/.test(s)) return null; // not a safe/complete expression
  try{ const v=Function('"use strict";return ('+s+')')(); return (typeof v==='number'&&isFinite(v))?v:null; }
  catch(e){ return null; }
}
/* pretty-print a raw expression like "20+20+20" as "20 + 20 + 20" for the tooltip.
   Only operators between digits get spaced, so a leading unary minus stays attached. */
function fmtExpr(s){
  return String(s).trim().replace(/^=/,'').trim()
    .replace(/\s+/g,'').replace(/(\d)([+\-*/])(?=[\d.(])/g,'$1 $2 ');
}
function calcInput(attrs={}){
  const a=Object.assign({type:'text',inputmode:'decimal',autocomplete:'off',placeholder:'e.g. 20+20+20'},attrs);
  a.value = a.value===null||a.value===undefined?'':a.value;
  const n=el('input',a);
  /* On blur a typed sum (20+20+20) resolves to its total (60), exactly as before — but the
     original breakdown is now remembered on the element and revealed on hover, so the operator
     can see what the total was made of instead of only the collapsed number. */
  n.addEventListener('blur',e=>{
    const raw=String(e.target.value||'');
    const r=evalCalc(raw);
    if(r!=null){
      const resolved=Math.round(r*1000)/1000;
      e.target.dataset.calcExpr=fmtExpr(raw);
      e.target.dataset.calcVal=String(resolved);
      e.target.value=resolved;
      e.target.title=fmtExpr(raw)+' = '+resolved;   // native fallback in case the custom tip is missed
      e.target.classList.add('has-calc');
      e.target.dispatchEvent(new Event('input',{bubbles:true}));
    }
  });
  /* If the operator edits the field by hand afterwards so it no longer equals the stored total,
     the remembered breakdown is dropped — the tooltip must never show a stale sum. */
  n.addEventListener('input',e=>{
    if(n.dataset.calcExpr && String(e.target.value).trim()!==n.dataset.calcVal){
      delete n.dataset.calcExpr; delete n.dataset.calcVal; n.classList.remove('has-calc'); n.removeAttribute('title');
    }
  });
  n.addEventListener('mousemove',ev=>{ if(n.dataset.calcExpr)
    showTip(ev,`<b>Entered as a sum</b><br>${esc(n.dataset.calcExpr)} <b>= ${esc(n.dataset.calcVal)}</b>`); });
  n.addEventListener('mouseleave',hideTip);
  return n;
}
/* calendar date of a timestamp in the viewer's own timezone. Slicing an ISO string
   gives the UTC date, which lands a day early for anything before 03:00 local here. */
const dayOf = ts => { if(!ts) return null; const d=new Date(ts); if(isNaN(d)) return null;
  const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; };
const esc = s => String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

const tt = $('#tt');
function showTip(e,html){ tt.innerHTML=html; tt.classList.add('on');
  const r=tt.getBoundingClientRect(); let x=e.clientX+14, y=e.clientY-10;
  if(x+r.width>innerWidth-8) x=e.clientX-r.width-14;
  if(y+r.height>innerHeight-8) y=innerHeight-r.height-8;
  tt.style.left=x+'px'; tt.style.top=Math.max(8,y)+'px'; }
const hideTip=()=>tt.classList.remove('on');
const tipify=(n,h)=>{ n.addEventListener('mousemove',e=>showTip(e,h)); n.addEventListener('mouseleave',hideTip); return n; };
/* a small "i" that opens a definition/how-it-works popover — works on hover and on tap,
   dismissed by clicking anywhere. Reused across the run editor and summaries. */
function infoBtn(html){
  const b=el('span',{class:'ibtn',tabindex:'0',role:'button','aria-label':'How this works'},'i');
  const open=()=>{
    const cur=document.querySelector('.ipop'); if(cur) cur.remove();
    if(cur && cur._src===b){ return; }              // second click on same icon closes it
    const pop=el('div',{class:'ipop',html}); pop._src=b; document.body.append(pop);
    // position:fixed → use viewport coordinates so it aligns to the icon inside a fixed modal too
    const r=b.getBoundingClientRect();
    let x=r.left, y=r.bottom+6;
    if(x+pop.offsetWidth > innerWidth-10) x=innerWidth-pop.offsetWidth-10;
    if(y+pop.offsetHeight > innerHeight-10) y=Math.max(8, r.top-pop.offsetHeight-6); // flip above if no room below
    pop.style.left=Math.max(8,x)+'px'; pop.style.top=Math.max(8,y)+'px';
    setTimeout(()=>document.addEventListener('click',function h(ev){
      if(ev.target!==b){ pop.remove(); document.removeEventListener('click',h); }},{once:false}),0);
  };
  b.addEventListener('click',e=>{ e.stopPropagation(); open(); });
  b.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); open(); }});
  return b;
}

/* ============================ statistics ============================ */
const mean = a => a.reduce((x,y)=>x+y,0)/a.length;
const sd   = a => { if(a.length<2) return 0; const m=mean(a); return Math.sqrt(a.reduce((s,v)=>s+(v-m)**2,0)/(a.length-1)); };
function sdWithin(a){ if(a.length<2) return sd(a);
  const mr=[]; for(let i=1;i<a.length;i++) mr.push(Math.abs(a[i]-a[i-1]));
  const mbar=mean(mr); return mbar>0 ? mbar/1.128 : sd(a); }
function erf(x){ const s=x>=0?1:-1; x=Math.abs(x); const t=1/(1+0.3275911*x);
  return s*(1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x)); }
const ncdf = z => 0.5*(1+erf(z/Math.SQRT2));
function capability(vals, LSL, USL){
  const v=vals.filter(x=>x!==null&&!isNaN(x));
  if(v.length<2) return null;
  const n=v.length, mu=mean(v), sW=sdWithin(v), sO=sd(v);
  const mk=(s)=>{ const o={s};
    o.cp  = (LSL!=null&&USL!=null&&s>0) ? (USL-LSL)/(6*s) : null;
    o.cpu = (USL!=null&&s>0) ? (USL-mu)/(3*s) : null;
    o.cpl = (LSL!=null&&s>0) ? (mu-LSL)/(3*s) : null;
    const c=[o.cpu,o.cpl].filter(x=>x!=null); o.cpk = c.length? Math.min(...c) : null;
    return o; };
  const w=mk(sW), ov=mk(sO);
  const pLow  = LSL!=null && sO>0 ? ncdf((LSL-mu)/sO) : 0;
  const pHigh = USL!=null && sO>0 ? 1-ncdf((USL-mu)/sO) : 0;
  const obsLow  = LSL!=null ? v.filter(x=>x<LSL).length/n : 0;
  const obsHigh = USL!=null ? v.filter(x=>x>USL).length/n : 0;
  return { n, mu, min:Math.min(...v), max:Math.max(...v), within:w, overall:ov,
           dpmo:(pLow+pHigh)*1e6, pLow, pHigh, obsLow, obsHigh,
           sigma: w.cpk!=null ? 3*w.cpk+1.5 : null, vals:v };
}
/* mass of a sheath annulus, the plant's own formula from the OSC THICKNESS sheet:
   kg/km = pi x (D + t) x t x density          (D = diameter under the sheath, mm) */
const kgkm = (D,t,rho)=> Math.PI*(D+t)*t*rho;

/* ============================ loss model ============================ */
function benchmark(exp){
  const m = S.model || {fixed_loss_kg:0, variable_uplift_pct:0};
  return Number(m.fixed_loss_kg) + exp * (1 + Number(m.variable_uplift_pct)/100);
}
const isRun = r => r.record_type==='run';

/* ============================ diagnostics ============================ */
function diagnose(r, ctx){
  const F=[]; const exp=+r.expected_kg, act=+r.actual_kg;
  const bm=benchmark(exp), resid=act-bm;
  const tol=Number((S.model&&S.model.tolerance_pct)||3)/100*Math.max(exp,1);
  const scrapRate=Number((S.model&&S.model.expected_scrap_pct)||0)/100;

  if(r.record_type!=='run'){
    return {findings:[{sev:'info',code:'NOT_A_RUN',title: r.record_type==='stock_count'?'Stock reconciliation, not a run':'Run still open',
      detail: r.data_quality_note || 'Excluded from the variance statistics.'}],
      verdict:{sev:'info',label: r.record_type==='stock_count'?'Stock count':'In progress',
        text: r.data_quality_note || 'No BOM or metres on this record, so there is nothing to compare consumption against.'}, bm, resid};
  }
  if(/^NOT USABLE/i.test(r.data_quality_note||'')){
    F.push({sev:'crit',code:'NOT_USABLE',title:'This record cannot be used as it stands',
      detail:esc(r.data_quality_note)});
  } else if(/^CORRECTED/i.test(r.data_quality_note||'')){
    F.push({sev:'info',code:'CORRECTED',title:'This record was corrected in the app',
      detail:esc(r.data_quality_note.replace(/^CORRECTED:?\s*/i,''))});
  }
  if(r.core_scrap_pct!==null && +r.core_scrap_pct>5){
    F.push({sev:'warn',code:'CORE_SCRAP',title:`${(+r.core_scrap_pct).toFixed(1)}% of everything extruded was scrapped`,
      detail:`${num(r.core_scrap_m)} m of core scrapped against ${num(r.good_metres)} m of good length — start ${num(r.scrap_start_m)} m, joint ${num(r.scrap_joint_m)} m, stop ${num(r.scrap_stop_m)} m. Start-up and stop scrap is fixed per run, so the shorter the run the worse this gets. It is the CCV line's version of the fixed loss per run, and here it is measured rather than inferred.`});
  }
  if(r.scrap_missing){
    const implied=act*scrapRate;
    F.push({sev:'serious',code:'SCRAP_MISSING',kg:implied,title:'Scrap was not counted for this run',
      detail:`Total Scrap was left blank, so every kilo of scrap is charged to consumption. At the ${(scrapRate*100).toFixed(1)}% rate measured on runs that did count it, roughly <b>${num(implied)} kg</b> of this run's "overconsumption" is uncounted scrap — about ${(implied/Math.max(exp,1)*100).toFixed(1)} points of the ${pct(r.variance_pct)} figure.`});
  }
  if(r.phys_chain_gap!==null && Math.abs(+r.phys_chain_gap)>50){
    const g=+r.phys_chain_gap;
    F.push({sev:'serious',code:'CHAIN_BREAK',kg:Math.abs(g),title:'Stock chain is broken before this run',
      detail:`Opening floor stock is <b>${num(r.phys_wip_open)} kg</b> but the previous record closed at <b>${num(+r.phys_wip_open-g)} kg</b> — ${num(Math.abs(g))} kg ${g<0?'disappeared':'appeared'} in between. ${Math.abs(+(r.nav_chain_gap||0))>50?'Navision moved by a similar amount in the same window, so production almost certainly ran without a monitoring sheet.':'Navision did not move, so this is a physical count or an unposted issue.'} This material is in nobody’s variance.`});
  }
  if(exp>0 && exp<2000){
    F.push({sev:'warn',code:'TOO_SMALL',title:'Run too small to judge on percentage',
      detail:(()=>{ const fl=+((S.model&&S.model.fixed_loss_kg)||0);
        return fl>0
          ? `Only ${num(exp)} kg expected. The fixed start-up loss of ~${num(fl)} kg is ${(fl/Math.max(exp,1)*100).toFixed(0)}% of that on its own. Judge short runs in kilos against the benchmark, never in percent.`
          : `Only ${num(exp)} kg expected${r.core_scrap_pct!=null?`, against ${(+r.core_scrap_pct).toFixed(1)}% of the extruded length scrapped at start-up`:''}. On a run this small the fixed start and stop losses dominate, so the percentage says more about the run length than about the process. Judge it in kilos.`; })()});
  }
  if(r.times_recorded===false){
    F.push({sev:'info',code:'DATES_ONLY',title:'The sheet records dates, not times',
      detail:'Line rate cannot be checked on this record. Adding start and stop times would let the app catch quantity errors the way it does on the sheathing line.'});
  }
  if(r.metres_per_hour!==null && ctx.medRate && (+r.metres_per_hour>ctx.medRate*2.2 || +r.metres_per_hour<ctx.medRate*0.4)){
    F.push({sev:'crit',code:'RATE_IMPLAUSIBLE',title:'Line rate is not physically plausible',
      detail:`This record implies <b>${num(r.metres_per_hour)} m/h</b> against a normal ${num(ctx.medRate)} m/h — ${(+r.metres_per_hour/ctx.medRate).toFixed(1)}&times;. The start/stop times, the metres or the withdrawal quantity is wrong, so the variance figure means nothing until it is corrected.`});
  }
  if(r.n_products>=4){
    F.push({sev:'info',code:'MIXED',title:`${r.n_products} products in one window`,
      detail:'The variance is the sum across every product on this sheet, so it cannot be attributed to any one of them. Split the sheet per product (or per extruder) if you want to know which one is losing material.'});
  }
  if(r.start_end_dev_pct!==null && +r.start_end_dev_pct>3){
    F.push({sev:'warn',code:'START_BIAS',title:'Every length starts thicker than it ends',
      detail:`START readings average <b>${(+r.thk_start_ave).toFixed(3)} mm</b> against <b>${(+r.thk_end_ave).toFixed(3)} mm</b> at the END — ${pct(r.start_end_dev_pct,1)}. ${wallWord()} mass scales with thickness, so this bias alone is worth roughly ${(+r.start_end_dev_pct/2).toFixed(1)}% of the compound on this run. See the Six Sigma tab.`});
  }
  if(r.thickness_dev_pct!==null && +r.thickness_dev_pct>3){
    F.push({sev:'warn',code:'THICK',title:wallWord()+' running above nominal thickness',
      detail:`Measured average ${(+r.thk_actual_ave).toFixed(3)} mm against a ${(+r.thk_std_nom).toFixed(2)} mm nominal — ${pct(r.thickness_dev_pct)}, worth about ${num(exp*(+r.thickness_dev_pct/100))} kg on this run.`});
  } else if(r.thickness_dev_pct!==null && +r.thickness_dev_pct<-1 && +r.variance_pct<-3){
    F.push({sev:'info',code:'THICK_OK',title:'Thickness is not the cause here',
      detail:`${wallWord()} averaged ${pct(r.thickness_dev_pct)} against nominal — the line was putting on <b>less</b> plastic than specified, yet the run still shows ${pct(r.variance_pct)}. Whatever is lost is not going onto the cable.`});
  }
  /* ledger beats the WIP-balance inference whenever it has been imported */
  const gap = r.ledger_posting_gap_kg!==null ? +r.ledger_posting_gap_kg : (r.nav_posting_gap_kg!==null? +r.nav_posting_gap_kg : null);
  const src = r.ledger_posting_gap_kg!==null ? 'ledger' : 'WIP balance';
  if(gap!==null){
    const posted = r.ledger_consumption_kg!==null ? +r.ledger_consumption_kg : +r.nav_implied_posted;
    const physOut = act + (+r.scrap_kg||0);
    if(gap<-50){
      const scr=+r.scrap_kg||0;
      const scrapExplains = scr>0 ? Math.min(100, scr/Math.abs(gap)*100) : 0;
      F.push({sev:'serious',code:'NAV_UNDER',kg:Math.abs(gap),title:'Navision posted less than was consumed',
        detail:`NAV relieved <b>${num(posted)} kg</b> from WIP (per the ${src}) while <b>${num(physOut)} kg</b> physically left the floor — a shortfall of <b>${num(Math.abs(gap))} kg</b>, which stays in Navision as WIP that does not exist.`
          + (scr>0 ? ` The recorded scrap of ${num(scr)} kg covers ${scrapExplains.toFixed(0)}% of it — scrap leaves the floor but is never posted out of the WIP location.` : '')});
    } else if(gap>50){
      F.push({sev:'warn',code:'NAV_OVER',kg:gap,title:'Navision posted more than was consumed',
        detail:`NAV relieved <b>${num(posted)} kg</b> but only <b>${num(physOut)} kg</b> physically left. ${r.ledger_posting_gap_kg!==null?'The ledger shows this MR covers production beyond what this sheet captures — the sheet and the MR are not the same scope.':'Usually a catch-up posting for an earlier run landing in this window.'}`});
    }
  }

  const blocking=F.some(f=>f.sev==='crit');
  let verdict;
  if(blocking) verdict={sev:'crit',label:'Not measurable',text:'The data problems above have to be fixed before this run’s variance means anything.'};
  else if(exp<=0) verdict={sev:'info',label:'No BOM',text:'No metres or BOM entered, so there is nothing to compare against.'};
  else if(resid>tol) verdict={sev:'serious',label:'Real excess',
    text:`${num(resid)} kg more than even the normal loss model predicts (${num(bm)} kg). This is real, investigable loss on top of the routine ${S.model.variable_uplift_pct}% + ${num(S.model.fixed_loss_kg)} kg.`};
  else if(resid<-tol) verdict={sev:'good',label:'Beat the model',text:`${num(Math.abs(resid))} kg below the normal loss model — this run went well.`};
  else verdict={sev:'good',label:'Normal',text:`Within ${(S.model&&S.model.tolerance_pct)||3}% of the established loss model. The gap to flat BOM is routine start-up and process loss, not a new problem.`};
  return {findings:F, verdict, bm, resid};
}
function enrich(){
  const rates=S.runs.filter(isRun).map(r=>r.metres_per_hour).filter(v=>v!==null).map(Number).sort((a,b)=>a-b);
  const medRate = rates.length ? rates[Math.floor(rates.length/2)] : null;
  S.ctx={medRate};
  S.runs.forEach(r=>{ r._d=diagnose(r,S.ctx); });
  attachLedgerBalances();
}
/* Derive the true WIP balance before and after each run straight from the imported ledger,
   so the NAV-WIP figures no longer have to be typed off the screen (where they were read
   before postings landed, and are wrong). Preferred method: this run's own tagged entries —
   the balance just before its first entry and just after its last — which brackets the run's
   real consumption even when several runs share a date. Falls back to the posting-date balance
   for a run with no matched entries. Nothing is written back; the typed figure is kept beside it. */
function attachLedgerBalances(){
  S.runs.forEach(r=> r._navLed=null);
  if(!S.ledger || !S.ledger.length) return;
  const M=ledgerModel();
  S.runs.forEach(r=>{
    const mine=M.withBal.filter(e=> e.run_id===r.id);
    if(mine.length){
      r._navLed={ open:+(mine[0].balance) - (+mine[0].quantity), close:+mine[mine.length-1].balance,
        src:'entries', n:mine.length };
    } else {
      const d0=dayOf(r.started_at), d1=dayOf(r.stopped_at||r.started_at);
      if(d0) r._navLed={ open:M.balanceAt(d0), close:d1?M.balanceAt(d1):null, src:'date', n:0 };
    }
  });
}
/* The scrap Navision declares for a run, de-duplicated. Navision stamps the same scrap_qty
   onto every consumption line of an MR on a given day, so the raw column multi-counts badly
   (e.g. 2,833 kg where the real figure is 659). The true declared scrap is one value per
   (MR, posting date), summed across the run's days. Entries are found by run_id, falling back
   to matching the run's own MR numbers when the ledger link was not set. Returns null when the
   run has no scrap postings. */
function runDeclaredScrap(r){
  if(!S.ledger || !S.ledger.length) return null;
  const withScrap = l => l.scrap_qty!=null && +l.scrap_qty!==0;
  let entries = S.ledger.filter(l=> l.run_id===r.id && withScrap(l));
  if(!entries.length){
    const mrs = new Set((r._items||[])
      .flatMap(i=> String(i.mr_numbers||'').split(/[\/,]/).map(m=>'MR'+m.trim()))
      .filter(x=> x!=='MR'));
    if(mrs.size) entries = S.ledger.filter(l=> mrs.has(String(l.document_no)) && withScrap(l));
  }
  if(!entries.length) return null;
  const groups=new Map();     // one scrap figure per (MR, posting date)
  entries.forEach(l=>{ const k=(l.document_no||'')+'|'+(l.posting_date||''); const v=+l.scrap_qty;
    const cur=groups.get(k); if(cur==null || v>cur) groups.set(k,v); });
  let kg=0; groups.forEach(v=> kg+=v);
  return { kg, groups:groups.size };
}
/* Everything the NAV-gap section needs, ledger preferred over the typed sheet figure.
   Returns null when there is nothing to show. */
function runNavGap(r){
  const led=r._navLed;
  const sheetO = r.nav_wip_open===null||r.nav_wip_open===undefined? null : +r.nav_wip_open;
  const sheetC = r.nav_wip_close===null||r.nav_wip_close===undefined? null : +r.nav_wip_close;
  const navO = led && led.open!=null ? +led.open : sheetO;
  const navC = led && led.close!=null ? +led.close : sheetC;
  const floorO = r.phys_wip_open===null?null:+r.phys_wip_open;
  const floorC = r.phys_wip_close===null?null:+r.phys_wip_close;
  if(navO==null && navC==null) return null;
  const gapO = (floorO!=null&&navO!=null)? floorO-navO : null;
  const gapC = (floorC!=null&&navC!=null)? floorC-navC : null;
  const move = (gapO!=null&&gapC!=null)? gapC-gapO : null;
  const basis = led ? (led.src==='entries'?'ledger — this run’s own postings':'ledger — posting-date balance') : 'the figure typed on the sheet';
  const fromLedger = !!led;
  // did the typed sheet figure disagree with the ledger?
  const mismatch = fromLedger && ((sheetO!=null&&navO!=null&&Math.abs(sheetO-navO)>1) || (sheetC!=null&&navC!=null&&Math.abs(sheetC-navC)>1));
  return {navO,navC,floorO,floorC,gapO,gapC,move,basis,fromLedger,sheetO,sheetC,mismatch};
}

/* ============================ chart primitives ============================ */
const SV=(w,h)=>{const s=document.createElementNS('http://www.w3.org/2000/svg','svg');
  s.setAttribute('viewBox',`0 0 ${w} ${h}`); s.setAttribute('width','100%'); s.setAttribute('height',h); return s;};
const SE=(t,a={})=>{const n=document.createElementNS('http://www.w3.org/2000/svg',t);
  for(const [k,v] of Object.entries(a)) if(v!==null&&v!==undefined) n.setAttribute(k,v); return n;};
const TX=(x,y,txt,extra={})=>{const t=SE('text',Object.assign({x,y,class:'axis-t'},extra)); t.textContent=txt; return t;};
function niceTicks(min,max,n=5){
  if(min===max){min-=1;max+=1;}
  const raw=(max-min)/n, mag=Math.pow(10,Math.floor(Math.log10(raw))), norm=raw/mag;
  const step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag;
  const lo=Math.floor(min/step)*step, hi=Math.ceil(max/step)*step;
  const t=[]; for(let v=lo;v<=hi+step/2;v+=step) t.push(+v.toFixed(10));
  return {ticks:t, lo, hi};
}

function chartVariance(runs){
  const all=runs.filter(r=>r.expected_kg>0);
  const rs=all.filter(r=>r._d.verdict.sev!=='crit');
  const dropped=all.length-rs.length;
  if(!rs.length) return el('div',{class:'muted small'},'No measurable runs with a BOM yet.');
  const W=880,H=300,P={t:16,r:24,b:66,l:56}, iw=W-P.l-P.r, ih=H-P.t-P.b;
  const vals=rs.map(r=>+r.variance_pct);
  const {ticks,lo,hi}=niceTicks(Math.min(-25,...vals),Math.max(10,...vals),6);
  const y=v=>P.t+ih-(v-lo)/(hi-lo)*ih;
  const step=iw/rs.length, bw=Math.min(56, step*0.62);
  const s=SV(W,H);
  ticks.forEach(t=>{ s.append(SE('line',{x1:P.l,x2:P.l+iw,y1:y(t),y2:y(t),stroke:t===0?'var(--axis)':'var(--grid)'}));
    s.append(TX(P.l-9,y(t)+3.5,t+'%',{'text-anchor':'end'})); });
  rs.forEach((r,i)=>{
    const v=+r.variance_pct, cx=P.l+step*i+step/2, y0=y(0), y1=y(v);
    const g=SE('g'); const col=v>=0?'var(--pos)':'var(--neg)';
    g.append(SE('rect',{x:cx-bw/2,y:Math.min(y0,y1),width:bw,height:Math.max(2,Math.abs(y1-y0)),rx:4,fill:col,class:'bar'}));
    g.append(SE('rect',{x:cx-bw/2,y:v>=0?y0-4:y0,width:bw,height:4,fill:col,class:'bar'}));
    tipify(g,`<b>${esc(r.sheet_ref)} &middot; ${esc(r.sizes||'')}</b>
      <span class="k">Expected</span> ${num(r.expected_kg)} kg<br>
      <span class="k">Actual</span> ${num(r.actual_kg)} kg<br>
      <span class="k">Variance</span> ${sgn(r.variance_kg)} kg (${pct(r.variance_pct)})<br>
      <span class="k">Verdict</span> ${r._d.verdict.label}`);
    s.append(g);
    const short=r.sheet_ref.replace(/^FRH /,'').replace(/^CCV /,'').replace(/ · (ISC|INS|OSC)$/,'');
    s.append(TX(cx,P.t+ih+16, short.length>17? short.slice(0,16)+'…':short,{'text-anchor':'middle'}));
    const sz=(r.sizes||'').replace('mm2 33kV','·33kV');
    s.append(TX(cx,P.t+ih+29, sz.length>17? sz.slice(0,16)+'…':sz,{'text-anchor':'middle'}));
    s.append(TX(cx, v>=0?y1-8:y1+15, v.toFixed(1)+'%',{'text-anchor':'middle',style:'font-weight:600;fill:var(--ink-2)'}));
  });
  if(dropped) s.append(TX(P.l, 10, `${dropped} record${dropped>1?'s':''} left out of this chart — the data cannot be trusted and plotting it would flatten everything else`,
    {style:'fill:var(--crit);font-weight:650'}));
  return s;
}

function chartWip(runs){
  const pts=[];
  runs.forEach(r=>{
    if(r.nav_wip_open!==null||r.phys_wip_open!==null)
      pts.push({t:new Date(r.started_at), phys:+r.phys_wip_open, nav:r.nav_wip_open===null?null:+r.nav_wip_open, lab:r.sheet_ref+' open'});
    if(r.phys_wip_close!==null)
      pts.push({t:new Date(r.stopped_at||r.started_at), phys:+r.phys_wip_close, nav:r.nav_wip_close===null?null:+r.nav_wip_close, lab:r.sheet_ref+' close'});
  });
  if(pts.length<2) return el('div',{class:'muted small'},'Not enough stock counts yet.');
  const W=880,H=320,P={t:16,r:86,b:40,l:62}, iw=W-P.l-P.r, ih=H-P.t-P.b;
  const t0=Math.min(...pts.map(p=>+p.t)), t1=Math.max(...pts.map(p=>+p.t));
  const all=pts.flatMap(p=>[p.phys,p.nav]).filter(v=>v!==null&&!isNaN(v));
  const {ticks,lo,hi}=niceTicks(0,Math.max(...all),5);
  const x=t=>P.l+(+t-t0)/((t1-t0)||1)*iw, y=v=>P.t+ih-(v-lo)/(hi-lo)*ih;
  const s=SV(W,H);
  ticks.forEach(t=>{ s.append(SE('line',{x1:P.l,x2:P.l+iw,y1:y(t),y2:y(t),stroke:'var(--grid)'}));
    s.append(TX(P.l-9,y(t)+3.5,(t/1000).toFixed(t>=1000?0:1)+'t',{'text-anchor':'end'})); });
  const navPts=pts.filter(p=>p.nav!==null);
  if(navPts.length>1){
    let d='M'+navPts.map(p=>`${x(p.t)},${y(p.nav)}`).join('L')
      +'L'+navPts.slice().reverse().map(p=>`${x(p.t)},${y(p.phys)}`).join('L')+'Z';
    s.append(SE('path',{d,fill:'var(--crit)','fill-opacity':.10}));
  }
  const line=(key,color)=>{
    const p2=pts.filter(p=>p[key]!==null&&!isNaN(p[key]));
    if(p2.length<2) return p2;
    s.append(SE('path',{d:'M'+p2.map(p=>`${x(p.t)},${y(p[key])}`).join('L'),fill:'none',stroke:color,
      'stroke-width':2,'stroke-linejoin':'round','stroke-linecap':'round'}));
    p2.forEach(p=>{ const g=SE('g');
      g.append(SE('circle',{cx:x(p.t),cy:y(p[key]),r:5,fill:'var(--surface-1)'}));
      g.append(SE('circle',{cx:x(p.t),cy:y(p[key]),r:3.6,fill:color}));
      tipify(g,`<b>${esc(p.lab)}</b><span class="k">Floor stock</span> ${num(p.phys)} kg<br>
        <span class="k">Navision WIP</span> ${p.nav===null?'—':num(p.nav)+' kg'}<br>
        <span class="k">Phantom</span> ${p.nav===null?'—':num(p.nav-p.phys)+' kg'}`);
      s.append(g); });
    return p2;
  };
  const nv=line('nav','var(--s2)'), ph=line('phys','var(--s1)');
  if(nv.length) s.append(TX(x(nv[nv.length-1].t)+10, y(nv[nv.length-1].nav)+4,'Navision',{style:'fill:var(--s2);font-weight:650'}));
  if(ph.length) s.append(TX(x(ph[ph.length-1].t)+10, y(ph[ph.length-1].phys)+4,'Floor',{style:'fill:var(--s1);font-weight:650'}));
  s.append(TX(P.l,P.t+ih+22,dt(new Date(t0))));
  s.append(TX(P.l+iw,P.t+ih+22,dt(new Date(t1)),{'text-anchor':'end'}));
  return s;
}

function chartModel(runs){
  const use=runs.filter(r=>+r.expected_kg>0);
  if(use.length<2) return el('div',{class:'muted small'},'Need at least two runs with a BOM.');
  const W=880,H=340,P={t:16,r:24,b:44,l:66}, iw=W-P.l-P.r, ih=H-P.t-P.b;
  const mx=Math.max(...use.map(r=>Math.max(+r.expected_kg,+r.actual_kg)))*1.06;
  const {ticks,lo,hi}=niceTicks(0,mx,5);
  const x=v=>P.l+(v-lo)/(hi-lo)*iw, y=v=>P.t+ih-(v-lo)/(hi-lo)*ih;
  const s=SV(W,H);
  ticks.forEach(t=>{
    s.append(SE('line',{x1:P.l,x2:P.l+iw,y1:y(t),y2:y(t),stroke:'var(--grid)'}));
    s.append(SE('line',{x1:x(t),x2:x(t),y1:P.t,y2:P.t+ih,stroke:'var(--grid)'}));
    const f=hi>=10000?(t/1000).toFixed(0)+'t':num(t);
    s.append(TX(P.l-9,y(t)+3.5,f,{'text-anchor':'end'}));
    s.append(TX(x(t),P.t+ih+18,f,{'text-anchor':'middle'}));
  });
  s.append(SE('line',{x1:x(lo),y1:y(lo),x2:x(hi),y2:y(hi),stroke:'var(--axis)','stroke-width':2}));
  s.append(SE('line',{x1:x(lo),y1:y(benchmark(lo)),x2:x(hi),y2:y(benchmark(hi)),stroke:'var(--s3)','stroke-width':2}));
  s.append(TX(x(hi)-4,y(benchmark(hi))-10,'normal loss model',{'text-anchor':'end',style:'fill:var(--s3);font-weight:650'}));
  s.append(TX(x(hi*0.66),y(hi*0.66)+34,'flat BOM — what the sheet compares to',{'text-anchor':'middle',style:'fill:var(--ink-3);font-weight:650'}));
  const maxExp=Math.max(...use.map(r=>+r.expected_kg));
  use.forEach(r=>{
    const bad=r._d.verdict.sev==='crit', hot=r._d.verdict.sev==='serious';
    const cx=x(+r.expected_kg), cy=y(+r.actual_kg), g=SE('g');
    g.append(SE('circle',{cx,cy,r:7.5,fill:'var(--surface-1)'}));
    g.append(SE('circle',{cx,cy,r:5.2,fill:bad?'var(--surface-1)':hot?'var(--crit)':'var(--s1)',
      stroke:bad?'var(--crit)':'none','stroke-width':2}));
    tipify(g,`<b>${esc(r.sheet_ref)}</b><span class="k">BOM says</span> ${num(r.expected_kg)} kg<br>
      <span class="k">Model says</span> ${num(r._d.bm)} kg<br><span class="k">Actually used</span> ${num(r.actual_kg)} kg<br>
      <span class="k">vs model</span> ${sgn(r._d.resid)} kg`);
    s.append(g);
    if(bad||hot||+r.expected_kg===maxExp)
      s.append(TX(cx+11,cy+(bad?16:4), r.sheet_ref+(bad?' — record is wrong':hot?' — real excess':''),
        {'text-anchor':'start',style:`font-weight:650;fill:${bad||hot?'var(--crit)':'var(--ink-2)'}`}));
  });
  s.append(TX(P.l+iw/2,H-6,'Expected by BOM',{'text-anchor':'middle'}));
  s.append(TX(-(P.t+ih/2),14,'Actually consumed',{'text-anchor':'middle',transform:'rotate(-90)'}));
  return s;
}

function chartWaterfall(steps){
  const W=880,H=290,P={t:24,r:20,b:64,l:70}, iw=W-P.l-P.r, ih=H-P.t-P.b;
  let cum=0; const bars=steps.map(s=>{const b={...s,y0:cum,y1:cum+s.v}; if(!s.total) cum+=s.v; return b;});
  const span=b=> b.total?[0,b.v]:[b.y0,b.y1];
  const {ticks,lo,hi}=niceTicks(Math.min(0,...bars.map(b=>Math.min(...span(b)))),Math.max(0,...bars.map(b=>Math.max(...span(b)))),5);
  const y=v=>P.t+ih-(v-lo)/(hi-lo)*ih, step=iw/bars.length, bw=Math.min(70,step*0.6);
  const s=SV(W,H);
  ticks.forEach(t=>{ s.append(SE('line',{x1:P.l,x2:P.l+iw,y1:y(t),y2:y(t),stroke:t===0?'var(--axis)':'var(--grid)'}));
    s.append(TX(P.l-9,y(t)+3.5,num(t),{'text-anchor':'end'})); });
  bars.forEach((b,i)=>{
    const cx=P.l+step*i+step/2, yA=y(b.total?0:b.y0), yB=y(b.total?b.v:b.y1);
    const top=Math.min(yA,yB), h=Math.max(3,Math.abs(yB-yA));
    if(i>0 && !bars[i-1].total && !b.total)
      s.append(SE('line',{x1:P.l+step*(i-1)+step/2+bw/2+2,x2:cx-bw/2-2,y1:y(bars[i-1].y1),y2:y(b.y0),stroke:'var(--axis)'}));
    const col=b.total?'var(--ink-2)':(b.v>0?'var(--neg)':'var(--pos)');
    const g=SE('g'); g.append(SE('rect',{x:cx-bw/2,y:top,width:bw,height:h,rx:4,fill:col,class:'bar'}));
    tipify(g,`<b>${esc(b.label.replace(/\n/g,' '))}</b>${b.note||''}<br><span class="k">Effect</span> ${sgn(b.v)} kg`);
    s.append(g);
    s.append(TX(cx,top-7,(b.total?'':(b.v>0?'+':''))+num(b.v),{'text-anchor':'middle',style:'font-weight:650;fill:var(--ink-2)'}));
    b.label.split('\n').forEach((ln,k)=> s.append(TX(cx,P.t+ih+16+k*12,ln,{'text-anchor':'middle'})));
  });
  return s;
}

/* ---------- ledger charts (posting-date basis) ---------- */
function chartMonthly(monthly){
  if(!monthly.length) return el('div',{class:'muted small'},'No ledger entries yet.');
  const W=880,H=340,P={t:26,r:24,b:62,l:66}, iw=W-P.l-P.r, ih=H-P.t-P.b;
  const hi0=Math.max(...monthly.map(m=>m.in)), lo0=Math.min(...monthly.map(m=>m.cons+m.adj));
  const {ticks,lo,hi}=niceTicks(lo0,hi0,6);
  const y=v=>P.t+ih-(v-lo)/(hi-lo)*ih;
  const step=iw/monthly.length, bw=Math.min(46,step*0.5);
  const s=SV(W,H);
  ticks.forEach(t=>{ s.append(SE('line',{x1:P.l,x2:P.l+iw,y1:y(t),y2:y(t),stroke:t===0?'var(--axis)':'var(--grid)'}));
    s.append(TX(P.l-9,y(t)+3.5,(t/1000).toFixed(0)+'t',{'text-anchor':'end'})); });
  monthly.forEach((m,i)=>{
    const cx=P.l+step*i+step/2;
    const seg=(v,y0,col,lab)=>{ if(!v) return y0;
      const y1=y0+ (y(v)-y(0));
      const g=SE('g');
      g.append(SE('rect',{x:cx-bw/2,y:Math.min(y0,y1)+1,width:bw,height:Math.max(4,Math.abs(y1-y0)-2),rx:3,fill:col,class:'bar'}));
      tipify(g,`<b>${m.k} · ${lab}</b><span class="k">Quantity</span> ${num(v,2)} kg`); s.append(g); return y1; };
    seg(m.in, y(0), 'var(--s1)','transferred in');
    let yb=seg(m.cons, y(0), 'var(--s2)','consumed');
    if(m.adj){ const y2=seg(m.adj, yb, 'var(--crit)','manual write-off');
      s.append(TX(cx, y2+13, num(m.adj,0), {'text-anchor':'middle',style:'fill:var(--crit);font-weight:700'})); }
    s.append(TX(cx,P.t+ih+16,m.k.slice(5)+'/'+m.k.slice(2,4),{'text-anchor':'middle'}));
    s.append(TX(cx,P.t+ih+30,sgn(m.net,0),{'text-anchor':'middle',style:'font-weight:650;fill:var(--ink-2)'}));
  });
  s.append(TX(P.l,P.t+ih+48,'net movement',{style:'fill:var(--ink-3)'}));
  return s;
}
function chartBalance(M, runs){
  // one point per posting date — the closing balance for that date. Plotting every
  // individual entry would show intra-day swings that have no accounting meaning.
  const byDay=new Map();
  M.withBal.forEach(l=> byDay.set(l.posting_date, l.balance));
  const L=[...byDay.entries()].sort((a,b)=>a[0].localeCompare(b[0]))
    .map(([posting_date,balance])=>({posting_date,balance}));
  if(L.length<2) return el('div',{class:'muted small'},'Not enough ledger entries.');
  const W=880,H=320,P={t:20,r:96,b:40,l:66}, iw=W-P.l-P.r, ih=H-P.t-P.b;
  const t0=+new Date(L[0].posting_date), t1=+new Date(L[L.length-1].posting_date);
  const phys=runs.filter(r=>r.phys_wip_close!=null&&r.stopped_at)
    .map(r=>({d:dayOf(r.stopped_at), t:+new Date(dayOf(r.stopped_at)), v:+r.phys_wip_close, lab:r.sheet_ref}));
  const all=[...L.map(l=>l.balance), ...phys.map(p=>p.v), 0];
  const {ticks,lo,hi}=niceTicks(Math.min(...all),Math.max(...all),5);
  const x=t=>P.l+(t-t0)/((t1-t0)||1)*iw, y=v=>P.t+ih-(v-lo)/(hi-lo)*ih;
  const s=SV(W,H);
  ticks.forEach(t=>{ s.append(SE('line',{x1:P.l,x2:P.l+iw,y1:y(t),y2:y(t),stroke:t===0?'var(--axis)':'var(--grid)'}));
    s.append(TX(P.l-9,y(t)+3.5,(t/1000).toFixed(0)+'t',{'text-anchor':'end'})); });
  // gap band between ledger balance and the physical counts
  if(phys.length>1){
    const pts=phys.map(p=>[x(p.t), y(p.v)]);
    const led=phys.map(p=>[x(p.t), y(M.balanceAt(p.d))]);
    s.append(SE('path',{d:'M'+led.map(p=>p.join(',')).join('L')+'L'+pts.slice().reverse().map(p=>p.join(',')).join('L')+'Z',
      fill:'var(--crit)','fill-opacity':.10}));
  }
  s.append(SE('path',{d:'M'+L.map(l=>`${x(+new Date(l.posting_date))},${y(l.balance)}`).join('L'),
    fill:'none',stroke:'var(--s1)','stroke-width':2,'stroke-linejoin':'round'}));
  phys.forEach(p=>{ const g=SE('g');
    g.append(SE('circle',{cx:x(p.t),cy:y(p.v),r:6,fill:'var(--surface-1)'}));
    g.append(SE('circle',{cx:x(p.t),cy:y(p.v),r:4,fill:'var(--s2)'}));
    const lb=M.balanceAt(p.d);
    tipify(g,`<b>${esc(p.lab)}</b><span class="k">Counted on the floor</span> ${num(p.v)} kg<br>
      <span class="k">Ledger balance that date</span> ${num(lb,2)} kg<br>
      <span class="k">Phantom</span> ${num(lb-p.v,2)} kg`);
    s.append(g); });
  const last=L[L.length-1];
  s.append(TX(x(+new Date(last.posting_date))+10,y(last.balance)+4,'Navision WIP',{style:'fill:var(--s1);font-weight:650'}));
  if(phys.length){ const p=phys[phys.length-1];
    s.append(TX(x(p.t)+10,y(p.v)+4,'Floor count',{style:'fill:var(--s2);font-weight:650'})); }
  s.append(TX(P.l,P.t+ih+22,dt(L[0].posting_date)));
  s.append(TX(P.l+iw,P.t+ih+22,dt(last.posting_date),{'text-anchor':'end'}));
  return s;
}

/* ---------- Six Sigma charts ---------- */
function chartHistogram(cap,LSL,USL,T,unit='mm'){
  const v=cap.vals.slice().sort((a,b)=>a-b);
  const W=880,H=300,P={t:30,r:24,b:52,l:56}, iw=W-P.l-P.r, ih=H-P.t-P.b;
  const lo=Math.min(v[0], LSL??v[0])-0.06*(cap.max-cap.min+0.1);
  const hi=Math.max(v[v.length-1], USL??v[v.length-1])+0.06*(cap.max-cap.min+0.1);
  const k=Math.max(6,Math.min(14,Math.ceil(Math.sqrt(cap.n))));
  const bw=(hi-lo)/k, bins=Array.from({length:k},()=>0);
  v.forEach(x=>{ let i=Math.floor((x-lo)/bw); if(i>=k)i=k-1; if(i<0)i=0; bins[i]++; });
  const maxB=Math.max(...bins);
  const x=t=>P.l+(t-lo)/(hi-lo)*iw, y=c=>P.t+ih-c/maxB*ih;
  const s=SV(W,H);
  for(let c=0;c<=maxB;c+=Math.max(1,Math.ceil(maxB/5))){
    s.append(SE('line',{x1:P.l,x2:P.l+iw,y1:y(c),y2:y(c),stroke:'var(--grid)'}));
    s.append(TX(P.l-9,y(c)+3.5,c,{'text-anchor':'end'})); }
  bins.forEach((c,i)=>{ if(!c) return;
    const x0=x(lo+i*bw), x1=x(lo+(i+1)*bw);
    // red only when the whole bin lies outside the limits, so the colour never
    // contradicts the "% out of spec" figure in the summary
    const oos=(LSL!=null&&lo+(i+1)*bw<=LSL)||(USL!=null&&lo+i*bw>=USL);
    const g=SE('g');
    g.append(SE('rect',{x:x0+1,y:y(c),width:Math.max(2,x1-x0-2),height:P.t+ih-y(c),rx:3,
      fill:oos?'var(--crit)':'var(--s1)',class:'bar'}));
    tipify(g,`<b>${(lo+i*bw).toFixed(3)} – ${(lo+(i+1)*bw).toFixed(3)} ${unit}</b>
      <span class="k">Readings</span> ${c} (${(c/cap.n*100).toFixed(0)}%)${oos?'<br><span style="color:var(--crit)">outside specification</span>':''}`);
    s.append(g); });
  // fitted normal curve, scaled to the count axis
  const sO=cap.overall.s;
  if(sO>0){
    const pts=[]; for(let i=0;i<=160;i++){ const t=lo+(hi-lo)*i/160;
      const d=Math.exp(-0.5*((t-cap.mu)/sO)**2)/(sO*Math.sqrt(2*Math.PI))*cap.n*bw;
      pts.push([x(t), y(Math.min(d,maxB*1.15))]); }
    s.append(SE('path',{d:'M'+pts.map(p=>`${p[0]},${p[1]}`).join('L'),
      fill:'none',stroke:'var(--ink-3)','stroke-width':1.5,opacity:.85}));
  }
  // spec lines, with labels staggered so they never collide
  const marks=[[LSL,'var(--crit)','LSL '+(LSL??''),], [USL,'var(--crit)','USL '+(USL??'')],
               [T,'var(--ink-2)','target '+(T??'')], [cap.mu,'var(--s3)','mean '+cap.mu.toFixed(3)]]
    .filter(m=>m[0]!=null).sort((a,b)=>a[0]-b[0]);
  let lastX=-1e9, tier=0;
  marks.forEach(([val,col,lab])=>{
    const px=x(val); if(px-lastX<110) tier=(tier+1)%2; else tier=0; lastX=px;
    s.append(SE('line',{x1:px,x2:px,y1:P.t-6-tier*13,y2:P.t+ih,stroke:col,'stroke-width':2}));
    s.append(TX(px,P.t-12-tier*13,lab,{'text-anchor':'middle',style:`fill:${col};font-weight:700`}));
  });
  for(let i=0;i<=4;i++){ const t=lo+(hi-lo)*i/4; s.append(TX(x(t),P.t+ih+18,t.toFixed(2),{'text-anchor':'middle'})); }
  s.append(TX(P.l+iw/2,H-6,wallWord()+' thickness ('+unit+')',{'text-anchor':'middle'}));
  return s;
}

function chartIMR(vals,labels,LSL,USL){
  const n=vals.length; if(n<3) return el('div',{class:'muted small'},'Need at least three readings.');
  const mu=mean(vals), sW=sdWithin(vals);
  const UCL=mu+3*sW, LCL=mu-3*sW;
  const W=880,H=260,P={t:18,r:72,b:36,l:56}, iw=W-P.l-P.r, ih=H-P.t-P.b;
  const all=[...vals,UCL,LCL,LSL,USL].filter(v=>v!=null);
  const {ticks,lo,hi}=niceTicks(Math.min(...all),Math.max(...all),5);
  const x=i=>P.l+(n===1?iw/2:i/(n-1)*iw), y=v=>P.t+ih-(v-lo)/(hi-lo)*ih;
  const s=SV(W,H);
  ticks.forEach(t=>{ s.append(SE('line',{x1:P.l,x2:P.l+iw,y1:y(t),y2:y(t),stroke:'var(--grid)'}));
    s.append(TX(P.l-9,y(t)+3.5,t.toFixed(2),{'text-anchor':'end'})); });
  const refs=[[LSL,'var(--crit)','LSL'],[USL,'var(--crit)','USL'],[UCL,'var(--s2)','UCL'],
              [LCL,'var(--s2)','LCL'],[mu,'var(--ink-3)','mean']].filter(r=>r[0]!=null).sort((a,b)=>b[0]-a[0]);
  let lastY=-1e9;
  refs.forEach(([v,col,lab])=>{
    s.append(SE('line',{x1:P.l,x2:P.l+iw,y1:y(v),y2:y(v),stroke:col,'stroke-width':1.5}));
    let ly=y(v)+4; if(ly-lastY<13) ly=lastY+13; lastY=ly;
    s.append(TX(P.l+iw+6,ly,lab,{style:`fill:${col};font-weight:650`}));
  });
  s.append(SE('path',{d:'M'+vals.map((v,i)=>`${x(i)},${y(v)}`).join('L'),fill:'none',stroke:'var(--s1)','stroke-width':2,'stroke-linejoin':'round'}));
  vals.forEach((v,i)=>{ const oc = v>UCL||v<LCL||(USL!=null&&v>USL)||(LSL!=null&&v<LSL);
    const g=SE('g');
    g.append(SE('circle',{cx:x(i),cy:y(v),r:5,fill:'var(--surface-1)'}));
    g.append(SE('circle',{cx:x(i),cy:y(v),r:3.4,fill:oc?'var(--crit)':'var(--s1)'}));
    tipify(g,`<b>Reading ${i+1}${labels&&labels[i]?' · '+esc(labels[i]):''}</b>
      <span class="k">Value</span> ${v.toFixed(3)} mm${oc?'<br><span style="color:var(--crit)">out of control or out of spec</span>':''}`);
    s.append(g); });
  s.append(TX(P.l+iw/2,H-4,'Reading order',{'text-anchor':'middle'}));
  return s;
}

function chartStartEnd(rows){
  if(!rows.length) return el('div',{class:'muted small'},'No paired START/END readings yet.');
  const W=880,H=76+rows.length*40,P={t:26,r:150,b:56,l:120}, iw=W-P.l-P.r;
  const all=rows.flatMap(r=>[r.s,r.e]);
  const {ticks,lo,hi}=niceTicks(Math.min(...all)*0.98,Math.max(...all)*1.02,5);
  const x=v=>P.l+(v-lo)/(hi-lo)*iw;
  const s=SV(W,H);
  ticks.forEach(t=>{ s.append(SE('line',{x1:x(t),x2:x(t),y1:P.t-10,y2:H-P.b+6,stroke:'var(--grid)'}));
    s.append(TX(x(t),H-P.b+20,t.toFixed(2),{'text-anchor':'middle'})); });
  rows.forEach((r,i)=>{
    const cy=P.t+i*40;
    s.append(TX(P.l-12,cy+4,r.label,{'text-anchor':'end',style:'fill:var(--ink-2);font-weight:600'}));
    s.append(SE('line',{x1:x(r.e),x2:x(r.s),y1:cy,y2:cy,stroke:'var(--axis)','stroke-width':2}));
    [['e','var(--s1)'],['s','var(--s2)']].forEach(([k,c])=>{
      const g=SE('g');
      g.append(SE('circle',{cx:x(r[k]),cy,r:6.5,fill:'var(--surface-1)'}));
      g.append(SE('circle',{cx:x(r[k]),cy,r:4.6,fill:c}));
      tipify(g,`<b>${esc(r.label)}</b><span class="k">START mean</span> ${r.s.toFixed(3)} mm<br>
        <span class="k">END mean</span> ${r.e.toFixed(3)} mm<br><span class="k">Bias</span> ${pct((r.s/r.e-1)*100,1)}<br>
        <span class="k">Worth</span> about ${((r.s/r.e-1)*50).toFixed(1)}% of the compound`);
      s.append(g); });
    s.append(TX(x(r.s)+12,cy+4,pct((r.s/r.e-1)*100,1),{style:'fill:var(--crit);font-weight:650'}));
  });
  s.append(TX(x(lo),P.t-16,'END of length',{style:'fill:var(--s1);font-weight:650'}));
  s.append(TX(x(hi),P.t-16,'START of length',{'text-anchor':'end',style:'fill:var(--s2);font-weight:650'}));
  s.append(TX(P.l+iw/2,H-8,'Mean '+wallWord().toLowerCase()+' thickness (mm)',{'text-anchor':'middle'}));
  return s;
}

const TABS=[['dash','Dashboard'],['diag','Diagnosis'],['runs','Runs'],['mats','Other materials'],
            ['nav','Navision'],['sys','System check'],['six','Six Sigma'],['setup','Settings']];

/* ============================================================
   Ledger arithmetic — everything here is on POSTING DATE.
   Posted date only records when someone typed the entry in; it
   never belongs in a balance. It is used solely to measure lag.
   ============================================================ */
function ledgerModel(){
  const L=S.ledger.filter(l=>l.posting_date).slice()
    .sort((a,b)=> a.posting_date.localeCompare(b.posting_date) || (a.entry_no-b.entry_no));
  const net=L.reduce((a,l)=>a+ +l.quantity,0);
  const stated = S.item.system_wip_qty!=null ? +S.item.system_wip_qty : null;
  const statedAt = S.item.system_wip_at || (L.length? L[L.length-1].posting_date : null);
  // opening balance is whatever makes the ledger arrive at the stated closing balance
  const opening = stated!=null ? stated - net : null;
  let bal = opening ?? 0;
  const withBal = L.map(l=>{ bal += +l.quantity; return {...l, balance: bal}; });
  const balanceAt = d => (opening ?? 0) + L.filter(l=>l.posting_date<=d).reduce((a,l)=>a+ +l.quantity,0);
  // monthly movement
  const months=new Map();
  L.forEach(l=>{ const k=l.posting_date.slice(0,7);
    if(!months.has(k)) months.set(k,{k,in:0,cons:0,adj:0,n:0});
    const m=months.get(k), q=+l.quantity, t=(l.entry_type||'').toLowerCase();
    m.n++;
    if(t.includes('transfer')) m.in+=q; else if(t.includes('consumption')) m.cons+=q; else m.adj+=q;
  });
  let run = opening ?? 0;
  const monthly=[...months.values()].sort((a,b)=>a.k.localeCompare(b.k))
    .map(m=>{ const net=m.in+m.cons+m.adj; run+=net; return {...m, net, close:run}; });
  return {L, withBal, net, opening, stated, statedAt, balanceAt, monthly,
          first:L.length?L[0].posting_date:null, last:L.length?L[L.length-1].posting_date:null};
}

/* the integrity checks — each returns {sev, title, detail, value} */
function integrityChecks(M){
  const C=[], L=M.L;
  const q=l=>+l.quantity, ty=l=>(l.entry_type||'').toLowerCase();
  const money=v=> v==null?'':` (${num(Math.abs(v))} in cost)`;

  // 1. does the ledger reconcile to the stated balance
  if(M.stated==null){
    C.push({sev:'warn',title:'No current system WIP recorded',
      detail:'Enter the Navision WIP-location balance on the Settings tab. Without it the ledger can show movement but not an absolute balance.'});
  } else {
    C.push({sev:'good',title:'Ledger reconciles to the stated system WIP',
      detail:`${num(L.length)} entries from ${dt(M.first)} to ${dt(M.last)} move WIP by <b>${sgn(M.net,2)} kg</b>. Working back from the ${num(M.stated,2)} kg you entered for ${dt(M.statedAt)}, the opening balance on ${dt(M.first)} must have been <b>${num(M.opening,2)} kg</b>. Every entry is accounted for — there are no gaps in the transaction record.`});
  }
  // 2. duplicates
  const seen=new Map(), dups=[];
  L.forEach(l=>{ const k=[l.posting_date,l.document_no,l.lot_no,l.quantity,l.entry_type].join('|');
    if(seen.has(k)) dups.push([seen.get(k),l]); else seen.set(k,l); });
  C.push(dups.length
    ? {sev:'crit',title:`${dups.length} possible double-posted entries`,
       detail:'Same posting date, document, lot and quantity appearing more than once: '+
         dups.slice(0,5).map(d=>`${d[0].document_no} lot ${d[0].lot_no} ${num(d[0].quantity,2)} kg (entries ${d[0].entry_no}, ${d[1].entry_no})`).join('; ')+
         `. Total ${num(dups.reduce((a,d)=>a+Math.abs(+d[1].quantity),0),2)} kg.`}
    : {sev:'good',title:'No duplicate transactions',
       detail:'No two entries share the same posting date, document, lot and quantity — nothing has been posted twice.'});
  // 3. lots consumed beyond receipts
  const tin=new Map(), tout=new Map();
  L.forEach(l=>{ if(!l.lot_no) return;
    const m = ty(l).includes('transfer') && q(l)>0 ? tin : tout;
    m.set(l.lot_no,(m.get(l.lot_no)||0)+Math.abs(q(l))); });
  const over=[...tin.keys()].filter(k=>(tout.get(k)||0) > tin.get(k)+0.01);
  C.push(over.length
    ? {sev:'crit',title:`${over.length} lots issued for more than was received`,
       detail:'A lot cannot be consumed beyond what was transferred into WIP. '+over.slice(0,5).join(', ')}
    : {sev:'good',title:'No lot issued beyond its receipts',
       detail:'Every lot consumed in WIP was either received in this period or carried in as opening stock. Lot traceability holds.'});
  // 4. negative adjustments
  const adj=L.filter(l=>ty(l).includes('adjmt') || (!ty(l).includes('transfer') && !ty(l).includes('consumption')));
  if(adj.length){
    const tot=adj.reduce((a,l)=>a+q(l),0), cost=adj.reduce((a,l)=>a+(+l.cost_amount||0),0);
    const last=adj.map(l=>l.posting_date).sort().pop();
    const users=[...new Set(adj.map(l=>l.document_no))];
    const round=adj.filter(l=>Math.abs(q(l))%500===0).length;
    const daysSince = M.last? Math.round((new Date(M.last)-new Date(last))/864e5) : 0;
    C.push({sev:'crit',title:`${adj.length} manual stock adjustments totalling ${num(tot,2)} kg`,
      detail:`Written off WIP outside any production order${cost?`, worth ${num(Math.abs(cost),2)} in cost`:''}. `+
        `${round} of them are exact multiples of 500 kg, which is the signature of a balance being forced rather than a real quantity being counted. `+
        `Documents: ${users.slice(0,6).join(', ')}${users.length>6?'…':''}. `+
        `The last one was ${dt(last)}${daysSince>30?`, ${daysSince} days ago — the write-offs stopped, which is why the phantom balance has been climbing since`:''}.`});
  } else {
    C.push({sev:'good',title:'No manual stock adjustments',
      detail:'Every movement is a transfer or a production consumption — nothing has been written off by hand.'});
  }
  // 5. posting lag (posted vs posting) — never used in a balance, only as a data-quality signal
  const lags=L.filter(l=>l.posted_date&&l.posting_date)
    .map(l=>Math.round((new Date(l.posted_date)-new Date(l.posting_date))/864e5));
  if(lags.length){
    const late=lags.filter(d=>d>=7).length, veryLate=lags.filter(d=>d>=30).length;
    const med=lags.slice().sort((a,b)=>a-b)[Math.floor(lags.length/2)];
    C.push({sev: veryLate? 'warn' : late? 'warn' : 'good',
      title:`Entries typed in a median of ${med} day${med===1?'':'s'} after their posting date`,
      detail:`${late} entries (${(late/lags.length*100).toFixed(1)}%) were entered a week or more after the date they were posted to, ${veryLate} of them a month or more, worst ${Math.max(...lags)} days. `+
        `This does not affect the balance — the app uses posting date throughout — but it is exactly why a WIP figure read off the screen on one day disagrees with the same day's figure read a week later.`});
  }
  // 6. postings landing in a later month than their posting date
  const xm=L.filter(l=>l.posted_date&&l.posting_date&&l.posted_date.slice(0,7)!==l.posting_date.slice(0,7));
  if(xm.length) C.push({sev:'warn',title:`${xm.length} entries posted into a month after the one they are dated to`,
    detail:`Net ${num(xm.reduce((a,l)=>a+q(l),0),2)} kg. Anything read from Navision before month-end close will disagree with the same period read afterwards. Only compare a physical count with the ledger balance for that posting date, never with whatever the screen showed on the day.`});
  // 7. reversals
  const rev=L.filter(l=>ty(l).includes('transfer') && q(l)<0);
  C.push(rev.length
    ? {sev:'warn',title:`${rev.length} reversed transfers`,
       detail:`${num(rev.reduce((a,l)=>a+q(l),0),2)} kg of transfers into WIP were later reversed out (${[...new Set(rev.map(l=>l.document_no))].join(', ')}). Normal correction activity, but worth confirming each one was re-issued.`}
    : {sev:'good',title:'No reversed transfers',detail:'No transfer into WIP has been backed out.'});
  // 8. balance never negative
  const neg=M.withBal.filter(l=>l.balance<0);
  C.push(neg.length
    ? {sev:'crit',title:'The WIP balance goes negative during the period',
       detail:`First on ${dt(neg[0].posting_date)} at ${num(neg[0].balance,2)} kg. Either the opening balance is understated or consumption has been posted before the matching receipt.`}
    : {sev:'good',title:'WIP balance never goes negative',
       detail:'Running the ledger forward from the derived opening balance, WIP stays positive throughout — the sequence of receipts and issues is coherent.'});
  // 9. consumption without an operation
  const noop=L.filter(l=>ty(l).includes('consumption') && !l.operation_no);
  if(noop.length) C.push({sev:'warn',title:`${noop.length} consumption lines with no operation number`,
    detail:`${num(noop.reduce((a,l)=>a-q(l),0),2)} kg cannot be attributed to a process step.`});
  // 10. sheet-vs-ledger on the same posting date
  const cmp=S.runs.filter(r=>r.nav_wip_open!=null||r.nav_wip_close!=null).flatMap(r=>{
    const out=[];
    const d0=dayOf(r.started_at), d1=dayOf(r.stopped_at||r.started_at);
    if(r.nav_wip_open!=null&&d0) out.push({run:r.sheet_ref,when:'open',date:d0,sheet:+r.nav_wip_open,led:M.balanceAt(d0)});
    if(r.nav_wip_close!=null&&d1) out.push({run:r.sheet_ref,when:'close',date:d1,sheet:+r.nav_wip_close,led:M.balanceAt(d1)});
    return out; });
  const bad=cmp.filter(c=>Math.abs(c.sheet-c.led)>50);
  if(cmp.length) C.push(bad.length
    ? {sev:'warn',title:`${bad.length} of ${cmp.length} System WIP figures on the sheets do not match the ledger`,
       detail:'Where they differ it is the sheet that is wrong, not Navision — the figure was read off the screen while postings for that date were still incomplete. See the comparison table below.'}
    : {sev:'good',title:'Every System WIP figure on the sheets matches the ledger',
       detail:'The numbers typed onto the monitoring sheets agree with the posting-date ledger balance.'});
  return {checks:C, cmp};
}

/* Cable that was extruded and then scrapped still consumed material. Cost it from the run's own
   average recipe: expected_kg ÷ total_metres is kg per core-metre, and the scrap metres are cable
   metres, so divide by cores first. Works for a multi-product run because both figures already
   blend every product on the sheet. */
function scrapMaterialKg(r, coreScrapM){
  const m = coreScrapM!=null ? +coreScrapM : (+r.core_scrap_m||0);
  const cores = +r.cores||1, tot = +r.total_metres||0, exp = +r.expected_kg||0;
  if(!m || !tot || !exp) return null;
  return exp * (m/cores) / tot;
}
const scrapKgCell = r => {
  const kg = scrapMaterialKg(r);
  if(kg===null) return '—';
  return el('span',{}, num(kg),
    el('span',{class:'muted',style:'font-weight:400'},` (${(kg/(+r.expected_kg)*100).toFixed(1)}%)`));
};

/* compact opening/withdrawn/scrap/closing → actual vs expected balance, for one run's one material */
/* flip=true for the CCV tabs, where "vs BOM" is shown as positive-means-over
   everywhere else on the page (ST2 shows raw variance_pct, negative-means-over) */

    el('td',{},lab),el('td',{class:'n '+(cls||'')},val));
  const vp = flip? -(+r.variance_pct) : +r.variance_pct;
  const t=el('table',{style:'max-width:420px;margin:4px 0 10px'});
  t.append(el('tbody',{},
    row('Floor WIP — opening', num(r.phys_wip_open)),
    row('RM withdrawn from store', num(r.rm_withdrawn)),
    row(scrapWord(), r.scrap_kg===null? el('span',{class:'pill crit'},'blank') : num(r.scrap_kg)),
    row('Floor WIP — closing', num(r.phys_wip_close)),
    row('Actual consumed', num(r.actual_kg), null, true),
    row('BOM expected', +r.expected_kg>0? num(r.expected_kg) : '—'),
    row('— of which on scrapped cable', scrapKgCell(r)),
    row('vs BOM', +r.expected_kg>0? pct(vp) : '—', (+r.variance_kg)<0?'neg':'pos', true)));
  return t;
}

  tb.append(el('tr',{style:'font-weight:650;border-top:2px solid var(--grid)'},

  t.append(tb);

    tile('Runs genuinely over-consuming', `${realExcess.length} of ${ok.length}`,

  ));

  out.append(card('Variance against flat BOM, run by run',
    'This is the chart your sheet produces today, and it is why the problem looks worse than it is. Flat BOM is not an achievable target for an extrusion line, so almost every bar is red by construction.',
    chartVariance(rs),

      el('span',{},el('i',{style:'background:var(--neg)'}),'Used more than BOM'),
      el('span',{},el('i',{style:'background:var(--pos)'}),'Used less than BOM'))));

  out.append(card('Floor stock vs Navision WIP balance',
    'The shaded gap is stock Navision believes exists but nobody can find.',

    el('div',{class:'legend'},
      el('span',{},el('i',{style:'background:var(--s1)'}),'Physical floor count'),
      el('span',{},el('i',{style:'background:var(--s2)'}),'Navision WIP location'),
      el('span',{},el('i',{style:'background:var(--crit);opacity:.35'}),'Phantom stock'))));

  const se=S.runs.filter(r=>r.start_end_dev_pct!==null);
  if(se.length){
    const avg=mean(se.map(r=>+r.start_end_dev_pct));
    out.append(el('div',{class:'note crit'},el('b',{},`Every length starts ${avg.toFixed(1)}% thicker than it ends. `),
      'Measured on ',el('b',{},String(se.reduce((a,r)=>a+ +r.thk_n,0))),' readings across ',String(se.length),
      ' runs, on every product and both compounds. That single repeatable bias is roughly half of all the variation in sheath wall, ',
      'which is why Cpk sits near 0.5 instead of 1.33 — and a line that cannot hold the wall must either run thick and pay in compound, ',
      'or run on nominal and produce cable under the minimum. ',
      el('a',{href:'#',onclick:e=>{e.preventDefault();S.tab='six';render();}},'See which is happening, product by product'),'.'));
  }
  if(missScrap) out.append(el('div',{class:'note warn'},el('b',{},`${missScrap} of ${rs.length} runs did not record scrap. `),
    'Blank scrap is charged straight to consumption, which is why those runs show the worst percentages.'));
  const cs=rs.filter(r=>r.core_scrap_pct!==null);
  if(cs.length){
    const worst=cs.slice().sort((a,b)=>b.core_scrap_pct-a.core_scrap_pct)[0];

    out.append(el('div',{class:'note '+(worst.core_scrap_pct>20?'crit':'warn')},

      `On ${worst.sheet_ref.split(' · ')[0]} that came to ${(+worst.core_scrap_pct).toFixed(1)}% of everything the line extruded; on the longest run it was `,
      `${(+cs.slice().sort((a,b)=>a.core_scrap_pct-b.core_scrap_pct)[0].core_scrap_pct).toFixed(1)}%. `,
      `Unlike the sheathing line, CCV measures this loss directly — so it can be costed and attacked without any modelling.`));
  }
  return out;
}

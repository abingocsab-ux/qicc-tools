    const bad=cmp.filter(c=>Math.abs(c.sheet-c.led)>50);
    out.append(card('The sheets vs the ledger, on the same posting date',
      'This is the test that settles who is wrong when a monitoring sheet and Navision disagree.',
      el('div',{class:'scroll'},ct),
      el('div',{class:'note '+(bad.length?'warn':'good')},
        bad.length
          ? [el('b',{},`${bad.length} of ${cmp.length} System WIP figures on the sheets are wrong. `),
             `They were read off the Items by Location screen while postings for that date were still going in, so they captured a moving target. `,
             `Where the sheet matches the ledger the variance calculation is sound; where it does not, that run's System Variance figure is meaningless. `,
             `The fix is not to stop using the screen — it is to read the balance for a posting date after that date's postings are closed, which the app now does for you.`]
          : [el('b',{},'Every figure matches. '),'The System Variance numbers on the sheets can be trusted.'])));
  }
  return out;
}

/* ---------- six sigma ---------- */
function specFor(run){
  const it=(run&&run._items)||[];
  const prods=it.map(i=>S.products.find(p=>p.id===i.product_id)).filter(Boolean);
  const withSpec=prods.filter(p=>p.std_thk_nom!=null);
  const base=withSpec[0]||prods[0]||null;
  return {LSL:base?N(base.std_thk_min):null, T:base?N(base.std_thk_nom):null, USL:base?N(base.std_thk_max):null,
          product:base, mixed:prods.length>1};
}
/* A capability study is only valid within one product — different sizes have different
   nominal walls, so pooling them measures the product mix, not the process. Scopes are
   therefore built per product, with individual runs available underneath. */
function sixScopes(runsWithThk){
  const byProd=new Map();
  runsWithThk.forEach(r=>{
    const sizes=[...new Set((r._items||[]).map(i=>i.size))];
    // on the combined CCV view the three layers share a size but have different walls —
    // pooling them would measure the layer mix, not the process
    const i=r.sheet_ref.lastIndexOf(' \u00b7 ');
    const lay = (isCombined() && i>0) ? ' — '+r.sheet_ref.slice(i+3).trim() : '';
    const key = (sizes.length===1 ? sizes[0] : '(mixed) '+r.sheet_ref) + lay;
    if(!byProd.has(key)) byProd.set(key,[]);
    byProd.get(key).push(r);
  });
  const scopes=[];
  byProd.forEach((rs,size)=>{
    const n=rs.reduce((a,r)=>a+ +r.thk_n,0);
    scopes.push({key:'p:'+size, label:`${size} — ${rs.length} run${rs.length>1?'s':''}, ${n} readings`,
      runs:rs, n, mixed:size.startsWith('(mixed)')});
  });
  scopes.sort((a,b)=>b.n-a.n);
  runsWithThk.forEach(r=> scopes.push({key:'r:'+r.id, label:`   ↳ ${r.sheet_ref} only (${r.thk_n})`,
    runs:[r], n:+r.thk_n, mixed:(r._items||[]).length>1}));
  return scopes;
}
function viewSix(){
  const out=el('div');
  const runsWithThk=S.runs.filter(r=>+r.thk_n>0);
  if(!runsWithThk.length) return card('Six Sigma — '+wallWord().toLowerCase()+' thickness capability',
    'No thickness readings recorded for this material yet.',
    el('div',{class:'muted small'},'Readings are entered per run, as START / END pairs with a min, average and max around the circumference.'));

  const scopes=sixScopes(runsWithThk);
  if(!scopes.some(s=>s.key===S.sixRun)) S.sixRun=scopes[0].key;
  const scope=scopes.find(s=>s.key===S.sixRun);
  const sel=el('select',{class:'sel',style:'min-width:260px',onchange:e=>{S.sixRun=e.target.value;S.specOverride=null;render();}},
    ...scopes.map(s=>el('option',{value:s.key,selected:S.sixRun===s.key?'selected':null},s.label)));
  const statSel=el('select',{class:'sel',onchange:e=>{S.sixStat=e.target.value;render();}},
    el('option',{value:'thk_ave',selected:S.sixStat==='thk_ave'?'selected':null},'Average around the circumference'),
    el('option',{value:'thk_min',selected:S.sixStat==='thk_min'?'selected':null},'Minimum point (standard compliance)'));

  const chosen=scope.runs;
  const spec = chosen.map(specFor).find(s=>s.T!=null) || {LSL:null,T:null,USL:null,product:null,mixed:scope.mixed};
  spec.mixed = spec.mixed || scope.mixed;
  let LSL=spec.LSL, T=spec.T, USL=spec.USL;
  const ov=S.specOverride||{};
  if(ov.LSL!=null) LSL=ov.LSL; if(ov.T!=null) T=ov.T; if(ov.USL!=null) USL=ov.USL;

  const ids=new Set(chosen.map(r=>r.id));
  const reads=S.thk.filter(t=>ids.has(t.run_id)).sort((a,b)=>a.run_id-b.run_id||a.seq-b.seq);
  const vals=reads.map(t=>N(t[S.sixStat])).filter(v=>v!=null);
  const cap = vals.length>1 ? capability(vals,LSL,USL) : null;

  out.append(card(wallWord()+' thickness capability',
    'A capability study answers a different question from the mass balance: not "how much did we use" but "how tightly can this line hold a wall thickness". Cpk below 1.33 means the process is not capable of meeting the specification without sorting; below 1.0 means it is producing out-of-spec product as a matter of routine.',
    el('div',{class:'inline',style:'margin-bottom:14px'},
      el('div',{},el('label',{},'Scope'),sel),
      el('div',{},el('label',{},'Statistic'),statSel),
      el('div',{},el('label',{},'LSL'),el('input',{type:'number',step:'0.01',value:LSL??'',style:'width:90px',
        oninput:e=>{S.specOverride={...ov,LSL:N(e.target.value)};render();}})),
      el('div',{},el('label',{},'Target'),el('input',{type:'number',step:'0.01',value:T??'',style:'width:90px',
        oninput:e=>{S.specOverride={...ov,T:N(e.target.value)};render();}})),
      el('div',{},el('label',{},'USL'),el('input',{type:'number',step:'0.01',value:USL??'',style:'width:90px',
        oninput:e=>{S.specOverride={...ov,USL:N(e.target.value)};render();}})),
      Object.keys(ov).length? el('div',{},el('label',{},' '),el('button',{class:'btn sm',onclick:()=>{S.specOverride=null;render();}},'Reset to spec')):null),
    scope.n>0? el('div',{class:'small muted',style:'margin-bottom:4px'},
      `Scope: ${chosen.map(r=>r.sheet_ref).join(', ')}`) : null,
    spec.mixed? el('div',{class:'note warn'},el('b',{},'This selection mixes products. '),
      'The readings come from a sheet covering more than one size, so the spread is partly product-to-product variation rather than process variation. Split the sheet per product before treating these numbers as a capability study.'):null,
    (LSL==null&&USL==null)? el('div',{class:'note crit'},el('b',{},'No specification limits on file for this product. '),
      'Enter the drawing limits above — capability cannot be calculated without them.'):null));

  if(cap){
    const cpk=cap.within.cpk, ppk=cap.overall.cpk;
    const rate=(c)=> c==null?'—' : c>=1.67?'excellent':c>=1.33?'capable':c>=1.0?'marginal':'not capable';
    const cls=(c)=> c==null?'' : c>=1.33?'pos':c>=1.0?'':'neg';
    out.append(el('div',{class:'grid tiles'},
      tile('Cpk (within)', cpk==null?'—':cpk.toFixed(2), rate(cpk)+' · 1.33 is the usual minimum', cls(cpk)),
      tile('Ppk (overall)', ppk==null?'—':ppk.toFixed(2), 'includes drift between runs', cls(ppk)),
      tile('Process sigma', cap.sigma==null?'—':cap.sigma.toFixed(2)+'σ', `${num(cap.dpmo)} DPMO predicted`, cap.sigma>=4?'pos':'neg'),
      tile('Mean thickness', cap.mu.toFixed(3)+' mm', T!=null? `${pct((cap.mu/T-1)*100,1)} against a ${T} mm target` : `${cap.n} readings`,
        T!=null&&cap.mu>T?'neg':'pos')));

    const sTab=el('table');
    sTab.append(el('thead',{},el('tr',{},el('th',{},''),el('th',{class:'n'},'σ'),el('th',{class:'n'},'Cp / Pp'),
      el('th',{class:'n'},'CPU'),el('th',{class:'n'},'CPL'),el('th',{class:'n'},'Cpk / Ppk'))));
    sTab.append(el('tbody',{},
      el('tr',{},el('td',{},el('b',{},'Within (short term)'),el('div',{class:'small muted'},'moving range ÷ 1.128 — what the line could hold')),
        el('td',{class:'n'},cap.within.s.toFixed(4)),el('td',{class:'n'},cap.within.cp?.toFixed(2)??'—'),
        el('td',{class:'n'},cap.within.cpu?.toFixed(2)??'—'),el('td',{class:'n'},cap.within.cpl?.toFixed(2)??'—'),
        el('td',{class:'n '+cls(cap.within.cpk)},cap.within.cpk?.toFixed(2)??'—')),
      el('tr',{},el('td',{},el('b',{},'Overall (long term)'),el('div',{class:'small muted'},'all variation — what the customer receives')),
        el('td',{class:'n'},cap.overall.s.toFixed(4)),el('td',{class:'n'},cap.overall.cp?.toFixed(2)??'—'),
        el('td',{class:'n'},cap.overall.cpu?.toFixed(2)??'—'),el('td',{class:'n'},cap.overall.cpl?.toFixed(2)??'—'),
        el('td',{class:'n '+cls(cap.overall.cpk)},cap.overall.cpk?.toFixed(2)??'—'))));
    out.append(card('Capability summary',
      `${cap.n} readings, ${cap.min.toFixed(3)} – ${cap.max.toFixed(3)} mm.`,
      el('div',{class:'scroll'},sTab),
      el('div',{class:'note '+(cap.obsLow>0.01?'crit':'')},
        el('b',{},'Observed: '),
        `${(cap.obsLow*100).toFixed(1)}% of readings below the LSL, ${(cap.obsHigh*100).toFixed(1)}% above the USL. `,
        `Predicted from the fitted normal: ${(cap.pLow*100).toFixed(2)}% low, ${(cap.pHigh*100).toFixed(2)}% high.`,
        cap.obsLow>0.01? el('div',{style:'margin-top:6px'},el('b',{},'Readings below the minimum wall thickness are a conformity issue, not a cost issue. '),
          'That is worth raising separately from the consumption question.'):null)));

    out.append(card('Distribution against the specification',
      'Red bars fall outside the limits. The grey curve is the normal distribution fitted to these readings — how the process would behave over a long run.',
      chartHistogram(cap,LSL,USL,T)));

    out.append(card('Individuals control chart',
      'Readings in the order they were taken, with control limits set from the short-term variation. Points outside the orange limits are not normal process noise — something changed. Points outside the red spec lines are product that does not meet the drawing.',
      chartIMR(vals, reads.map(t=>t.position), LSL, USL)));
  }

  const seRows=runsWithThk.filter(r=>r.thk_start_ave!=null&&r.thk_end_ave!=null)
    .map(r=>({label:r.sheet_ref, s:+r.thk_start_ave, e:+r.thk_end_ave}));
  if(seRows.length){
    const avg=mean(seRows.map(r=>(r.s/r.e-1)*100));
    out.append(card('START vs END of every length',
      'Each row is one run. The two dots are the mean thickness at the start and at the end of the measured lengths. If the process were stable they would sit on top of each other.',
      chartStartEnd(seRows),
      el('div',{class:'note crit'},
        el('b',{},`Every run, every product, both compounds: the start of a length averages ${avg.toFixed(1)}% thicker than the end. `),
        'This is not random noise — it is a repeatable bias, which means it has a mechanical cause and can be removed. ',
        'It is also most of the spread in the capability figures above: roughly half the total variation is this one effect, ',
        'so removing it would take Cpk from around 0.5 to well over 1.0 without changing anything else.'),
      el('div',{class:'note warn'},el('b',{},'Be careful how this is costed. '),
        'The bias by itself does not automatically mean extra compound — if the mean still sits on nominal, the thick starts are '+
        'paid for by thin ends. What it does mean is that the line cannot hold the wall, and that leaves only two ways to run: '+
        'centre high and pay in material, or centre on nominal and produce readings below the minimum wall. '+
        'The card below shows which one is happening for the selected product.'),
      el('div',{class:'note'},el('b',{},'Where to look: '),
        'line-speed ramp after each drum change (the puller accelerating while the screw is already at setpoint), '+
        'die and tip centering, melt temperature at start-up, and whether operators deliberately set thick at the start to guarantee the minimum wall.')));
  }

  /* ---- what capability costs, in kilos ----
     The honest question is not "how thick is it" but "how thick do you have to run
     to keep the wall above the minimum, given this much spread". With sigma s and a
     0.1% tolerated breach rate that is  LSL + 3.09 s.  Compare it with nominal.     */
  const p=spec.product;
  if(cap && p && p.dia_under_sheath_mm && p.density_g_cm3 && T!=null){
    const D=+p.dia_under_sheath_mm, rho=+p.density_g_cm3, sO=cap.overall.s;
    const K=t=>kgkm(D,t,rho), nomK=K(T);
    const safeNow = LSL!=null ? LSL+3.09*sO : null;
    const safeHalf= LSL!=null ? LSL+3.09*sO/2 : null;
    const rows=[
      ['Nominal wall — what the BOM assumes', T, nomK, 0, ''],
      ['What the line actually ran', cap.mu, K(cap.mu), (K(cap.mu)/nomK-1)*100,
        cap.mu>T? 'centred high — this shows up as extra compound' : 'centred at or below nominal — no extra compound, but see the row below'],
    ];
    if(safeNow!=null) rows.push(['Wall needed to keep 99.9% above the minimum, at today’s spread',
      safeNow, K(safeNow), (K(safeNow)/nomK-1)*100,
      cap.mu>=safeNow ? 'currently satisfied — there is margin'
        : cap.obsLow>0 ? `the line runs ${(safeNow-cap.mu).toFixed(3)} mm under this, and ${(cap.obsLow*100).toFixed(1)}% of readings did fall below the minimum`
        : `the line runs ${(safeNow-cap.mu).toFixed(3)} mm under this — no breach in this sample, but there is no margin left`]);
    if(safeHalf!=null) rows.push(['Same, if the spread were halved', safeHalf, K(safeHalf), (K(safeHalf)/nomK-1)*100,
      safeHalf<=T? 'nominal becomes safe to run — the conflict disappears' : 'still above nominal']);
    const t=el('table');
    t.append(el('thead',{},el('tr',{},el('th',{},'Scenario'),el('th',{class:'n'},'Wall (mm)'),
      el('th',{class:'n'},'kg per km'),el('th',{class:'n'},'vs BOM'),el('th',{},''))));
    t.append(el('tbody',{},...rows.map(([lab,mm,k,d,note])=>el('tr',{},el('td',{},lab),
      el('td',{class:'n'},mm.toFixed(3)),el('td',{class:'n'},num(k,1)),
      el('td',{class:'n '+(d>0.05?'neg':d<-0.05?'pos':'')},Math.abs(d)>0.005?pct(d,2):'—'),
      el('td',{class:'small muted'},note)))));
    const payingIn = cap.mu>T*1.01 ? 'material' : (cap.obsLow>0.01 ? 'conformity' : 'neither, for now');
    out.append(card('What the capability costs, in kilos',
      `Your own formula from the OSC THICKNESS sheet — kg/km = π × (D + t) × t × density — with D = ${D} mm under the sheath and density ${rho} g/cm³ for ${p.size}.`,
      el('div',{class:'scroll'},t),
      el('div',{class:'note '+(payingIn==='material'?'warn':payingIn==='conformity'?'crit':'good')},
        el('b',{},'Poor capability is always paid for in one of two currencies. '),
        payingIn==='material'
          ? `On ${p.size} you are paying in material: the line is centred ${pct((cap.mu/T-1)*100,1)} above nominal, which is ${pct((K(cap.mu)/nomK-1)*100,1)} more compound on every kilometre. That is a real, recoverable cost and it is the honest thickness contribution to the overconsumption.`
          : payingIn==='conformity'
          ? `On ${p.size} you are paying in conformity, not compound: the mean sits at nominal, so there is no extra material — but ${(cap.obsLow*100).toFixed(1)}% of readings fall below the minimum wall. Tighten the spread before anyone is tempted to fix that by simply running thicker, which would convert a quality problem into a material one.`
          : `On ${p.size} the mean is on nominal and readings are inside the limits, so thickness is not currently costing you either way. The spread still leaves no margin — that is worth fixing before it starts to.`),
      el('div',{class:'note'},el('b',{},'This is the bridge between the micrometer and the stockroom. '),
        'It converts a millimetre of wall into kilos per kilometre, so a capability improvement can be costed before anyone touches a setting.')));
  }
  return out;
}

  out.append(card('kg/km calculator','Same formula as the OSC THICKNESS sheet. Use it to sanity-check a BOM before trusting a variance.',calcBox));

}
function doCalc(){
  const D=N($('#cD')?.value), t=N($('#cT')?.value), r=N($('#cR')?.value), o=$('#cOut');
  if(!o) return; o.textContent = (D!=null&&t!=null&&r!=null)? num(kgkm(D,t,r),2)+' kg/km' : '—';
}

/* ============================ run editor ============================ */
let editRows=[], editMats=[], editThk=[];
/* Masterbatch is let-down dosed as a percentage of the base PVC compound, so its BOM is derived,
   never typed: MB BOM (kg/km) = MB% × compound BOM (kg/km), and MB expected (kg) = MB BOM × m ÷ 1000.
   The auto-dosed row is persisted as an ordinary "Other materials" row (so it flows into the
   masterbatch analytics unchanged) and is identified by a readable note that also carries the
   per-size % so it round-trips on edit. This applies to the PVC sheathing line only — the CV/CCV
   line has its own editor and is untouched. */
let mbAuto={opening_kg:'',withdrawn_kg:'',closing_kg:''};
let mbBoxRef=null;   // the masterbatch panel container, so drawRows can refresh it on add/remove size
const MB_AUTO_RE=/^Auto masterbatch/i;
function parseMbNote(note){
  const out={};
  if(!note) return out;
  note.replace(/^Auto masterbatch\s*[—-]\s*/i,'').split(';').forEach(part=>{
    const m=part.match(/^\s*(.+?)\s*@\s*([\d.]+)\s*%\s*$/);
    if(m) out[m[1].trim()]=+m[2];
  });
  return out;
}
function buildMbNote(per){
  return 'Auto masterbatch — '+per.filter(x=>(+x.pct)>0)
    .map(x=>`${x.size||'?'} @${+x.pct}%`).join('; ');
}
/* the auto masterbatch note is documentation, not a data-quality flag — the analytics must not
   treat it like a "copied sheet" note and exclude the row from the masterbatch totals. */
function isMbFlagged(m){ return !!(m&&m.note) && !MB_AUTO_RE.test(m.note); }
/* everything the masterbatch panel and the save need, derived from the current production rows */
function mbCompute(){
  const per=editRows.map(row=>{
    const bom=N(row.bom)||0, m=N(row.metres)||0, pct=N(row.mb)||0;
    const mbBom=bom*pct/100;      // kg/km  (numerically identical to g/m)
    return {size:row.size, pct, bom, metres:m, mbBom, exp:mbBom*m/1000};
  });
  const totMetres=per.reduce((a,x)=>a+x.metres,0);
  const totExp=per.reduce((a,x)=>a+x.exp,0);
  return {per, totMetres, totExp, wBom: totMetres? totExp*1000/totMetres : 0,
          active: per.some(x=>(+x.pct)>0)};
}
function openRun(id){
  const r = id ? S.runs.find(x=>x.id===id) : null;
  editRows = r ? (r._items||[]).map(i=>({...i, bom:i.bom_kg_per_km, mb:''})) : [{size:'',mr_numbers:'',metres:'',bom:'',machine:'',mb:''}];
  const allMats = r ? S.mats.filter(m=>m.run_id===r.id).map(m=>({...m})) : [];
  // separate the auto-dosed masterbatch row from operator-entered additives; rebuild its per-size %
  const autoMat = allMats.find(m=>MB_AUTO_RE.test(m.note||''));
  editMats = allMats.filter(m=>m!==autoMat);
  mbAuto = autoMat ? {opening_kg:autoMat.opening_kg??'', withdrawn_kg:autoMat.withdrawn_kg??'', closing_kg:autoMat.closing_kg??''}
                   : {opening_kg:'',withdrawn_kg:'',closing_kg:''};
  const pctBySize = parseMbNote(autoMat?.note||'');
  editRows.forEach(row=>{ if((row.mb===''||row.mb==null) && pctBySize[row.size]!=null) row.mb=pctBySize[row.size]; });
  editThk = r ? S.thk.filter(t=>t.run_id===r.id).map(t=>({...t})) : [];
  const iso=v=> v? new Date(new Date(v).getTime()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16) : '';
  const m=el('div',{class:'modal',onclick:e=>{if(e.target===m)m.remove();}});
  const c=el('div',{class:'card'});
  c.append(el('div',{class:'chead'},el('h2',{},r?`Edit ${r.sheet_ref}`:'New run')));
  c.append(el('div',{class:'csub'},'Everything else is calculated. Leave Scrap blank only if it truly was not counted — the app treats blank and zero differently on purpose. Number fields accept a sum like 20+20+20 — leave the field and it resolves to 60, like Excel.'));
  const inp=(lab,id,type,val,help,info)=>el('div',{class:'field'},
    el('label',{},lab, info?infoBtn(info):null),
    type==='number'? calcInput({id,value:val}) : el('input',{id,type,step:'any',value:val===null||val===undefined?'':val}),
    help?el('div',{class:'small muted',style:'margin-top:4px'},help):null);
  const h3i=(txt,info)=>el('h3',{style:'margin:18px 0 8px;display:flex;align-items:center'},txt, info?infoBtn(info):null);
  c.append(el('div',{class:'fgrid'},
    inp('Run reference','f_ref','text',r?.sheet_ref||'',null,
      'The sheet reference for this run — usually its date. It only labels the record; it is not used in any calculation.'),
    el('div',{class:'field'},el('label',{},'Record type', infoBtn(
      '<b>What kind of record this is</b>Production run — a normal extrusion run, scored against BOM and the loss model. '+
      'Run in progress — started but not finished, so its closing figures are provisional. '+
      'Stock reconciliation — a standalone floor count, not a run; it is excluded from consumption averages.')),
      el('select',{id:'f_type'},...['run','in_progress','stock_count'].map(v=>
        el('option',{value:v,selected:(r?.record_type||'run')===v?'selected':null},
          v==='run'?'Production run':v==='in_progress'?'Run in progress':'Stock reconciliation')))),
    inp('Line start','f_start','datetime-local',iso(r?.started_at),null,
      'When the line started this run. With the stop time it gives the run window, which drives the line-rate plausibility check.'),
    inp('Line stop','f_stop','datetime-local',iso(r?.stopped_at),null,
      'When the line stopped. Times, not just dates, are needed for the line-rate check to run.')));
  // A run left as "in progress" stays excluded from the statistics until its type is set to
  // "Production run" — it never flips on its own. If the closing data is all present, offer one click.
  if(r && r.record_type==='in_progress'){
    const complete = !!r.stopped_at && r.phys_wip_close!=null && r.phys_wip_open!=null;
    c.append(el('div',{class:'note '+(complete?'warn':''),style:'margin:2px 0 6px'},
      el('b',{}, 'This record is marked “Run in progress”. '),
      complete
        ? 'Its closing figures are all filled in, so it can be completed. Completing it includes it in the variance statistics — set the type to “Production run” and Save.'
        : 'It is excluded from the variance statistics until it is finished and the type is set to “Production run”.',
      complete? el('button',{class:'btn sm',type:'button',style:'margin-left:8px',onclick:()=>{
          const s=$('#f_type'); if(s){ s.value='run'; s.dispatchEvent(new Event('input',{bubbles:true})); }
        }},'Set to “Production run”') : null));
  }
  c.append(h3i('Material balance (kg)',
    '<b>How the run is scored</b>Actual consumed = Floor WIP opening + RM withdrawn − Total scrap − Floor WIP closing. '+
    'Expected = Σ (BOM kg/km × length ÷ 1000) across the products. vs BOM = (expected − actual) ÷ expected. '+
    'The run is then judged against the normal-loss model (fixed per-run loss + a percentage), not flat BOM — '+
    'so a short run is not punished for its fixed start-up purge.'));
  c.append(el('div',{class:'fgrid'},
    inp('Floor WIP — opening','f_po','number',r?.phys_wip_open??'',null,
      'Physical stock of this compound in WIP at the start of the run — a count, or carried from the previous run’s closing figure. Required.'),
    inp('RM withdrawn from store','f_wd','number',r?.rm_withdrawn??'',null,
      'Raw material issued from the store into WIP for this run.'),
    inp('Total scrap','f_scr','number',r?.scrap_kg??'','blank = not counted',
      '<b>Weighed scrap for the run</b>Actual consumed = opening + withdrawn − <b>scrap</b> − closing. A <b>blank</b> box means scrap was not counted, so it is charged straight to consumption and makes the variance look worse than it is; that is different from a genuine <b>0</b>. If a ledger is imported, use “Fill scrap from ledger”.'),
    inp('Floor WIP — closing','f_pc','number',r?.phys_wip_close??'',null,
      'Physical stock left in WIP at the end of the run. The difference between opening+withdrawn and closing (less scrap) is what was consumed.')));
  const dScrap = r ? runDeclaredScrap(r) : null;
  if(dScrap) c.append(el('div',{style:'display:flex;align-items:center;gap:10px;margin:2px 0 4px;flex-wrap:wrap'},

/* refresh the masterbatch panel's read-only cells. No-op outside the PVC run editor (the CCV
   editor has no masterbatch panel), so it is safe to call from recalc. */
function updateMb(){
  if(!$('#mbActual')) return;
  const fmt=v=>(v||v===0)? (Math.round(v*1000)/1000) : '';
  const c=mbCompute();
  editRows.forEach(row=>{ const els=row._mbEls; if(!els) return;
    const bom=N(row.bom)||0, pctv=N(row.mb)||0, m=N(row.metres)||0, mbBom=bom*pctv/100;
    els.sizeEl.value=row.size||'';
    els.bomEl.value = bom? fmt(bom) : '';
    els.kgkmEl.value= pctv? fmt(mbBom) : '';
    els.expEl.value = (pctv&&m)? fmt(mbBom*m/1000) : '';
    // hovering a computed total shows how it was built
    els.kgkmEl.title = pctv? `${pctv}% × ${fmt(bom)} kg/km = ${fmt(mbBom)} kg/km` : '';
    els.expEl.title  = (pctv&&m)? `${fmt(mbBom)} kg/km × ${num(m)} m ÷ 1000 = ${fmt(mbBom*m/1000)} kg` : '';
  });
  const op=N(mbAuto.opening_kg), wd=N(mbAuto.withdrawn_kg)||0, cl=N(mbAuto.closing_kg);
  const act=(op==null||cl==null)? null : (op+wd-cl);
  const ma=$('#mbActual'); ma.value = act==null? '' : fmt(act);
  ma.title = act==null? '' : `${fmt(op)} opening + ${fmt(wd)} withdrawn − ${fmt(cl)} closing = ${fmt(act)} kg`;
  const v=(act!=null && c.totExp>0)? (c.totExp-act)/c.totExp*100 : null;
  const mv=$('#mbVar'); mv.value = v==null? '' : pct(v);
  mv.title = v==null? '' : `(${fmt(c.totExp)} expected − ${fmt(act)} used) ÷ ${fmt(c.totExp)} = ${pct(v)}`;
  const tl=$('#mbTotLine');
  if(tl){
    if(c.active){
      tl.className='note';
      tl.innerHTML=`<b>Masterbatch expected ${num(c.totExp,2)} kg</b> across ${num(c.totMetres)} m `+
        `&middot; weighted ${num(c.wBom,2)} g/m. This is tracked on its own and is <b>not</b> part of the PVC compound figure above.`;
    } else {
      tl.className='note';
      tl.innerHTML='Set a masterbatch % against a size to calculate its BOM and expected. Nothing here is added to the PVC compound consumption.';
    }
  }
}

function recalc(){
  const g=id=>N($('#'+id)?.value);
  const po=g('f_po')||0, wd=g('f_wd')||0, pc=g('f_pc')||0, scr=g('f_scr');
  const act=po+wd-pc-(scr||0);
  const exp=editRows.reduce((a,r)=>a+((N(r.bom)||0)*(N(r.metres)||0)/1000),0);
  updateMb();
  const bm=benchmark(exp), resid=act-bm, box=$('#liveCalc'); if(!box) return;
  if(!exp&&!po&&!wd){ box.className='note'; box.innerHTML='<b>Live check</b><br>Fill in the balance and metres and the figures appear here as you type.'; return; }
  const vp = exp? (exp-act)/exp*100 : null;
  // closing higher than opening + withdrawn makes consumption negative — a physical impossibility
  // for a normal run (missing transfer-in, or an off closing count). Flag it rather than hide it.
  const impossible = (po+wd-(pc)) < 0;
  box.className='note '+(impossible?'crit':scr===null?'crit':resid>0.03*exp?'warn':'good');
  box.innerHTML=`<b>Live check</b><br>
    Expected by BOM <b>${num(exp)} kg</b> &nbsp;·&nbsp; Actual consumption <b>${num(act)} kg</b> &nbsp;·&nbsp; vs BOM <b>${vp===null?'—':pct(vp)}</b><br>
    Normal loss model says <b>${num(bm)} kg</b> &nbsp;·&nbsp; this run is <b class="${resid>0?'neg':'pos'}">${sgn(resid)} kg</b> against it.
    ${impossible?`<br><b style="color:var(--crit)">Closing stock (${num(pc)} kg) is higher than opening + withdrawn (${num(po+wd)} kg), so consumption comes out negative. Check the closing WIP or a missing transfer-in — the compound figures are not usable until this is resolved.</b>`:''}
    ${scr===null?'<br><b style="color:var(--crit)">Scrap is blank — the variance above is charging all scrap to consumption.</b>':''}`;
}

/* ============================ persistence ============================ */
/* A size typed into a run that the product master has never seen is added to it, so it
   autocompletes next time and appears in the Settings BOM check. An existing product is
   looked up, never modified — a one-off BOM typed on a run stays on that run. */
async function resolveProductId(itemId, size, bom){
  if(!itemId || !size) return null;
  const existing = S.products.find(p=>p.item_id===itemId && p.size===size);
  if(existing) return existing.id;
  const {data,error}=await sb.from('mc_products')
    .insert({item_id:itemId, size, bom_kg_per_km:N(bom)||0, active:true}).select('id').single();
  if(!error && data){
    S.products.push({id:data.id, item_id:itemId, size, bom_kg_per_km:N(bom)||0, active:true});
    return data.id;
  }
  /* mc_products is UNIQUE (size, item_id) — the size may already be in the master without being
     loaded here, in which case the insert above fails. Fall back to finding it. */
  const {data:found}=await sb.from('mc_products').select('id,bom_kg_per_km')
    .eq('item_id',itemId).eq('size',size).maybeSingle();
  if(found){
    S.products.push({id:found.id, item_id:itemId, size, bom_kg_per_km:found.bom_kg_per_km, active:true});
    return found.id;
  }
  console.error('could not resolve product', size, error);
  return null;   // the run item still saves — product_id is optional, the size text is what matters
}
async function saveRun(id, modal, msg){
  const g=i=>N($('#'+i)?.value), t=i=>$('#'+i)?.value||null;
  const payload={ item_id:S.item.id, sheet_ref:t('f_ref'), record_type:t('f_type')||'run',
    started_at:t('f_start')?new Date(t('f_start')).toISOString():null,
    stopped_at:t('f_stop')?new Date(t('f_stop')).toISOString():null,
    phys_wip_open:g('f_po'), phys_wip_close:g('f_pc'), rm_withdrawn:g('f_wd')||0,
    scrap_kg:g('f_scr'), nav_wip_open:g('f_no'), nav_wip_close:g('f_nc'), nav_posted_kg:g('f_np'), notes:t('f_note')};
  if(!payload.sheet_ref||!payload.started_at||payload.phys_wip_open===null){
    msg.textContent='Reference, start time and opening stock are required.'; msg.className='small err'; return; }

  /* A production row the user has started but not finished must never be dropped in silence.
     Rows left completely untouched are ignored; anything half-filled stops the save and says why. */
  const rowBlank = r => !String(r.size??'').trim() && N(r.bom)==null && N(r.metres)==null
    && !String(r.mr_numbers??'').trim() && !String(r.machine??'').trim();
  const started = editRows.filter(r=>!rowBlank(r));
  const badIdx = started.findIndex(r=> !String(r.size??'').trim() || N(r.metres)==null);
  if(badIdx>=0){
    const br=started[badIdx];
    msg.textContent=`Production row ${badIdx+1}${br.size?` (${br.size})`:''} `+
      (!String(br.size??'').trim()? 'needs a size' : 'needs Metres')+' — nothing has been saved.';
    msg.className='small err'; return;
  }
  msg.textContent='Saving…'; msg.className='small muted';
  let runId=id, err;
  if(id){ ({error:err}=await sb.from('mc_runs').update(payload).eq('id',id)); }
  else { const {data,error}=await sb.from('mc_runs').insert(payload).select('id').single(); err=error; runId=data?.id; }
  if(err){ msg.textContent=err.message; msg.className='small err'; return; }
  await sb.from('mc_run_items').delete().eq('run_id',runId);
  const items=[];
  for (const r of started){
    const pid = await resolveProductId(S.item.id, r.size, r.bom);
    items.push({run_id:runId, size:r.size, product_id:pid, mr_numbers:r.mr_numbers||null,
      bom_kg_per_km:N(r.bom)||0, metres:N(r.metres), machine:r.machine||null});
  }
  if(items.length){ const {error}=await sb.from('mc_run_items').insert(items);
    if(error){ msg.textContent=error.message; msg.className='small err'; return; } }
  await sb.from('mc_run_materials').delete().eq('run_id',runId);
  const mats=editMats.filter(m=>m.label).map(m=>({run_id:runId, label:m.label, opening_kg:N(m.opening_kg),
    withdrawn_kg:N(m.withdrawn_kg)||0, closing_kg:N(m.closing_kg), bom_g_per_m:N(m.bom_g_per_m),
    expected_kg:N(m.expected_kg), note:m.note||null}));
  // auto-dosed masterbatch: derived BOM/expected + entered actuals, saved as a normal material row
  // so it round-trips and feeds the existing masterbatch analytics. The note carries the per-size %.
  const mbc=mbCompute();
  const mbHasActual = N(mbAuto.opening_kg)!=null || N(mbAuto.withdrawn_kg)!=null || N(mbAuto.closing_kg)!=null;
  if(mbc.active || mbHasActual){
    mats.push({run_id:runId, label:'Masterbatch', opening_kg:N(mbAuto.opening_kg),
      withdrawn_kg:N(mbAuto.withdrawn_kg)||0, closing_kg:N(mbAuto.closing_kg),
      bom_g_per_m: mbc.wBom? Math.round(mbc.wBom*1000)/1000 : null,
      expected_kg: mbc.totExp? Math.round(mbc.totExp*1000)/1000 : null,
      note: buildMbNote(mbc.per)});
  }
  if(mats.length) await sb.from('mc_run_materials').insert(mats);
  await sb.from('mc_thickness').delete().eq('run_id',runId);
  const thk=editThk.filter(t=>N(t.thk_min)!=null||N(t.thk_ave)!=null||N(t.thk_max)!=null)
    .map((t,i)=>({run_id:runId, seq:i+1, position:t.position||'START',
      thk_min:N(t.thk_min), thk_ave:N(t.thk_ave), thk_max:N(t.thk_max)}));
  if(thk.length){ const {error}=await sb.from('mc_thickness').insert(thk);
    if(error){ msg.textContent=error.message; msg.className='small err'; return; } }
  modal.remove(); await loadItem(); render();
}

  await sb.from('mc_runs').delete().eq('id',id); modal.remove(); await loadItem(); render(); }

let editCcvRows=[], editCcvMat={}, editCcvThk={};
const ccvItemId = code => (S.items.find(i=>i.item_no==='CCV-'+code)||{}).id;
function newCcvRow(){ return {size:'',mr_numbers:'',metres:'',goodM:'',scrapM:'',
  bom:{ISC:'',INS:'',OSC:''}, machine:'CCV'}; }

function openCcvRun(base){
  const groups=ccvGroups();
  const g = base ? groups.find(x=>x.base===base) : null;
  const anyLayer = g && CCV_LAYERS.map(([k])=>g.L[k]).find(Boolean);
  if(base && !anyLayer){ alert('This run has no data to edit.'); return; }

  if(g){
    // one row per distinct product size, pulling each layer's own BOM for that size
    const sizes=[...new Set(CCV_LAYERS.flatMap(([k])=> (g.L[k]?._items||[]).map(i=>i.size)))];
    editCcvRows = sizes.map(size=>{
      const row=newCcvRow(); row.size=size;
      CCV_LAYERS.forEach(([k])=>{
        const it=(g.L[k]?._items||[]).find(i=>i.size===size);
        if(it){ row.bom[k]=it.bom_kg_per_km; row.mr_numbers=row.mr_numbers||it.mr_numbers||'';
          row.metres=row.metres||it.metres; row.machine=it.machine||row.machine; }
      });
      return row;
    });
    if(!editCcvRows.length) editCcvRows=[newCcvRow()];
  } else {
    editCcvRows=[newCcvRow()];
  }
  editCcvMat={}; editCcvThk={};
  CCV_LAYERS.forEach(([k])=>{ const r=g?.L[k];
    editCcvMat[k] = r ? {po:r.phys_wip_open, wd:r.rm_withdrawn, scr:r.scrap_kg, pc:r.phys_wip_close}
                       : {po:'',wd:'',scr:'',pc:''};
    editCcvThk[k] = r ? S.thk.filter(t=>t.run_id===r.id).map(t=>({...t})) : []; });

  const iso=v=> v? new Date(new Date(v).getTime()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16) : '';
  const m=el('div',{class:'modal',onclick:e=>{if(e.target===m)m.remove();}});
  const c=el('div',{class:'card',style:'max-width:920px'});
  c.append(el('div',{class:'chead'},el('h2',{},g?`Edit ${g.base.replace(/^CCV /,'')}`:'New CCV run')));
  c.append(el('div',{class:'csub'},
    'One entry covers all three materials — inner semicon, insulation and outer semicon — since they share the same run window, metres and core scrap on the sheet. Number fields accept a sum like 20+20+20 — leave the field and it resolves to 60, like Excel.'));

  const inp=(lab,id,type,val,help,info)=>el('div',{class:'field'},
    el('label',{},lab, info?infoBtn(info):null),
    type==='number'? calcInput({id,value:val}) : el('input',{id,type,step:'any',value:val===null||val===undefined?'':val}),
    help?el('div',{class:'small muted',style:'margin-top:4px'},help):null);
  const h3ci=(txt,info,extra)=>el('h3',{style:'margin:18px 0 8px;display:flex;align-items:center'+(extra||'')},txt, info?infoBtn(info):null);

  c.append(el('div',{class:'fgrid'},
    inp('Run reference','c_ref','text', g? g.base.replace(/^CCV /,'') : '',
      'e.g. "23.07 3x120+3x240 Al" — no "CCV" prefix and no material suffix, those are added automatically'),
    inp('Line start','c_start','datetime-local', iso(g?.started_at)),
    inp('Line stop','c_stop','datetime-local', iso(g?.stopped_at)),
    inp('Cores','c_cores','number', anyLayer?.cores ?? 3, null,
      'Number of cores in the cable — 3 for a three-core, 1 for single-core. Length used in the calc = (good length + scrap share) ÷ cores, so this must be right or expected consumption is off by that factor.')));

  c.append(h3ci('Core scrap (metres, shared by all three materials)',
    '<b>Cable extruded then scrapped</b>Measured in metres of core, shared by all three layers. Start = purge at the beginning, '+
    'joint = lost at a product changeover, stop = purge at the end. This is the CCV line’s fixed loss per run — on a short run it is a large share of everything extruded, which is why short runs look wild.'));
  c.append(el('div',{class:'fgrid'},
    inp('Start scrap','c_ss','number', anyLayer?.scrap_start_m ?? '', 'purge at the beginning of the run'),
    inp('Joint scrap','c_sj','number', anyLayer?.scrap_joint_m ?? '', 'lost at a product changeover, if any'),
    inp('Stop scrap','c_sp','number', anyLayer?.scrap_stop_m ?? '', 'purge at the end of the run')));

  c.append(h3ci('Products on this sheet',
    '<b>Each product/recipe on the sheet</b>One row each. If the sheet mixes two products under a single recipe (like the 3x120+3x240 aluminium sheet), split them here — one row per product with its own BOM per material — so the expected consumption blends both recipes instead of applying one to everything.'));
  c.append(el('div',{class:'small muted',style:'margin-bottom:8px'},
    'One row per product/recipe. If the sheet mixes two products under one recipe (like the 3x120+3x240 aluminium sheet), split them here — one row each, with its own BOM per material — rather than one row for both. '+
    'Metres is what the calculation actually uses: (good length + this product’s share of the core scrap above) ÷ cores. Fill in good length and scrap share and press Calc, or type Metres directly if you already have it.'));
  const rowsBox=el('div',{class:'listscroll'}); c.append(rowsBox); drawCcvRows(rowsBox);
  c.append(el('div',{style:'display:flex;gap:8px;margin:6px 0 16px'},
    el('button',{class:'btn pri sm',onclick:()=>{editCcvRows.push(newCcvRow());drawCcvRows(rowsBox);ccvRecalc();rowsBox.scrollTop=rowsBox.scrollHeight;}},'+ Add product'),
    el('button',{class:'btn sm',onclick:()=>{suggestCcvScrapSplit();drawCcvRows(rowsBox);ccvRecalc();}},'Suggest scrap split')));

  CCV_LAYERS.forEach(([k,name])=>{
    c.append(el('h3',{style:`margin:18px 0 8px;color:${CCV_COL[k]};display:flex;align-items:center`},name+' — material balance (kg)',
      infoBtn(`<b>${name} stock chain</b>Actual consumed = opening + withdrawn − bleed scrap − closing, for this layer’s own compound. `+
        'Expected = Σ (BOM × length ÷ 1000) across the products above. vs BOM = (expected − actual) ÷ expected. '+
        'The three layers are extruded together but each has its own recipe and its own stock, so they are balanced separately.')));
    const mv=editCcvMat[k];
    c.append(el('div',{class:'fgrid'},
      el('div',{class:'field'},el('label',{},'Floor WIP — opening'),
        calcInput({id:'c_po_'+k,value:mv.po})),
      el('div',{class:'field'},el('label',{},'RM withdrawn from store'),
        calcInput({id:'c_wd_'+k,value:mv.wd})),
      el('div',{class:'field'},el('label',{},'Bleed scrap (kg)',
        infoBtn('The weighed bleed/purge of this material, in kg. It is subtracted from consumption, so a <b>blank</b> box charges it all to consumption; that is different from a genuine <b>0</b>. On the CCV sheets this is often a standing 23/78/30 allowance rather than a real weighing — worth checking.')),
        calcInput({id:'c_scr_'+k,value:mv.scr}),
        el('div',{class:'small muted',style:'margin-top:4px'},
          'weighed purge for this material — blank = not counted')),
      el('div',{class:'field'},el('label',{},'Floor WIP — closing'),
        calcInput({id:'c_pc_'+k,value:mv.pc}))));
    c.append(el('h3',{style:`margin:12px 0 6px;color:${CCV_COL[k]};font-size:13px`},name+' — thickness readings (mm)'));
    const thkBox=el('div'); c.append(thkBox); drawCcvThk(k,thkBox);
    c.append(el('button',{class:'btn pri sm',style:'margin:6px 0 4px',
      onclick:()=>{editCcvThk[k].push({position:'END',thk_min:'',thk_ave:'',thk_max:''});drawCcvThk(k,thkBox);}},'+ Add reading'));
  });

  const live=el('div',{class:'note',id:'ccvLiveCalc'}); c.append(live);
  const msg=el('span',{class:'small',style:'margin-left:10px'});
  c.append(el('div',{class:'editfoot'},
    el('button',{class:'btn pri',onclick:()=>saveCcvRun(g,m,msg)},'Save run'),
    el('button',{class:'btn',onclick:()=>m.remove()},'Cancel'),
    g&&S.canEdit? el('button',{class:'btn danger',style:'margin-left:auto',onclick:()=>delCcvRun(g,m)},'Delete'):null, msg));
  m.append(c); document.body.append(m);
  c.addEventListener('input',ccvRecalc); ccvRecalc();
}

function suggestCcvScrapSplit(){
  const ss=N($('#c_ss')?.value)||0, sj=N($('#c_sj')?.value)||0, sp=N($('#c_sp')?.value)||0;
  const n=editCcvRows.length; if(!n) return;
  editCcvRows.forEach((row,i)=>{
    if(n===1) row.scrapM = (ss+sj+sp) || '';
    else if(i===0) row.scrapM = ss || '';
    else if(i===n-1) row.scrapM = (sj/(n-1)+sp) || '';
    else row.scrapM = (sj/(n-1)) || '';
  });
}
function ccvRecalc(){
  const box=$('#ccvLiveCalc'); if(!box) return;
  const lines=[]; let any=false;
  const cores=N($('#c_cores')?.value)||1;
  const scrapM=(N($('#c_ss')?.value)||0)+(N($('#c_sj')?.value)||0)+(N($('#c_sp')?.value)||0);
  const totM=editCcvRows.reduce((a,r)=>a+(N(r.metres)||0),0);
  CCV_LAYERS.forEach(([k,name])=>{
    const g=id=>N($('#'+id)?.value);
    const po=g('c_po_'+k)||0, wd=g('c_wd_'+k)||0, pc=g('c_pc_'+k)||0, scr=g('c_scr_'+k);
    const act=po+wd-pc-(scr||0);
    const exp=editCcvRows.reduce((a,r)=>a+((N(r.bom[k])||0)*(N(r.metres)||0)/1000),0);
    if(exp||po||wd) any=true;
    const vp = exp? (exp-act)/exp*100 : null;
    const scrapKg = (exp&&totM&&scrapM)? exp*(scrapM/cores)/totM : null;
    lines.push(`<div style="margin:4px 0"><b style="color:${CCV_COL[k]}">${name}</b> — expected <b>${num(exp)} kg</b>, actual <b>${num(act)} kg</b>, vs BOM <b>${vp===null?'—':pct(-vp)}</b>`
      +(scrapKg!==null?` <span class="muted">· ${num(scrapKg)} kg of it on scrapped cable (${(scrapKg/exp*100).toFixed(1)}%)</span>`:'')
      +`${scr===null?' <span style="color:var(--crit)">— bleed scrap blank</span>':''}</div>`);
  });
  if(!any){ box.className='note'; box.innerHTML='<b>Live check</b><br>Fill in the products and material balances and the figures appear here as you type.'; return; }
  box.className='note'; box.innerHTML='<b>Live check</b>'+lines.join('');
}

async function resolveCcvProductId(itemId, size, bom){
  if(!itemId || !size) return null;
  const existing = S.products.find(p=>p.item_id===itemId && p.size===size);
  if(existing){
    if(bom!=null && N(bom)!=null && N(bom)!==N(existing.bom_kg_per_km)){
      await sb.from('mc_products').update({bom_kg_per_km:N(bom)}).eq('id',existing.id);
      existing.bom_kg_per_km=N(bom);
    }
    return existing.id;
  }
  const {data,error}=await sb.from('mc_products').insert({item_id:itemId, size, bom_kg_per_km:N(bom)||0, active:true}).select('id').single();
  if(error){ console.error(error); return null; }
  S.products.push({id:data.id, item_id:itemId, size, bom_kg_per_km:N(bom)||0, active:true});
  return data.id;
}

async function saveCcvRun(g, modal, msg){
  const ref=$('#c_ref')?.value?.trim();
  const start=$('#c_start')?.value, stop=$('#c_stop')?.value;
  const cores=N($('#c_cores')?.value)||3;
  const ss=N($('#c_ss')?.value), sj=N($('#c_sj')?.value), sp=N($('#c_sp')?.value);
  if(!ref || !start){ msg.textContent='Run reference and line start are required.'; msg.className='small err'; return; }

  /* Same rule as the ST2 editor — a half-filled product row stops the save rather than vanishing. */
  const rowBlank = r => !String(r.size??'').trim() && N(r.metres)==null && N(r.goodM)==null
    && !String(r.mr_numbers??'').trim() && !CCV_LAYERS.some(([k])=>N(r.bom[k])!=null);
  const rows = editCcvRows.filter(r=>!rowBlank(r));
  const badIdx = rows.findIndex(r=> !String(r.size??'').trim() || N(r.metres)==null);
  if(badIdx>=0){
    const br=rows[badIdx];
    msg.textContent=`Product row ${badIdx+1}${br.size?` (${br.size})`:''} `+
      (!String(br.size??'').trim()? 'needs a size' : 'needs Metres — press Calc or type it in')+' — nothing has been saved.';
    msg.className='small err'; return;
  }
  if(!rows.length){ msg.textContent='At least one product with a size and metres is required.'; msg.className='small err'; return; }
  msg.textContent='Saving…'; msg.className='small muted';

  for (const [k,name] of CCV_LAYERS){
    const itemId=ccvItemId(k);
    if(!itemId) continue;
    const mv={po:N($('#c_po_'+k)?.value), wd:N($('#c_wd_'+k)?.value)||0,
      scr:N($('#c_scr_'+k)?.value), pc:N($('#c_pc_'+k)?.value)};
    const payload={ item_id:itemId, sheet_ref:`CCV ${ref} · ${k}`, record_type:'run',
      started_at:start?new Date(start).toISOString():null, stopped_at:stop?new Date(stop).toISOString():null,
      cores, scrap_start_m:ss, scrap_joint_m:sj, scrap_stop_m:sp,
      phys_wip_open:mv.po, phys_wip_close:mv.pc, rm_withdrawn:mv.wd, scrap_kg:mv.scr };
    let runId = g?.L[k]?.id, err;
    if(runId){ ({error:err}=await sb.from('mc_runs').update(payload).eq('id',runId)); }
    else { const {data,error}=await sb.from('mc_runs').insert(payload).select('id').single(); err=error; runId=data?.id; }
    if(err){ msg.textContent=`${name}: ${err.message}`; msg.className='small err'; return; }

    await sb.from('mc_run_items').delete().eq('run_id',runId);
    const items=[];
    for (const row of rows){
      const pid = await resolveCcvProductId(itemId, row.size, row.bom[k]);
      items.push({run_id:runId, size:row.size, product_id:pid, mr_numbers:row.mr_numbers||null,
        bom_kg_per_km:N(row.bom[k])||0, metres:N(row.metres), machine:row.machine||'CCV'});
    }
    if(items.length){ const {error}=await sb.from('mc_run_items').insert(items);
      if(error){ msg.textContent=`${name}: ${error.message}`; msg.className='small err'; return; } }

    await sb.from('mc_thickness').delete().eq('run_id',runId);
    const thkRows=(editCcvThk[k]||[]).filter(t=>N(t.thk_min)!=null||N(t.thk_ave)!=null||N(t.thk_max)!=null)
      .map((t,i)=>({run_id:runId, seq:i+1, position:t.position||'END',
        thk_min:N(t.thk_min), thk_ave:N(t.thk_ave), thk_max:N(t.thk_max)}));
    if(thkRows.length){ const {error}=await sb.from('mc_thickness').insert(thkRows);
      if(error){ msg.textContent=`${name}: ${error.message}`; msg.className='small err'; return; } }
  }
  modal.remove(); await loadItem(); render();
}
async function delCcvRun(g, modal){
  if(!confirm('Delete this run — all three materials — and its readings?')) return;
  for (const [k] of CCV_LAYERS){ const id=g.L[k]?.id; if(id) await sb.from('mc_runs').delete().eq('id',id); }
  modal.remove(); await loadItem(); render();
}

/* ============================ load ============================ */
const CCV_ITEM={id:'ccv', combined:true, item_no:'CCV', kind:'compound',
  description:'CCV line — inner semicon, insulation, outer semicon',
  system_wip_qty:null, system_wip_at:null, prev_wip_qty:null, prev_wip_at:null, wip_note:null};

/* Supabase / PostgREST returns at most 1000 rows per request. Any table that can exceed that
   for one item — the Navision ledger above all — must be paged through with .range(), or the
   newest rows are silently dropped (they sort last). A stable secondary order key is required
   so rows don't shift between pages. */
async function fetchAll(makeQuery){
  const PAGE=1000; let from=0, all=[];
  for(;;){
    const {data,error}=await makeQuery().range(from, from+PAGE-1);
    if(error) throw error;
    const batch=data||[]; all=all.concat(batch);
    if(batch.length<PAGE) break;
    from+=PAGE;
  }
  return all;
}
async function loadItem(){
  if(isCombined()) return loadCombined();
  const iid=S.item.id;
  const [{data:prods},{data:runs},{data:model},{data:snaps}] = await Promise.all([
    sb.from('mc_products').select('*').eq('item_id',iid).order('size'),
    sb.from('mc_run_analysis').select('*').eq('item_id',iid).order('started_at'),
    sb.from('mc_model').select('*').eq('item_id',iid).order('effective_from',{ascending:false}).limit(1).maybeSingle(),
    sb.from('mc_nav_snapshots').select('*').eq('item_id',iid).order('captured_at')
  ]);
  const led = await fetchAll(()=>sb.from('mc_nav_ledger').select('*').eq('item_id',iid).order('posting_date').order('entry_no'));
  S.products=prods||[]; S.runs=runs||[]; S.model=model||{fixed_loss_kg:0,variable_uplift_pct:0,expected_scrap_pct:0,tolerance_pct:3};
  S.snaps=snaps||[]; S.ledger=led||[];
  const ids=S.runs.map(r=>r.id);
  if(ids.length){
    const [items,mats,thk]=await Promise.all([
      fetchAll(()=>sb.from('mc_run_items').select('*').in('run_id',ids).order('id')),
      fetchAll(()=>sb.from('mc_run_materials').select('*').in('run_id',ids).order('id')),
      fetchAll(()=>sb.from('mc_thickness').select('*').in('run_id',ids).order('run_id').order('seq'))
    ]);
    S.mats=mats||[]; S.thk=thk||[];
    S.runs.forEach(r=>r._items=[]);
    (items||[]).forEach(i=>{ const r=S.runs.find(x=>x.id===i.run_id); if(r) r._items.push(i); });
  } else { S.mats=[]; S.thk=[]; }
  S.specOverride=null;
  enrich();
}
async function loadCombined(){
  const ids=S.items.filter(i=>i.item_no.startsWith('CCV-')).map(i=>i.id);
  if(!ids.length){ S.products=[];S.runs=[];S.mats=[];S.thk=[];S.ledger=[];S.snaps=[];S.model={fixed_loss_kg:0,variable_uplift_pct:0,expected_scrap_pct:0,tolerance_pct:5}; enrich(); return; }
  const [{data:prods},{data:runs},{data:model}] = await Promise.all([
    sb.from('mc_products').select('*').in('item_id',ids).order('size'),
    sb.from('mc_run_analysis').select('*').in('item_id',ids).order('started_at'),
    sb.from('mc_model').select('*').in('item_id',ids).limit(1).maybeSingle()
  ]);
  S.products=prods||[]; S.runs=runs||[];
  S.model=model||{fixed_loss_kg:0,variable_uplift_pct:0,expected_scrap_pct:0,tolerance_pct:5};
  S.snaps=[]; S.ledger=[]; S.mats=[];
  const rids=S.runs.map(r=>r.id);
  if(rids.length){
    const [items,thk]=await Promise.all([
      fetchAll(()=>sb.from('mc_run_items').select('*').in('run_id',rids).order('id')),
      fetchAll(()=>sb.from('mc_thickness').select('*').in('run_id',rids).order('run_id').order('seq'))
    ]);
    S.thk=thk||[];
    S.runs.forEach(r=>r._items=[]);
    (items||[]).forEach(i=>{ const r=S.runs.find(x=>x.id===i.run_id); if(r) r._items.push(i); });
  } else S.thk=[];
  S.specOverride=null;
  enrich();
}

async function loadAll(){
  const {data:items}=await sb.from('mc_items').select('*').order('id');
  S.items=items||[];
  const keep=S.item?.id;
  if(keep==='ccv') S.item=CCV_ITEM;
  else S.item = (keep && S.items.find(i=>i.id===keep)) || S.items.find(i=>i.kind==='compound' && !i.item_no.startsWith('CCV-')) || S.items[0];
  await loadItem();
}

/* ============================ boot ============================ */
function render(){
  renderTabs();
  const app=$('#app'); app.innerHTML='';
  const tabName= S.tab==='runSum' ? 'Run summary' : (TABS.find(t=>t[0]===S.tab)||[])[1]||'';
  app.append(el('div',{class:'printhead'},
    `${S.item?S.item.description:''} — ${tabName} · printed ${new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'})}`));
  const base={dash:viewDash,diag:viewDiag,runs:viewRuns,mats:viewMats,nav:viewNav,sys:viewSystem,six:viewSix,setup:viewSetup,runSum:viewRunSummary};
  const combined={dash:viewCcvDash,diag:viewCcvDiag,runs:viewCcvRuns,runSum:viewCcvRunSummary};
  const v = (isCombined() && combined[S.tab]) ? combined[S.tab] : base[S.tab];
  try{ app.append(v()); }
  catch(err){ app.append(el('div',{class:'card'},el('h2',{},'Something went wrong on this tab'),
    el('div',{class:'note crit'},String(err&&err.message||err)))); console.error(err); }
}
async function start(session){
  S.user=session.user; $('#who').textContent=session.user.email; $('#outBtn').classList.remove('hide');
  const {data:p}=await sb.from('profiles').select('role').eq('id',session.user.id).maybeSingle();
  S.canEdit = p?.role==='editor';
  await loadAll();
  $('#boot').classList.add('hide'); $('#login').classList.add('hide'); $('#app').classList.remove('hide');
  render();
}
$('#inBtn').onclick=async()=>{
  const m=$('#loginMsg'); m.textContent='Signing in…'; m.className='small muted';
  const {data,error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
  if(error){m.textContent=error.message;m.className='err';return;}
  start(data.session);
};
$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('#inBtn').click();});
$('#outBtn').onclick=async()=>{await sb.auth.signOut();location.reload();};
$('#printBtn').onclick=()=>{
  // print the tab that is on screen; force light so it does not burn a cartridge
  const was=document.documentElement.getAttribute('data-theme');
  document.documentElement.setAttribute('data-theme','light');
  if(S.runs.length) render();
  const done=()=>{ document.documentElement.setAttribute('data-theme',was||'light');
    if(S.runs.length) render(); window.removeEventListener('afterprint',done); };
  window.addEventListener('afterprint',done);
  setTimeout(()=>window.print(),120);
};
$('#themeBtn').onclick=()=>{
  const d=document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme',d?'light':'dark');
  $('#themeBtn').textContent=d?'Dark':'Light';
  if(S.runs.length) render();
};
(async()=>{
  const {data:{session}}=await sb.auth.getSession();
  if(session) start(session);
  else { $('#boot').classList.add('hide'); $('#login').classList.remove('hide'); }
})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="/gate.js?v=5"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QICC Production Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --red:#E60000;--red-dk:#B80000;--red-lt:#FF4D4D;
  --amber:#E9A21C;--amber-glow:rgba(233,162,28,.14);
  --blue:#3B82F6;--blue-glow:rgba(59,130,246,.14);
  --teal:#00ADA7;--teal-glow:rgba(0,173,167,.14);
  --green:#1FA463;--green-glow:rgba(31,164,99,.14);
  --red-glow:rgba(230,0,0,.13);
  --gradient-red:linear-gradient(135deg,var(--red),var(--red-dk));
  --ink:#F1F2F4;--ink2:#D6D9DE;--muted:#8B909A;--dim:#5A6478;
  --line:#2A2E36;--card:#1B1E24;--card-hover:#20242C;--dark:#0B0C0F;
  --bg:#101216;--surface:#181B21;
  --nav-bg:rgba(16,18,22,.82);--overlay-bg:rgba(16,18,22,.92);--chip-bg:rgba(11,12,15,.78);--chip-border:rgba(255,255,255,.1);
  --shadow:0 4px 24px rgba(0,0,0,.4);
  --ease:cubic-bezier(.22,1,.36,1);
  --sans:'Inter',system-ui,sans-serif;--display:'Space Grotesk',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;
}
html[data-theme="light"]{
  --amber-glow:rgba(233,162,28,.12);--blue-glow:rgba(59,130,246,.10);--teal-glow:rgba(0,173,167,.10);--green-glow:rgba(31,164,99,.10);
  --red-glow:rgba(230,0,0,.08);
  --ink:#15171A;--ink2:#33383F;--muted:#6B7280;--dim:#8A919C;
  --line:#E7E8EC;--card:#FFFFFF;--card-hover:#F6F7F9;--dark:#14161A;
  --bg:#FBFBFC;--surface:#FFFFFF;
  --nav-bg:rgba(251,251,252,.85);--overlay-bg:rgba(251,251,252,.92);--chip-bg:rgba(255,255,255,.82);--chip-border:rgba(0,0,0,.08);
  --shadow:0 4px 24px rgba(16,20,30,.10);
}
html{scroll-behavior:smooth;transition:background .3s}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .3s var(--ease),color .3s var(--ease)}
h1,h2,h3{font-family:var(--display)}
a{text-decoration:none;color:inherit}

/* ─── Nexans brand background swoosh ─── */
.bgdeco{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bgdeco svg{position:absolute;right:-8vw;bottom:-24vh;width:52vw;min-width:560px;max-width:980px;opacity:.9;
  filter:drop-shadow(0 10px 40px rgba(230,0,0,.10));transition:opacity .3s}
html:not([data-theme="light"]) .bgdeco svg{opacity:.16}

/* ─── ambient glow ─── */
.bg-glow{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bg-glow::before,.bg-glow::after{content:'';position:absolute;border-radius:50%;filter:blur(130px);opacity:.28}
.bg-glow::before{width:640px;height:640px;background:radial-gradient(circle,rgba(230,0,0,.30),transparent 70%);top:-180px;right:-120px}
.bg-glow::after{width:520px;height:520px;background:radial-gradient(circle,rgba(230,0,0,.14),transparent 70%);bottom:-120px;left:-90px}

/* ─── Nav ─── */
nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;
  padding:12px 5%;background:var(--nav-bg);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);
  border-bottom:1px solid var(--line);transition:box-shadow .3s,background .3s}
nav.scrolled{box-shadow:0 6px 30px rgba(0,0,0,.25)}
.logo{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:700;font-size:1.05rem;letter-spacing:.02em}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(1.25)}}

/* Tab pills, right-aligned beside the theme toggle */
.nav-links{display:flex;gap:4px;list-style:none;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
.nav-links a{color:var(--muted);font-size:.86rem;font-weight:500;padding:7px 16px;border-radius:8px;transition:color .2s,background .2s;cursor:pointer;white-space:nowrap}
.nav-links a:hover{color:var(--ink)}
.nav-links a.active{color:var(--ink);background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.18)}
html[data-theme="light"] .nav-links a.active{background:var(--bg);box-shadow:0 1px 3px rgba(16,20,30,.10)}
.nav-right{display:flex;align-items:center;gap:.7rem}

/* ─── Buttons ─── */
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 26px;border-radius:9px;font-weight:600;font-size:.92rem;border:none;cursor:pointer;transition:transform .2s var(--ease),box-shadow .2s;font-family:var(--sans)}
.btn-primary{background:var(--gradient-red);color:#fff;box-shadow:0 2px 10px rgba(230,0,0,.25)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(230,0,0,.35)}
.btn-outline{border:1.5px solid var(--line);color:var(--ink);background:transparent}
.btn-outline:hover{border-color:var(--red);color:var(--red-lt)}
.btn-launch{padding:11px 24px;font-size:.9rem;border-radius:10px;width:100%}
.icon-btn{width:38px;height:38px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.05rem;transition:border-color .2s,transform .2s,background .2s}
.icon-btn:hover{border-color:var(--red);transform:translateY(-1px)}

/* ─── Hero (minimal) ─── */
.hero{position:relative;z-index:1;text-align:center;padding:4.5rem 5% 2rem;max-width:880px;margin:auto}
.hero h1{font-size:clamp(2.1rem,4.8vw,3.4rem);font-weight:700;line-height:1.15;letter-spacing:-.01em}
.hero h1 .highlight{color:var(--red)}

/* ─── Section ─── */
.section{position:relative;z-index:1;padding:2.5rem 5% 5rem;max-width:1200px;margin:auto}
.section-header{text-align:center;margin-bottom:3rem}
.section-header h2{font-size:2.1rem;font-weight:700;margin-bottom:.5rem;letter-spacing:-.01em}
.section-header p{color:var(--muted);max-width:550px;margin:auto;font-size:1rem}

/* ─── Tab views ─── */
.tab-view{display:none}
.tab-view.active{display:block}

/* ─── App Cards ─── */
.apps-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1.4rem;align-items:stretch}
.app-card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:transform .3s var(--ease),border-color .3s,box-shadow .3s,background .3s;display:flex;flex-direction:column}
.app-card:hover{transform:translateY(-4px);border-color:var(--red);box-shadow:var(--shadow)}
.app-card-preview{height:150px;position:relative;overflow:hidden;border-bottom:1px solid var(--line);background:var(--surface);flex-shrink:0}
.app-card-preview iframe{width:200%;height:200%;transform:scale(.5);transform-origin:0 0;pointer-events:none;border:none}
.app-card-preview .overlay{position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,var(--overlay-bg));z-index:2}
.app-card-preview .live-chip{position:absolute;top:12px;right:12px;z-index:3;display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:50px;background:var(--chip-bg);backdrop-filter:blur(6px);border:1px solid var(--chip-border);font-size:.68rem;font-weight:600;color:var(--ink);font-family:var(--mono);letter-spacing:.04em}
.app-card-preview .live-chip .dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(31,164,99,.2)}
.app-card-body{padding:1.3rem 1.5rem;flex:1;display:flex;flex-direction:column}
.app-card-meta{display:flex;align-items:center;gap:10px;margin-bottom:1rem}
.app-icon{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:1.25rem;flex-shrink:0}
.app-icon.red{background:var(--red-glow);border:1px solid rgba(230,0,0,.22)}
.app-icon.amber{background:var(--amber-glow);border:1px solid rgba(233,162,28,.22)}
.app-icon.blue{background:var(--blue-glow);border:1px solid rgba(59,130,246,.22)}
.app-icon.teal{background:var(--teal-glow);border:1px solid rgba(0,173,167,.22)}
.app-icon.green{background:var(--green-glow);border:1px solid rgba(31,164,99,.22)}
.app-card-meta h3{font-size:1.1rem;font-weight:700;font-family:var(--display)}
.app-card-meta .badge{font-size:.66rem;font-weight:600;padding:3px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.06em;font-family:var(--mono)}
.badge-red{background:var(--red-glow);color:var(--red-lt)}
.badge-amber{background:var(--amber-glow);color:var(--amber)}
.badge-blue{background:var(--blue-glow);color:var(--blue)}
.badge-teal{background:var(--teal-glow);color:var(--teal)}
.badge-green{background:var(--green-glow);color:var(--green)}
.app-card p{color:var(--muted);font-size:.89rem;line-height:1.6;margin-bottom:1.4rem}
.app-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1.4rem;flex:1}
.tag{font-size:.7rem;padding:4px 10px;border-radius:6px;background:rgba(128,128,128,.08);color:var(--dim);border:1px solid var(--line);font-weight:500;font-family:var(--mono)}

/* ─── Manage Apps Tab ─── */
.manage-section{position:relative;z-index:1;padding:2.5rem 5% 5rem;max-width:900px;margin:auto}
.manage-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;flex-wrap:wrap;gap:1rem}
.manage-header h2{font-size:1.8rem;font-weight:700}
.manage-list{display:flex;flex-direction:column;gap:1rem;margin-bottom:2.5rem}
.manage-item{display:flex;align-items:center;gap:1rem;padding:1rem 1.4rem;background:var(--card);border:1px solid var(--line);border-radius:12px;transition:border-color .2s}
.manage-item:hover{border-color:var(--red)}
.manage-item .app-icon{width:38px;height:38px;font-size:1.1rem;flex-shrink:0}
.manage-item-info{flex:1;min-width:0}
.manage-item-info h4{font-family:var(--display);font-weight:600;font-size:.95rem;margin-bottom:2px}
.manage-item-info span{font-size:.78rem;color:var(--muted);font-family:var(--mono);word-break:break-all}
.manage-item .btn-del{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;font-size:.9rem;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.manage-item .btn-del:hover{border-color:var(--red);color:var(--red-lt);background:var(--red-glow)}
.manage-empty{text-align:center;padding:3rem;color:var(--muted);font-size:.95rem}

/* ─── Grid / sync status ─── */
.grid-status{grid-column:1/-1;text-align:center;padding:3rem;color:var(--muted);font-size:.95rem}
.grid-status.error{color:var(--red-lt)}
.sync-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:50px;font-size:.7rem;font-weight:600;font-family:var(--mono);letter-spacing:.04em;border:1px solid var(--line);color:var(--muted);background:var(--card)}
.sync-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(31,164,99,.2)}
.sync-badge.offline .dot{background:var(--amber);box-shadow:0 0 0 3px var(--amber-glow)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);z-index:200;padding:12px 24px;border-radius:10px;background:var(--surface);border:1px solid var(--line);color:var(--ink);font-size:.88rem;font-weight:500;box-shadow:0 12px 40px rgba(0,0,0,.3);opacity:0;transition:transform .3s var(--ease),opacity .3s;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.error{border-color:var(--red);color:var(--red-lt)}
.toast.success{border-color:var(--green);color:var(--green)}

/* ─── Add App Form (inline in Manage tab) ─── */
.add-form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:2rem}
.add-form h3{font-family:var(--display);font-size:1.2rem;margin-bottom:1.4rem}
.add-form label{display:block;font-size:.78rem;font-weight:600;color:var(--muted);margin-bottom:5px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em}
.add-form input,.add-form select,.add-form textarea{width:100%;padding:10px 13px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-family:var(--sans);font-size:.9rem;margin-bottom:1rem;transition:border-color .2s}
.add-form input:focus,.add-form select:focus,.add-form textarea:focus{outline:none;border-color:var(--red)}
.add-form textarea{resize:vertical;min-height:50px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.form-actions{display:flex;gap:.8rem;margin-top:.4rem}
.form-actions .btn{flex:1;justify-content:center}

/* ─── Login Modal ─── */
.modal-overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:2rem}
.modal-overlay.active{display:flex}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:2.4rem;width:100%;max-width:400px;box-shadow:0 24px 80px rgba(0,0,0,.4);text-align:center}
.modal h2{font-family:var(--display);font-size:1.3rem;margin-bottom:.5rem;color:var(--ink)}
.modal .modal-sub{color:var(--muted);font-size:.88rem;margin-bottom:1.6rem}
.modal .lock-icon{font-size:2.4rem;margin-bottom:1rem;display:block}
.modal input{width:100%;padding:12px 14px;border-radius:9px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-family:var(--sans);font-size:.95rem;margin-bottom:1rem;text-align:center;letter-spacing:.15em;transition:border-color .2s}
.modal input:focus{outline:none;border-color:var(--red)}
.modal .error-msg{color:var(--red-lt);font-size:.82rem;margin-bottom:.8rem;display:none}
.modal input[type="email"]{letter-spacing:normal}
.signed-in-as{font-size:.8rem;color:var(--muted);font-family:var(--mono)}
.signed-in-as b{color:var(--ink);font-weight:600}
.modal-actions{display:flex;gap:.8rem}
.modal-actions .btn{flex:1;justify-content:center}

/* ─── Icon Picker ─── */
.icon-picker-wrap{position:relative;margin-bottom:1rem}
.icon-picker-btn{width:100%;padding:10px 13px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:1.3rem;cursor:pointer;text-align:left;display:flex;align-items:center;gap:10px;transition:border-color .2s}
.icon-picker-btn:hover,.icon-picker-btn:focus{border-color:var(--red);outline:none}
.icon-picker-btn .picker-label{font-size:.82rem;color:var(--muted);font-family:var(--sans)}
.icon-picker-dropdown{position:absolute;top:100%;left:0;right:0;z-index:10;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;margin-top:4px;padding:10px;display:none;box-shadow:0 12px 40px rgba(0,0,0,.3);max-height:260px;overflow-y:auto}
.icon-picker-dropdown.open{display:block}
.icon-picker-category{font-size:.7rem;font-weight:600;color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;padding:6px 4px 4px;margin-top:4px}
.icon-picker-category:first-child{margin-top:0}
.icon-picker-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}
.icon-pick{width:100%;aspect-ratio:1;border:none;background:transparent;border-radius:8px;font-size:1.3rem;cursor:pointer;transition:background .15s,transform .15s;display:flex;align-items:center;justify-content:center}
.icon-pick:hover{background:var(--red-glow);transform:scale(1.15)}
.icon-pick.selected{background:var(--red-glow);box-shadow:inset 0 0 0 2px var(--red)}
.icon-search{width:100%;padding:7px 10px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:.82rem;margin-bottom:8px;font-family:var(--sans)}
.icon-search:focus{outline:none;border-color:var(--red)}

/* ─── Delete btn on custom cards (main grid) ─── */
.card-delete{position:absolute;top:12px;left:12px;z-index:3;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:.85rem;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s}
.app-card:hover .card-delete{opacity:1}
.card-delete:hover{background:var(--red)}

/* ─── Footer ─── */
footer{position:relative;z-index:1;border-top:1px solid var(--line);padding:2.8rem 5%;max-width:1100px;margin:auto}
footer p{text-align:center;color:var(--dim);font-size:.8rem}

/* ─── Responsive ─── */
@media(max-width:768px){
  nav{padding:10px 4%}
  .nav-links a{padding:6px 11px;font-size:.8rem}
  .sync-badge{display:none}
  .apps-grid{grid-template-columns:1fr}
  .hero h1{font-size:1.9rem}
  .bgdeco svg{width:80vw;min-width:0}
  .form-row{grid-template-columns:1fr}
  .manage-header{flex-direction:column;align-items:flex-start}
}
</style>
</head>
<body>
<div class="bgdeco" aria-hidden="true">
<svg viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nxswoosh" x1="0" y1="1" x2="0.75" y2="0">
      <stop offset="0" stop-color="#FFB3B3" stop-opacity="0"></stop>
      <stop offset="0.42" stop-color="#FF6B6B" stop-opacity="0.72"></stop>
      <stop offset="1" stop-color="#E60000"></stop>
    </linearGradient>
  </defs>
  <path d="M85 700 C85 330 205 165 330 165 C455 165 555 330 585 700" fill="none" stroke="url(#nxswoosh)" stroke-width="150" stroke-linecap="round"></path>
</svg>
</div>
<div class="bg-glow"></div>

<!-- NAV -->
<nav id="topnav">
  <a href="#" class="logo" onclick="switchTab('apps');return false;" title="QICC Production Platform">
    QICC Production
  </a>
  <div class="nav-right">
    <span class="sync-badge" id="syncBadge" title="Data source"><span class="dot"></span> <span id="syncLabel">SYNCED</span></span>
    <ul class="nav-links">
      <li><a href="#" id="tabApps" class="active" onclick="switchTab('apps');return false;">Applications</a></li>
      <li><a href="#" id="tabManage" onclick="handleManageClick();return false;">Manage Apps</a></li>
    </ul>
    <button class="icon-btn" id="themeToggle" title="Toggle dark / light mode" onclick="toggleTheme()">☀</button>
  </div>
</nav>
<div class="toast" id="toast"></div>

<!-- HERO -->
<section class="hero">
  <h1>QICC <span class="highlight">Production</span> Platform</h1>
</section>

<!-- ═══ TAB: Applications ═══ -->
<div class="tab-view active" id="viewApps">
  <section class="section">
    <div class="apps-grid" id="appsGrid">
      <div class="grid-status" id="gridStatus">Loading applications…</div>
    </div>
  </section>
</div>

<!-- ═══ TAB: Manage Apps ═══ -->
<div class="tab-view" id="viewManage">
  <section class="manage-section">
    <div class="manage-header">
      <h2>Manage Applications</h2>
    </div>

    <h3 style="font-family:var(--display);font-size:1rem;color:var(--muted);margin-bottom:1rem">All Applications</h3>
    <div class="manage-list" id="manageList"></div>

    <!-- Add App Form -->
    <div class="add-form">
      <h3>+ Add New Application</h3>
      <label>App Name *</label>
      <input type="text" id="appName" placeholder="e.g. Production Trials">
      <label>Netlify URL *</label>
      <input type="url" id="appUrl" placeholder="https://your-app.netlify.app">
      <div class="form-row">
        <div>
          <label>Icon</label>
          <div class="icon-picker-wrap">
            <button type="button" class="icon-picker-btn" id="iconPickerBtn" onclick="toggleIconPicker()">
              <span id="iconPickerPreview">📦</span>
              <span class="picker-label">Choose icon</span>
            </button>
            <div class="icon-picker-dropdown" id="iconPickerDrop">
              <input type="text" class="icon-search" id="iconSearch" placeholder="Search icons..." oninput="filterIcons(this.value)">
              <div id="iconGridContainer"></div>
            </div>
          </div>
          <input type="hidden" id="appIcon" value="📦">
        </div>
        <div>
          <label>Color Theme</label>
          <select id="appColor">
            <option value="red">Red</option>
            <option value="amber">Amber</option>
            <option value="blue">Blue</option>
            <option value="teal">Teal</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div>
          <label>Badge Text</label>
          <input type="text" id="appBadge" placeholder="e.g. Analytics">
        </div>
        <div>
          <label>Tags (comma-separated)</label>
          <input type="text" id="appTags" placeholder="e.g. Scrap, Routing">
        </div>
      </div>
      <label>Description</label>
      <textarea id="appDesc" placeholder="Short description of the app"></textarea>
      <div class="form-actions">
        <button class="btn btn-primary" onclick="saveApp()">Add Application</button>
      </div>
    </div>
  </section>
</div>

<!-- FOOTER -->
<footer>

</footer>

<script>
/* ═══════════════════════════════════════════════════════════════
   QICC Production Platform — Suite Landing Page
   Data layer: Azure Postgres (suite_apps) with localStorage cache
   fallback so the page still renders if the network is unavailable.
   ═══════════════════════════════════════════════════════════════ */

// ─── Config ───────────────────────────────────────────────────────
const CACHE_KEY='qicc_suite_apps_cache_v3';
const THEME_KEY='qicc_suite_theme';

let APPS=[];
let isEditor=true;
let selectedIcon='📦';

// ─── Small utilities ──────────────────────────────────────────────
function esc(s){const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}

function toast(msg,type){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.className='toast show'+(type?' '+type:'');
  clearTimeout(t._timer);
  t._timer=setTimeout(()=>{t.className='toast'+(type?' '+type:'');},3000);
}

function setSyncStatus(online){
  const badge=document.getElementById('syncBadge');
  const label=document.getElementById('syncLabel');
  badge.classList.toggle('offline',!online);
  label.textContent=online?'SYNCED':'OFFLINE';
  badge.title=online?'Apps are shared from the QICC database':'Showing cached apps — changes will not be saved';
}

/**
 * Normalize a user-entered URL.
 *  - Local page links (ccv-line.html) pass through untouched
 *  - Bare domains get https:// prepended
 *  - Directory-style URLs get a trailing slash
 */
function normalizeUrl(raw){
  let u=(raw||'').trim();
  if(!u)return '';
  if(/^[\w-]+\.html?$/i.test(u))return u;
  if(u.startsWith('/')){
    if(!u.endsWith('/')&&!/\/[^/]*\.[a-z0-9]+$/i.test(u))u+='/';
    return u;
  }
  if(!/^https?:\/\//i.test(u))u='https://'+u.replace(/^\/+/,'');
  if(!u.endsWith('/')&&!/\/[^/]*\.[a-z0-9]+$/i.test(u))u+='/';
  return u;
}

// ─── Nav / theme ──────────────────────────────────────────────────
const navEl=document.getElementById('topnav');
window.addEventListener('scroll',()=>navEl.classList.toggle('scrolled',window.scrollY>20));

function toggleTheme(){
  const html=document.documentElement;
  const next=html.getAttribute('data-theme')==='light'?'dark':'light';
  if(next==='light')html.setAttribute('data-theme','light');else html.removeAttribute('data-theme');
  const btn=document.getElementById('themeToggle');if(btn)btn.textContent=next==='light'?'🌙':'☀';
  try{localStorage.setItem(THEME_KEY,next);}catch(e){}
}
function initTheme(){
  let saved='dark';
  try{saved=localStorage.getItem(THEME_KEY)||'dark';}catch(e){}
  if(saved==='light')document.documentElement.setAttribute('data-theme','light');
  const btn=document.getElementById('themeToggle');if(btn)btn.textContent=saved==='light'?'🌙':'☀';
}
window.toggleTheme=toggleTheme;
initTheme();

// ─── Tabs ─────────────────────────────────────────────────────────
function switchTab(tab){
  document.getElementById('viewApps').classList.toggle('active',tab==='apps');
  document.getElementById('viewManage').classList.toggle('active',tab==='manage');
  document.getElementById('tabApps').classList.toggle('active',tab==='apps');
  document.getElementById('tabManage').classList.toggle('active',tab==='manage');
  if(tab==='manage')renderManageList();
}

function handleManageClick(){
  switchTab('manage');
}

function closeLoginModal(){
  const el=document.getElementById('loginModal');
  if(el)el.classList.remove('active');
}

// ─── Icon picker ──────────────────────────────────────────────────
const ICON_CATEGORIES={
  'Manufacturing':['🏭','⚙️','🔧','🔩','🛠️','⛏️','🪛','🔨','🪚','🧲','🔌','💡','🔋','⚡','🔥','♨️','💨','🌡️','🧯','🪝'],
  'Analytics & Data':['📊','📈','📉','📋','📑','📄','🗂️','🗃️','📁','💹','🧮','🔢','📐','📏','🎯','✅','❌','⚠️','🔍','🔎'],
  'People & Teams':['👥','👤','🧑‍🔧','🧑‍💼','🧑‍🏭','👷','🤝','🏅','🎓','📝','🗓️','⏱️','⏰','🕐','📅','🧑‍🤝‍🧑','👨‍💻','🧑‍🔬','🧑‍🏫','🏆'],
  'Materials & Products':['🔗','🧪','🧬','💎','🪨','🧱','📦','🎁','🏷️','🔖','🪙','💰','🛢️','🧵','🪢','🧶','📿','🔮','💊','🧫'],
  'Transport & Logistics':['🚛','🚚','📬','📮','📩','📨','📤','📥','🚢','✈️','🛒','🏗️','🔄','↗️','↘️','🔀','🔁','🔃','📡','🛰️'],
  'Status & Indicators':['🟢','🔴','🟡','🟠','🔵','🟣','⚪','⚫','🟤','💚','❤️','💛','🧡','💙','💜','🤍','🖤','🤎','✨','💫'],
  'Tools & Tech':['💻','🖥️','🖨️','📱','📟','🔐','🔑','🛡️','📡','🔬','🧰','📐','🗜️','🪣','🪤','🧹','🔭','📸','🎥','🎛️']
};

function buildIconGrid(){
  const container=document.getElementById('iconGridContainer');
  container.innerHTML='';
  for(const[cat,icons]of Object.entries(ICON_CATEGORIES)){
    const label=document.createElement('div');
    label.className='icon-picker-category';
    label.textContent=cat;
    container.appendChild(label);
    const grid=document.createElement('div');
    grid.className='icon-picker-grid';
    icons.forEach(icon=>{
      const btn=document.createElement('button');
      btn.type='button';
      btn.className='icon-pick'+(icon===selectedIcon?' selected':'');
      btn.textContent=icon;
      btn.title=icon;
      btn.onclick=()=>pickIcon(icon);
      grid.appendChild(btn);
    });
    container.appendChild(grid);
  }
}

function pickIcon(icon){
  selectedIcon=icon;
  document.getElementById('appIcon').value=icon;
  document.getElementById('iconPickerPreview').textContent=icon;
  document.querySelectorAll('.icon-pick').forEach(b=>b.classList.toggle('selected',b.textContent===icon));
  document.getElementById('iconPickerDrop').classList.remove('open');
}

function toggleIconPicker(){
  const drop=document.getElementById('iconPickerDrop');
  if(drop.classList.toggle('open')){
    document.getElementById('iconSearch').value='';
    filterIcons('');
    document.getElementById('iconSearch').focus();
  }
}

function filterIcons(query){
  const q=(query||'').toLowerCase();
  document.querySelectorAll('#iconGridContainer .icon-picker-category').forEach(label=>{
    const grid=label.nextElementSibling;
    if(!q){label.style.display='';grid.querySelectorAll('.icon-pick').forEach(b=>b.style.display='');return;}
    const catMatch=label.textContent.toLowerCase().includes(q);
    let hasVisible=false;
    grid.querySelectorAll('.icon-pick').forEach(b=>{
      const show=catMatch||b.textContent.includes(q);
      b.style.display=show?'':'none';
      if(show)hasVisible=true;
    });
    label.style.display=hasVisible?'':'none';
  });
}

document.addEventListener('click',e=>{
  const wrap=document.querySelector('.icon-picker-wrap');
  if(wrap&&!wrap.contains(e.target))document.getElementById('iconPickerDrop').classList.remove('open');
});

/** Load apps from Azure Postgres; fall back to the local cache. */
async function loadApps(){
  try{
    const r=await fetch('/api/copper/suite_apps?is_active=eq.true&order=sort_order.asc,created_at.asc');
    if(r.ok){
      const data=await r.json();
      if(Array.isArray(data)){
        APPS=data;
        try{localStorage.setItem(CACHE_KEY,JSON.stringify(APPS));}catch(e){}
        setSyncStatus(true);
        return;
      }
    }
  }catch(err){
    console.error('Azure load failed:',err);
  }
  try{
    const raw=localStorage.getItem(CACHE_KEY);
    APPS=raw?JSON.parse(raw):[];
  }catch(e){APPS=[];}
  setSyncStatus(false);
}

/** Insert a new app row. */
async function insertApp(payload){
  const r=await fetch('/api/copper/suite_apps',{
    method:'POST',
    headers:{'Content-Type':'application/json','Accept':'application/json'},
    body:JSON.stringify(payload)
  });
  const rows=await r.json().catch(()=>null);
  if(!r.ok)throw new Error((rows&&rows.message)||'Could not save the app');
  return Array.isArray(rows)?rows[0]:rows;
}

/** Soft-delete an app (is_active = false). */
async function softDeleteApp(id){
  const r=await fetch('/api/copper/suite_apps?id=eq.'+encodeURIComponent(id)+'&is_builtin=eq.false',{
    method:'PATCH',
    headers:{'Content-Type':'application/json','Accept':'application/json'},
    body:JSON.stringify({is_active:false})
  });
  const rows=await r.json().catch(()=>null);
  if(!r.ok)throw new Error((rows&&rows.message)||'Could not remove the app');
  if(!rows||!rows.length)throw new Error('Nothing was removed.');
}

// ─── Rendering: Applications grid ─────────────────────────────────
function renderApps(){
  const grid=document.getElementById('appsGrid');
  grid.innerHTML='';

  if(!APPS.length){
    grid.innerHTML='<div class="grid-status">No applications configured yet.</div>';
    return;
  }

  APPS.forEach(app=>{
    const url=normalizeUrl(app.url);
    const isLocal=!url.startsWith('/')&&!/^https?:\/\//i.test(url);
    const tagsHtml=(app.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('');
    const chip=isLocal
      ? '<div class="live-chip"><span class="dot" style="background:var(--dim);box-shadow:0 0 0 3px rgba(90,100,120,.2)"></span> LOCAL</div>'
      : '<div class="live-chip"><span class="dot"></span> LIVE</div>';

    const card=document.createElement('div');
    card.className='app-card';
    card.innerHTML=`
      <div class="app-card-preview">
        <iframe src="${esc(url)}" loading="lazy" tabindex="-1" sandbox="allow-scripts allow-same-origin"></iframe>
        <div class="overlay"></div>
        ${chip}
      </div>
      <div class="app-card-body">
        <div class="app-card-meta">
          <div class="app-icon ${esc(app.color)}">${app.icon}</div>
          <div>
            <h3>${esc(app.name)}</h3>
            <span class="badge badge-${esc(app.color)}">${esc(app.badge)}</span>
          </div>
        </div>
        <div class="app-tags">${tagsHtml}</div>
        <a href="${esc(url)}" target="_blank" rel="noopener" class="btn btn-primary btn-launch">Launch App →</a>
      </div>`;
    grid.appendChild(card);
  });
}

// ─── Rendering: Manage list ───────────────────────────────────────
function renderManageList(){
  const list=document.getElementById('manageList');
  list.innerHTML='';

  if(!APPS.length){
    list.innerHTML='<div class="manage-empty">No applications found.</div>';
    return;
  }

  APPS.forEach(app=>{
    const item=document.createElement('div');
    item.className='manage-item';
    const action=app.is_builtin
      ? `<span class="badge badge-${esc(app.color)}" style="font-size:.65rem;padding:4px 10px;white-space:nowrap">BUILT-IN</span>`
      : `<button class="btn-del" data-id="${esc(app.id)}" title="Remove">✕</button>`;
    item.innerHTML=`
      <div class="app-icon ${esc(app.color)}" style="width:38px;height:38px;font-size:1.1rem">${app.icon}</div>
      <div class="manage-item-info">
        <h4>${esc(app.name)}</h4>
        <span>${esc(app.url)}</span>
      </div>
      ${action}`;
    const delBtn=item.querySelector('.btn-del');
    if(delBtn)delBtn.onclick=()=>deleteApp(app.id,app.name);
    list.appendChild(item);
  });
}

// ─── Actions ──────────────────────────────────────────────────────
async function saveApp(){
  const btn=document.querySelector('.form-actions .btn-primary');
  const name=document.getElementById('appName').value.trim();
  const rawUrl=document.getElementById('appUrl').value.trim();

  if(!name||!rawUrl){toast('App Name and URL are required.','error');return;}

  const payload={
    name,
    url:normalizeUrl(rawUrl),
    icon:document.getElementById('appIcon').value||selectedIcon||'📦',
    color:document.getElementById('appColor').value,
    badge:document.getElementById('appBadge').value.trim()||'App',
    tags:(document.getElementById('appTags').value||'').split(',').map(s=>s.trim()).filter(Boolean),
    description:document.getElementById('appDesc').value.trim()||null,
    sort_order:100+APPS.length,
    is_builtin:false
  };

  btn.disabled=true;
  btn.textContent='Saving…';
  try{
    await insertApp(payload);
    await loadApps();
    renderApps();
    renderManageList();
    resetForm();
    toast('“'+name+'” added — visible to all users.','success');
  }catch(err){
    console.error(err);
    let msg;
    if(err&&err.code==='23505')      msg='An app with that name already exists.';
    else if(err&&err.code==='42501') msg='Permission denied — your account cannot add apps.';
    else                             msg='Could not save: '+(err.message||'unknown error');
    toast(msg,'error');
  }finally{
    btn.disabled=false;
    btn.textContent='Add Application';
  }
}

async function deleteApp(id,name){
  if(!confirm('Remove “'+name+'” from the suite?\n\nThis affects all users.'))return;
  try{
    await softDeleteApp(id);
    await loadApps();
    renderApps();
    renderManageList();
    toast('“'+name+'” removed.','success');
  }catch(err){
    console.error(err);
    toast('Could not remove: '+(err.message||'unknown error'),'error');
  }
}

function resetForm(){
  ['appName','appUrl','appBadge','appTags','appDesc'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('appColor').value='red';
  selectedIcon='📦';
  document.getElementById('appIcon').value='📦';
  document.getElementById('iconPickerPreview').textContent='📦';
  document.querySelectorAll('.icon-pick').forEach(b=>b.classList.remove('selected'));
}

// ─── Keyboard ─────────────────────────────────────────────────────
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    closeLoginModal();
    document.getElementById('iconPickerDrop').classList.remove('open');
  }
});

// ─── Init ─────────────────────────────────────────────────────────
(async function init(){
  buildIconGrid();
  await loadApps();
  renderApps();
})();
</script>
</body>
